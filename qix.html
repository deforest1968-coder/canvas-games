// ---------- CONFIG ----------
const CELL = 8;
const HUD_TOP = 48, HUD_BOTTOM = 32;
// size the arena to fill almost the whole viewport
const availW = Math.floor(window.innerWidth * 0.97);
const availH = Math.floor(window.innerHeight * 0.87);
let COLS = Math.floor(availW / CELL);
let ROWS = Math.floor((availH - HUD_TOP - HUD_BOTTOM) / CELL);
COLS = Math.max(70, Math.min(260, COLS));
ROWS = Math.max(44, Math.min(160, ROWS));
const FIELD_W = COLS*CELL, FIELD_H = ROWS*CELL;
const CANVAS_W = FIELD_W, CANVAS_H = FIELD_H + HUD_TOP + HUD_BOTTOM;
const TARGET_PERCENT = 75;
const TITLE_TEXT = 'Q  I  X';
const TITLE_SIZE = 52;
const TITLE_Y = 150;



const canvas = document.getElementById('game');
canvas.width = CANVAS_W; canvas.height = CANVAS_H;
const ctx = canvas.getContext('2d');

// offscreen buffer for claimed territory (avoids redrawing thousands of cells/frame)
const buf = document.createElement('canvas');
buf.width = FIELD_W; buf.height = FIELD_H;
const bctx = buf.getContext('2d');

// scratch canvas used each frame to composite an animated shimmer, masked to whatever is
// currently claimed (via destination-in against buf), without permanently altering buf
const claimFx = document.createElement('canvas');
claimFx.width = FIELD_W; claimFx.height = FIELD_H;
const cfxCtx = claimFx.getContext('2d');

// small seamless circuit-line tile used as a repeating pattern over claimed territory
const circuitTile = document.createElement('canvas');
circuitTile.width = 24; circuitTile.height = 24;
(function buildCircuitTile(){
  const tctx = circuitTile.getContext('2d');
  tctx.strokeStyle = 'rgba(255,255,255,0.5)';
  tctx.lineWidth = 1;
  tctx.beginPath();
  tctx.moveTo(0,12); tctx.lineTo(24,12);
  tctx.moveTo(12,0); tctx.lineTo(12,24);
  tctx.stroke();
  tctx.fillStyle = 'rgba(255,255,255,0.6)';
  tctx.fillRect(10,10,4,4);
  tctx.fillRect(-1,-1,2,2);
  tctx.fillRect(23,23,2,2);
})();

// small scanline tile repeated across the field for a subtle CRT-monitor overlay
const scanTile = document.createElement('canvas');
scanTile.width = 4; scanTile.height = 4;
(function buildScanTile(){
  const sctx = scanTile.getContext('2d');
  sctx.fillStyle = 'rgba(0,0,0,0.55)';
  sctx.fillRect(0,0,4,1);
})();
const scanPattern = ctx.createPattern(scanTile, 'repeat');

// ---------- LEVEL BACKGROUND ART ----------
// each level cycles through one of these starfield/synthwave backdrops
const bgImages = LEVEL_BG_DATA.map(src=>{ const im = new Image(); im.src = src; return im; });
function currentBgImage(){
  return bgImages[(level-1) % bgImages.length];
}
let bgParallaxX = 0, bgParallaxY = 0;
function drawBackground(){
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, HUD_TOP, FIELD_W, FIELD_H);
  ctx.clip();
  const img = currentBgImage();
  if(img && img.complete && img.naturalWidth){
    // overscan the image so there's room to shift it for the parallax effect
    // without ever exposing an edge
    const overscan = 1.14;
    const scale = Math.max(FIELD_W/img.naturalWidth, FIELD_H/img.naturalHeight) * overscan;
    const dw = img.naturalWidth*scale, dh = img.naturalHeight*scale;
    const maxShiftX = (dw - FIELD_W)/2;
    const maxShiftY = (dh - FIELD_H)/2;

    // background drifts gently opposite to the player's position relative to
    // field center, giving a sense of depth behind the play field
    const px = (player.px||FIELD_W/2) - FIELD_W/2;
    const py = (player.py||FIELD_H/2) - FIELD_H/2;
    const targetX = Math.max(-maxShiftX, Math.min(maxShiftX, -px*0.16));
    const targetY = Math.max(-maxShiftY, Math.min(maxShiftY, -py*0.16));
    bgParallaxX += (targetX - bgParallaxX) * 0.04;
    bgParallaxY += (targetY - bgParallaxY) * 0.04;

    const dx = (FIELD_W-dw)/2 + bgParallaxX;
    const dy = HUD_TOP + (FIELD_H-dh)/2 + bgParallaxY;
    ctx.globalAlpha = 0.6;
    ctx.drawImage(img, dx, dy, dw, dh);
    // darken so foreground gameplay elements stay readable
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    ctx.fillRect(0, HUD_TOP, FIELD_W, FIELD_H);
  } else {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, HUD_TOP, FIELD_W, FIELD_H);
  }
  ctx.restore();
}

// ---------- CONTINUOUS BUZZ DRONE ----------
let buzz = null;
function initBuzz(){
  const a = ac(); if(!a || buzz) return;
  const osc = a.createOscillator();
  const osc2 = a.createOscillator();
  const filt = a.createBiquadFilter();
  const gain = a.createGain();
  osc.type = 'square'; osc2.type='sawtooth';
  osc.frequency.value = 90; osc2.frequency.value = 90.6;
  filt.type = 'lowpass'; filt.frequency.value = 700;
  gain.gain.value = 0.0001;
  osc.connect(filt); osc2.connect(filt);
  filt.connect(gain); gain.connect(a.destination);
  osc.start(); osc2.start();
  buzz = { osc, osc2, filt, gain };
}
function updateBuzz(dt){
  if(!buzz) return;
  const a = ac(); if(!a) return;
  let targetGain = 0.0001, targetFreq = 90;
  if(state === 'playing'){
    targetGain = 0.02;
    targetFreq = 88;
    if(player.onTrail){
      targetGain = player.fast ? 0.032 : 0.045;
      targetFreq = player.fast ? 132 : 100;
    }
    if(player.fuseActive) targetFreq += 55;
  }
  const now = a.currentTime;
  buzz.gain.gain.linearRampToValueAtTime(targetGain, now+0.1);
  buzz.osc.frequency.linearRampToValueAtTime(targetFreq, now+0.1);
  buzz.osc2.frequency.linearRampToValueAtTime(targetFreq*1.007, now+0.1);
}
function borderGlowIntensity(){
  if(buzz && state==='playing'){
    const v = buzz.gain.gain.value;
    return Math.max(0.15, Math.min(1, v/0.045));
  }
  // synthetic gentle breathing fallback when audio isn't driving it (demo, menu, etc.)
  return 0.45 + Math.sin(performance.now()/900)*0.3;
}

// ---------- GRID ----------
// 0 unclaimed, 1 claimed, 2 active trail
let grid = new Uint8Array(COLS*ROWS);
function idx(c,r){ return r*COLS+c; }
function inBounds(c,r){ return c>=0 && c<COLS && r>=0 && r<ROWS; }
function edgeOpen(c,r){
  // does this claimed cell border unclaimed/trail/out-of-field? (perimeter test for sparx)
  if(grid[idx(c,r)]!==1) return false;
  const nb = [[1,0],[-1,0],[0,1],[0,-1]];
  for(const [dc,dr] of nb){
    const nc=c+dc, nr=r+dr;
    if(!inBounds(nc,nr)) return true;
    if(grid[idx(nc,nr)]!==1) return true;
  }
  return false;
}
function pxOf(c){ return c*CELL + CELL/2; }
function pyOf(r){ return r*CELL + CELL/2; }

const shake = { t:0, dur:0, mag:0 };
function triggerShake(mag, dur){
  // only escalate if this shake is bigger than whatever's already playing out
  if(mag >= shake.mag*(shake.t/Math.max(1,shake.dur)) || shake.t<=0){
    shake.mag = mag; shake.dur = dur; shake.t = dur;
  }
}

// ---------- PARTICLES (sparx trail / spark fx) ----------
let particles = [];
function emitParticles(x,y,hue,count,speedMul,lifeMs){
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const sp = (0.02+Math.random()*0.05) * (speedMul||1);
    const life = lifeMs ? lifeMs*(0.7+Math.random()*0.6) : 260+Math.random()*260;
    particles.push({
      x, y,
      vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
      life: life,
      maxLife: lifeMs || 520,
      size: 1.2+Math.random()*2.2,
      hue: hue + (Math.random()*20-10)
    });
    if(particles.length > 400) particles.shift();
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.985; p.vy *= 0.985;
    p.life -= dt;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  ctx.save();
  ctx.translate(0, HUD_TOP);
  ctx.globalCompositeOperation = 'lighter';
  for(const p of particles){
    const a = Math.max(0, p.life/p.maxLife);
    ctx.beginPath();
    ctx.fillStyle = `hsla(${p.hue},100%,${55+a*20}%,${a*0.85})`;
    ctx.arc(p.x, p.y, p.size*(0.5+a), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

let claimGradient = null;
let claimGradientSlow = null;
let claimHue = 200;
function makeClaimGradient(){
  claimHue = (level*47 + 20) % 360;
  const g = bctx.createLinearGradient(0,0,FIELD_W,FIELD_H);
  const stops = 5;
  for(let i=0;i<=stops;i++){
    const h = (claimHue + i*(300/stops)) % 360;
    g.addColorStop(i/stops, `hsl(${h},85%,46%)`);
  }
  claimGradient = g;

  // hot gold/ember palette for slow, high-risk, high-value captures
  const gs = bctx.createLinearGradient(0,0,FIELD_W,FIELD_H);
  const slowStops = [
    [0.00, 'hsl(48,100%,52%)'],
    [0.25, 'hsl(32,100%,48%)'],
    [0.50, 'hsl(12,100%,46%)'],
    [0.75, 'hsl(45,100%,50%)'],
    [1.00, 'hsl(50,100%,55%)']
  ];
  for(const [pos,col] of slowStops) gs.addColorStop(pos, col);
  claimGradientSlow = gs;
}
function layBorder(){
  grid.fill(0);
  for(let c=0;c<COLS;c++){ grid[idx(c,0)]=1; grid[idx(c,ROWS-1)]=1; }
  for(let r=0;r<ROWS;r++){ grid[idx(0,r)]=1; grid[idx(COLS-1,r)]=1; }
  claimedInterior = 0;
  percent = 0;
  makeClaimGradient();
  bctx.clearRect(0,0,FIELD_W,FIELD_H);
  drawBorderToBuffer();
}
function drawBorderToBuffer(){
  bctx.save();
  bctx.shadowColor = '#8fe8ff';
  bctx.shadowBlur = 5;
  bctx.strokeStyle = '#e8e8e8';
  bctx.lineWidth = 2;
  bctx.strokeRect(1,1,FIELD_W-2,FIELD_H-2);
  bctx.restore();
}
function fillCellToBuffer(c,r,slow){
  bctx.fillStyle = slow ? claimGradientSlow : claimGradient;
  bctx.fillRect(c*CELL, r*CELL, CELL, CELL);
  // bright inner sheen for a glassy glow look
  const cx = c*CELL+CELL/2, cy = r*CELL+CELL/2;
  const sheen = bctx.createRadialGradient(cx,cy-CELL*0.2,0,cx,cy,CELL*0.9);
  sheen.addColorStop(0, 'rgba(255,255,255,0.28)');
  sheen.addColorStop(0.5, 'rgba(255,255,255,0.06)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  bctx.fillStyle = sheen;
  bctx.fillRect(c*CELL, r*CELL, CELL, CELL);
}
function glowEdgeCells(idxList, slow){
  const hue = slow ? 42 : (claimHue+180)%360;
  bctx.save();
  bctx.shadowColor = `hsla(${hue},100%,72%,0.95)`;
  bctx.shadowBlur = 7;
  bctx.strokeStyle = `hsla(${hue},100%,80%,0.9)`;
  bctx.lineWidth = 1.3;
  for(const i of idxList){
    const c = i % COLS, r = (i/COLS)|0;
    if(edgeOpen(c,r)){
      bctx.strokeRect(c*CELL+0.6, r*CELL+0.6, CELL-1.2, CELL-1.2);
    }
  }
  bctx.restore();
}

// ---------- CPU DEMO AI ----------
const ai = { mode:'patrol', diveSteps:0, diveDir:{dc:0,dr:0} };
function resetAI(){
  ai.mode = 'patrol';
  ai.diveSteps = 0;
  ai.diveDir = {dc:0,dr:0};
  player.fast = true;
}
function edgeDist(c,r){
  return { left:c, right:(COLS-1-c), top:r, bottom:(ROWS-1-r) };
}
function dirTowardNearestEdge(c,r){
  const d = edgeDist(c,r);
  const m = Math.min(d.left,d.right,d.top,d.bottom);
  if(m===d.left) return {dc:-1,dr:0};
  if(m===d.right) return {dc:1,dr:0};
  if(m===d.top) return {dc:0,dr:-1};
  return {dc:0,dr:1};
}
function inwardDir(c,r){
  const e = dirTowardNearestEdge(c,r);
  return {dc:-e.dc, dr:-e.dr};
}
function patrolDir(c,r){
  if(r===0) return {dc:1,dr:0};
  if(c===COLS-1) return {dc:0,dr:1};
  if(r===ROWS-1) return {dc:-1,dr:0};
  if(c===0) return {dc:0,dr:-1};
  return dirTowardNearestEdge(c,r);
}
function aiSafe(dc,dr){
  const nc = player.c+dc, nr = player.r+dr;
  if(!inBounds(nc,nr)) return false;
  const st = grid[idx(nc,nr)];
  if(player.onTrail && st===2) return false;
  const nx = pxOf(nc), ny = pyOf(nr);
  if(Math.hypot(qix.x-nx, qix.y-ny) < CELL*3.4) return false;
  for(const s of sparx){ if(s.c===nc && s.r===nr) return false; }
  return true;
}
const CARDINALS = [{dc:1,dr:0},{dc:-1,dr:0},{dc:0,dr:1},{dc:0,dr:-1}];
function aiSafeAlternative(preferred){
  if(aiSafe(preferred.dc,preferred.dr)) return preferred;
  const opts = CARDINALS.slice().sort(()=>Math.random()-0.5);
  for(const o of opts){ if(aiSafe(o.dc,o.dr)) return o; }
  return {dc:0,dr:0};
}
function aiDecideDirection(){
  const p = player;
  if(p.onTrail){
    if(ai.mode !== 'returning'){
      ai.diveSteps--;
      if(ai.diveSteps <= 0 || Math.random() < 0.015){
        ai.mode = 'returning';
      }
    }
    const preferred = (ai.mode==='returning') ? dirTowardNearestEdge(p.c,p.r) : ai.diveDir;
    return aiSafeAlternative(preferred);
  } else {
    ai.mode = 'patrol';
    if(percent < 88 && Math.random() < 0.012){
      ai.mode = 'diving';
      ai.diveSteps = 7 + Math.floor(Math.random()*11);
      ai.diveDir = inwardDir(p.c,p.r);
      player.fast = Math.random() < 0.72;
      return aiSafeAlternative(ai.diveDir);
    }
    player.fast = true;
    return aiSafeAlternative(patrolDir(p.c,p.r));
  }
}

// ---------- FLOOD FILL CLAIM ----------
function completeStix(){
  sfx.capture();
  // mark trail cells as barrier temporarily (status 2 already distinct from 0/1)
  const total = COLS*ROWS;
  const visited = new Uint8Array(total);
  const {c:qc, r:qr} = qixCell();

  // find all connected components of status==0
  const comps = []; // array of {cells:[idx...], hasQix:bool}
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const i = idx(c,r);
      if(grid[i]===0 && !visited[i]){
        // BFS
        const stack=[i]; visited[i]=1;
        const cells=[]; let hasQix=false;
        while(stack.length){
          const cur = stack.pop();
          cells.push(cur);
          const cc = cur % COLS, cr = (cur/COLS)|0;
          if(cc===qc && cr===qr) hasQix = true;
          const nbrs = [[1,0],[-1,0],[0,1],[0,-1]];
          for(const [dc,dr] of nbrs){
            const nc=cc+dc, nr=cr+dr;
            if(!inBounds(nc,nr)) continue;
            const ni = idx(nc,nr);
            if(grid[ni]===0 && !visited[ni]){ visited[ni]=1; stack.push(ni); }
          }
        }
        comps.push({cells, hasQix});
      }
    }
  }

  let newlyClaimed = 0;
  const newlyClaimedIdx = [];
  const wasSlow = !player.fast;

  for(const comp of comps){
    if(!comp.hasQix){
      for(const i of comp.cells){
        grid[i] = 1;
        const c = i % COLS, r = (i/COLS)|0;
        fillCellToBuffer(c,r,wasSlow);
        newlyClaimedIdx.push(i);
        newlyClaimed++;
      }
    }
  }
  // convert trail to claimed too
  for(const p of player.trail){
    const i = idx(p.c,p.r);
    if(grid[i] !== 1){
      grid[i] = 1;
      fillCellToBuffer(p.c,p.r,wasSlow);
      newlyClaimedIdx.push(i);
      newlyClaimed++;
    }
  }
  glowEdgeCells(newlyClaimedIdx, wasSlow);
  claimedInterior += newlyClaimed;
  percent = Math.min(100, (claimedInterior/totalInterior)*100);

  // shake magnitude/duration scale with how much of the field was just claimed
  const captureFraction = newlyClaimed / totalInterior;
  const shakeMag = Math.min(24, 3 + captureFraction*170);
  const shakeDur = Math.min(700, 160 + captureFraction*1700);
  triggerShake(shakeMag, shakeDur);

  const mult = player.fast ? 1 : 2;
  score += newlyClaimed * mult;
  if(score > highScore){ highScore = score; try{ localStorage.setItem('qix_hs', String(highScore)); }catch(e){} }

  while(score >= nextLifeScore){
    lives++;
    nextLifeScore += EXTRA_LIFE_SCORE;
    extraLifeMsgTimer = 1900;
    sfx.extraLife();
    emitParticles(player.px, player.py, 130, 30, 1.6);
  }

  player.trail = [];
  player.trailSet = new Set();
  player.onTrail = false;
  player.fuseActive = false;
  player.drawAcc = 0;

  if(percent >= TARGET_PERCENT){
    state = 'levelclear';
    const bigClear = percent >= 80;
    msgTimer = bigClear ? 2600 : 2000;
    if(bigClear){
      sfx.levelupBig();
      triggerShake(10, 500);
      emitParticles(FIELD_W/2, FIELD_H/2, claimHue, 60, 2.4);
    } else {
      sfx.levelup();
    }
  }
}

function abortStix(){
  for(const p of player.trail){
    grid[idx(p.c,p.r)] = 0;
  }
  player.trail = [];
  player.trailSet = new Set();
  player.onTrail = false;
  player.fuseActive = false;
  player.drawAcc = 0;
}

function die(){
  if(invuln > 0 || respawnTimer > 0) return;
  playBoom();
  emitParticles(player.px, player.py, 0, 40, 2.2);
  lives--;
  abortStix();
  flashT = 1600;
  triggerShake(14, 400);
  player.c = Math.floor(COLS/2); player.r = 0;
  player.px = player.fromPx = pxOf(player.c);
  player.py = player.fromPy = pyOf(player.r);
  player.moveT = 1;
  if(lives <= 0){
    state = 'gameover';
    msgTimer = 0;
    sfx.gameover();
  } else {
    respawnTimer = RESPAWN_MS;
    invuln = RESPAWN_MS + 900;
  }
}

// ---------- OPTIONAL GAMEPAD SUPPORT ----------
// Left stick or D-pad to move, A / either trigger to draw slow (2x pts), Start to
// launch/pause, any button cancels demo mode — mirrors the keyboard controls 1:1.
let gamepadConnected = false;
let gpPrevButtons = [];
window.addEventListener('gamepadconnected', ()=>{ gamepadConnected = true; });
window.addEventListener('gamepaddisconnected', ()=>{
  gamepadConnected = (getGamepad() !== null);
});
function getGamepad(){
  if(!navigator.getGamepads) return null;
  const pads = navigator.getGamepads();
  for(const p of pads){ if(p && p.connected) return p; }
  return null;
}
function gamepadDir(){
  const gp = getGamepad();
  let dc=0, dr=0;
  if(!gp) return {dc,dr};
  const DEAD = 0.35;
  const ax = gp.axes[0]||0, ay = gp.axes[1]||0;
  if(ax < -DEAD) dc -= 1;
  if(ax > DEAD) dc += 1;
  if(ay < -DEAD) dr -= 1;
  if(ay > DEAD) dr += 1;
  const b = gp.buttons;
  if(b[14] && b[14].pressed) dc -= 1; // d-pad left
  if(b[15] && b[15].pressed) dc += 1; // d-pad right
  if(b[12] && b[12].pressed) dr -= 1; // d-pad up
  if(b[13] && b[13].pressed) dr += 1; // d-pad down
  dc = Math.max(-1, Math.min(1, dc));
  dr = Math.max(-1, Math.min(1, dr));
  return {dc,dr};
}
function gamepadSlowHeld(){
  const gp = getGamepad();
  if(!gp) return false;
  const b = gp.buttons;
  return !!((b[6]&&b[6].pressed) || (b[7]&&b[7].pressed) || (b[0]&&b[0].pressed));
}
// polls Start/A for edge-triggered actions (launch, pause, demo-cancel) once per frame
function pollGamepadActions(){
  const gp = getGamepad();
  if(!gp){ gpPrevButtons = []; return; }
  const cur = gp.buttons.map(b=>b.pressed);
  const justPressed = (i)=> cur[i] && !gpPrevButtons[i];
  const anyJustPressed = cur.some((v,i)=> v && !gpPrevButtons[i]);
  const startPressed = justPressed(9) || justPressed(0);
  gpPrevButtons = cur;

  if(!anyJustPressed) return;
  idleTimer = 0;
  if(demoMode){ demoMode = false; state = 'menu'; }
  if(startPressed && (state==='menu' || state==='gameover')){
    ac(); initBuzz(); sfx.start();
    launchTransition = LAUNCH_TRANSITION_MS;
    newGame();
  } else if(startPressed && state==='playing'){
    state = 'paused';
  } else if(startPressed && state==='paused'){
    state = 'playing';
  }
}

function dirFromKeys(){
  let dc=0, dr=0;
  if(keys['ArrowLeft']||keys['a']||keys['A']) dc-=1;
  if(keys['ArrowRight']||keys['d']||keys['D']) dc+=1;
  if(keys['ArrowUp']||keys['w']||keys['W']) dr-=1;
  if(keys['ArrowDown']||keys['s']||keys['S']) dr+=1;
  if(dc===0 && dr===0){
    const gd = gamepadDir();
    dc = gd.dc; dr = gd.dr;
  }
  return {dc,dr};
}

// ---------- PLAYER MOVE LOGIC ----------
function attemptMove(dc,dr){
  if(dc===0 && dr===0) return;
  const nc = player.c+dc, nr = player.r+dr;
  if(!inBounds(nc,nr)) return;
  const targetStatus = grid[idx(nc,nr)];

  if(player.onTrail){
    if(targetStatus === 2){
      // self intersection (shouldn't normally happen since we only mark ahead)
      die();
      return;
    } else if(targetStatus === 0){
      grid[idx(nc,nr)] = 2;
      player.trail.push({c:nc,r:nr});
      player.trailSet.add(nc+','+nr);
      sfx.draw();
      commitMove(nc,nr);
    } else if(targetStatus === 1){
      commitMove(nc,nr);
      completeStix();
    }
  } else {
    if(targetStatus === 1){
      commitMove(nc,nr);
      if(Math.random()<0.5) sfx.step();
    } else if(targetStatus === 0){
      grid[idx(nc,nr)] = 2;
      player.trail = [{c:nc,r:nr}];
      player.trailSet = new Set([nc+','+nr]);
      player.onTrail = true;
      player.drawAcc = 0;
      player.fuseActive = false;
      sfx.draw();
      commitMove(nc,nr);
    }
  }
}
function commitMove(nc,nr){
  player.fromPx = player.px; player.fromPy = player.py;
  player.c = nc; player.r = nr;
  player.moveT = 0;
}

// ---------- SPARX MOVE ----------
const DIRS4 = [[1,0],[0,1],[-1,0],[0,-1]];
function isRingCell(c,r){ return c===0 || c===COLS-1 || r===0 || r===ROWS-1; }
function cellExits(c,r,excludeDir){
  // how many valid moves does this cell have, not counting excludeDir (used to detect dead-ends)
  let n = 0;
  for(let i=0;i<4;i++){
    if(i===excludeDir) continue;
    const [dc,dr] = DIRS4[i];
    const nc=c+dc, nr=r+dr;
    if(!inBounds(nc,nr)) continue;
    const st = grid[idx(nc,nr)];
    if((st===1 && edgeOpen(nc,nr)) || st===2) n++;
  }
  return n;
}
function moveSparx(s){
  let cands = [];
  for(let i=0;i<4;i++){
    const [dc,dr] = DIRS4[i];
    const nc = s.c+dc, nr = s.r+dr;
    if(!inBounds(nc,nr)) continue;
    if(grid[idx(nc,nr)]===1 && edgeOpen(nc,nr)){
      cands.push(i);
    } else if(grid[idx(nc,nr)]===2){
      cands.push(i); // sparx can strike an active trail line -> threat
    }
  }
  // fallback: field around this sparx may have become fully enclosed by later captures,
  // leaving no "edge" cells reachable — allow plain claimed neighbors so it never freezes
  if(cands.length===0){
    for(let i=0;i<4;i++){
      const [dc,dr] = DIRS4[i];
      const nc = s.c+dc, nr = s.r+dr;
      if(inBounds(nc,nr) && grid[idx(nc,nr)]===1) cands.push(i);
    }
  }
  if(cands.length===0) return; // truly isolated, nothing to do

  const reverse = (s.dir+2)%4;
  let pool = cands.filter(i=>i!==reverse);
  if(pool.length===0) pool = cands;

  // strongly prefer branching onto already-claimed interior lines over just looping the outer
  // border, so sparx patrol territory you've captured — but never actively seek out the
  // player's currently-forming line; that's dangerous to cross by chance, not something sparx
  // should be drawn toward on purpose. Skip branches that are immediate 1-cell dead-ends too.
  const interiorOptions = pool.filter(i=>{
    const [dc,dr] = DIRS4[i];
    const nc = s.c+dc, nr = s.r+dr;
    if(grid[idx(nc,nr)] !== 1) return false; // excludes active trail (status 2)
    if(isRingCell(nc,nr)) return false;
    const incomingDir = (i+2)%4;
    return cellExits(nc,nr,incomingDir) > 0;
  });

  let choice;
  if(interiorOptions.length > 0 && Math.random() < 0.5){
    choice = interiorOptions[(Math.random()*interiorOptions.length)|0];
  } else if(pool.includes(s.dir) && Math.random()<0.65){
    choice = s.dir;
  } else {
    choice = pool[(Math.random()*pool.length)|0];
  }
  const [dc,dr] = DIRS4[choice];
  s.prevX = pxOf(s.c); s.prevY = pyOf(s.r);
  s.c += dc; s.r += dr; s.dir = choice;
  if(Math.random() < 0.22) sfx.sparxTick();
}

// ---------- QIX MOVE ----------
function updateQix(dt){
  qix.retarget -= dt;
  if(qix.retarget <= 0){
    const base = qix.retargetMin || 260;
    qix.retarget = base + Math.random()*500;
    const ang = Math.atan2(qix.vy,qix.vx) + (Math.random()-0.5)*2.2;
    const sp = qix.speed;
    qix.vx = Math.cos(ang)*sp; qix.vy = Math.sin(ang)*sp;
  }
  let nx = qix.x + qix.vx*dt;
  let ny = qix.y + qix.vy*dt;
  const margin = CELL*1.5;

  function blocked(x,y){
    const c = Math.floor(x/CELL), r = Math.floor(y/CELL);
    if(!inBounds(c,r)) return true;
    const s = grid[idx(c,r)];
    return s===1 || s===2;
  }
  let bounced = false;
  if(nx < margin || nx > FIELD_W-margin || blocked(nx, qix.y)){
    qix.vx *= -1;
    nx = qix.x + qix.vx*dt;
    bounced = true;
  }
  if(ny < margin || ny > FIELD_H-margin || blocked(qix.x, ny)){
    qix.vy *= -1;
    ny = qix.y + qix.vy*dt;
    bounced = true;
  }
  qix.bounceCd = (qix.bounceCd||0) - dt;
  if(bounced && qix.bounceCd <= 0){
    sfx.bounce();
    qix.bounceCd = 150;
  }
  qix.x = Math.max(margin, Math.min(FIELD_W-margin, nx));
  qix.y = Math.max(margin, Math.min(FIELD_H-margin, ny));

  // ghost trail: sample recent positions for a fading motion trail
  qix.trailAcc = (qix.trailAcc||0) + dt;
  if(!qix.ghostTrail) qix.ghostTrail = [];
  if(qix.trailAcc > 28){
    qix.trailAcc = 0;
    qix.ghostTrail.push({x:qix.x, y:qix.y, born:performance.now()});
    if(qix.ghostTrail.length > 14) qix.ghostTrail.shift();
  }
  const now = performance.now();
  qix.ghostTrail = qix.ghostTrail.filter(p => now - p.born < 340);
}

// ---------- COLLISION ----------
function checkCollisions(){
  if(invuln > 0) return;
  // qix vs player / trail
  const qr = CELL*2.6;
  const dxp = qix.x-player.px, dyp = qix.y-player.py;
  if(dxp*dxp+dyp*dyp < qr*qr){ die(); return; }
  if(player.onTrail){
    for(const p of player.trail){
      const tx = pxOf(p.c), ty = pyOf(p.r);
      const dx = qix.x-tx, dy = qix.y-ty;
      if(dx*dx+dy*dy < qr*qr){ die(); return; }
    }
  }
  // sparx vs player / trail
  for(const s of sparx){
    if(s.c===player.c && s.r===player.r){ die(); return; }
    if(player.onTrail && player.trailSet.has(s.c+','+s.r)){ die(); return; }
  }
  // fuse vs player
  if(player.fuseActive){
    const fi = Math.min(player.fuseIndex, player.trail.length-1);
    if(fi >= 0){
      const fp = player.trail[fi];
      if(fp && fp.c===player.c && fp.r===player.r){ die(); return; }
    }
  }
}

// ---------- MAIN UPDATE ----------
let lastT = 0;
function update(dt){
  if(invuln>0) invuln = Math.max(0, invuln-dt);
  flashT = Math.max(0, flashT-dt);
  if(shake.t>0) shake.t = Math.max(0, shake.t-dt);
  if(extraLifeMsgTimer>0) extraLifeMsgTimer = Math.max(0, extraLifeMsgTimer-dt);
  if(speedBoostTimer>0) speedBoostTimer = Math.max(0, speedBoostTimer-dt);
  if(speedMsgTimer>0) speedMsgTimer = Math.max(0, speedMsgTimer-dt);
  updateBuzz(dt);
  pollGamepadActions();

  if(state === 'playing' || state === 'demo'){
   if(respawnTimer > 0){
    respawnTimer = Math.max(0, respawnTimer - dt);
    updateParticles(dt);
   } else {
    if(state==='playing'){
      player.fast = !(keys['Shift'] || gamepadSlowHeld());
    }
    // player movement ticking
    player.moveAcc += dt;
    let delay = player.fast ? player.moveDelay : player.moveDelay*1.6;
    if(speedBoostTimer > 0) delay *= 0.55;
    while(player.moveAcc >= delay){
      player.moveAcc -= delay;
      const {dc,dr} = (state==='demo') ? aiDecideDirection() : dirFromKeys();
      if(dc!==0||dr!==0) attemptMove(dc,dr);
    }
    // smooth render interpolation
    player.moveT = Math.min(1, player.moveT + dt/Math.max(30,delay));
    player.px = player.fromPx + (pxOf(player.c)-player.fromPx)*player.moveT;
    player.py = player.fromPy + (pyOf(player.r)-player.fromPy)*player.moveT;

    // speed powerup: spawn/despawn/pickup
    if(speedPowerup){
      if(player.c===speedPowerup.c && player.r===speedPowerup.r){
        speedBoostTimer = SPEED_BOOST_MS;
        speedMsgTimer = 1600;
        speedPowerup = null;
        speedSpawnTimer = 7000 + Math.random()*8000;
        sfx.speedPickup();
        emitParticles(pxOf(player.c), pyOf(player.r), 52, 32, 2.0);
        triggerShake(4, 150);
      } else if(performance.now() - speedPowerup.born > SPEED_POWERUP_LIFESPAN_MS){
        speedPowerup = null;
        speedSpawnTimer = 3000 + Math.random()*4000;
      }
    } else {
      speedSpawnTimer -= dt;
      if(speedSpawnTimer <= 0){
        if(!trySpawnSpeedPowerup()) speedSpawnTimer = 1500;
      }
    }

    // fuse
    if(player.onTrail){
      player.drawAcc += dt;
      if(!player.fuseActive && player.drawAcc > fuseTriggerMs){
        player.fuseActive = true;
        player.fuseIndex = 0;
        player.fuseAcc = 0;
        sfx.fuseIgnite();
      }
      if(player.fuseActive){
        player.fuseAcc += dt;
        while(player.fuseAcc >= FUSE_SPEED){
          player.fuseAcc -= FUSE_SPEED;
          player.fuseIndex++;
          if(Math.random()<0.3) sfx.spark();
        }
      }
    } else {
      player.drawAcc = 0;
      player.fuseActive = false;
    }

    updateQix(dt);

    for(const s of sparx){
      s.acc += dt;
      while(s.acc >= s.delay){
        s.acc -= s.delay;
        moveSparx(s);
      }
      // continuous trailing sparks along direction of travel
      const t = Math.min(1, s.acc/s.delay);
      const sx = s.prevX + (pxOf(s.c)-s.prevX)*t;
      const sy = s.prevY + (pyOf(s.r)-s.prevY)*t;
      s._rx = sx; s._ry = sy;
      if(Math.random() < 0.85) emitParticles(sx, sy, s.hue, 1, 0.6);
    }

    // ambient drifting dust across the open field for atmosphere
    if(Math.random() < 0.045){
      for(let tries=0; tries<4; tries++){
        const c = Math.floor(Math.random()*COLS), r = Math.floor(Math.random()*ROWS);
        if(grid[idx(c,r)] === 0){
          emitParticles(pxOf(c), pyOf(r), 200, 1, 0.12, 3800);
          break;
        }
      }
    }

    updateParticles(dt);
    checkCollisions();
   }

  } else if(state === 'levelclear'){
    msgTimer -= dt;
    if(msgTimer <= 0){
      level++;
      startLevel();
      if(demoMode) state = 'demo';
    }
  } else if(state === 'menu'){
    idleTimer += dt;
    if(idleTimer > IDLE_TO_DEMO_MS){ idleTimer = 0; startDemo(); }
    // ambient backdrop motion
    updateQix(dt);
    if(Math.random() < 0.06){
      emitParticles(Math.random()*FIELD_W, Math.random()*FIELD_H, Math.random()*360, 1, 0.3);
    }
    updateParticles(dt);
  } else if(state === 'gameover'){
    idleTimer += dt;
    const threshold = demoMode ? DEMO_LOOP_MS : IDLE_TO_DEMO_MS;
    if(idleTimer > threshold){ idleTimer = 0; startDemo(); }
  }
  if(launchTransition > 0) launchTransition = Math.max(0, launchTransition - dt);
}

// ---------- RENDER ----------
function drawTrail(){
  if(player.trail.length===0) return;
  ctx.save();
  ctx.translate(0, HUD_TOP);

  // soft solid glow pass underneath for readability/visibility
  ctx.strokeStyle = '#fff200';
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = 0.35;
  ctx.shadowColor = '#fff200';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(pxOf(player.trail[0].c), pyOf(player.trail[0].r));
  for(let i=1;i<player.trail.length;i++){
    ctx.lineTo(pxOf(player.trail[i].c), pyOf(player.trail[i].r));
  }
  ctx.lineTo(player.px, player.py);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // animated "marching ants" dash on top
  ctx.lineWidth = 2.2;
  ctx.shadowBlur = 4;
  ctx.setLineDash([6,5]);
  ctx.lineDashOffset = -(performance.now()/22) % 11;
  ctx.beginPath();
  ctx.moveTo(pxOf(player.trail[0].c), pyOf(player.trail[0].r));
  for(let i=1;i<player.trail.length;i++){
    ctx.lineTo(pxOf(player.trail[i].c), pyOf(player.trail[i].r));
  }
  ctx.lineTo(player.px, player.py);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  if(player.fuseActive){
    const fi = Math.min(player.fuseIndex, player.trail.length-1);
    if(fi>=0){
      const fp = player.trail[fi];
      ctx.save();
      ctx.translate(0, HUD_TOP);
      const t = performance.now()/60;
      ctx.fillStyle = (Math.floor(t)%2===0) ? '#ff5500' : '#ffcc00';
      ctx.beginPath();
      ctx.arc(pxOf(fp.c), pyOf(fp.r), 4, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawPlayer(){
  if(invuln>0 && Math.floor(performance.now()/80)%2===0) return; // blink while invulnerable
  ctx.save();
  ctx.translate(0, HUD_TOP);
  const x=player.px, y=player.py;
  const t = performance.now();
  const pulse = 1 + Math.sin(t/180)*0.14;
  const s = 10*pulse;
  const boosted = speedBoostTimer > 0;
  const haloColor = boosted ? '255,225,60' : '80,180,255';
  const coreColor = boosted ? '#fff6c2' : '#eafcff';
  const glowColor = boosted ? '#ffe63c' : '#7fe8ff';
  const edgeColor = boosted ? '#ffcf20' : '#00e5ff';

  // outer soft halo (large, low alpha, additive-ish)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(x,y,0,x,y,s*3.4);
  halo.addColorStop(0, `rgba(${haloColor},0.55)`);
  halo.addColorStop(0.5, `rgba(${haloColor},0.18)`);
  halo.addColorStop(1, `rgba(${haloColor},0)`);
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(x, y, s*3.4, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // glowing diamond core
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 18;
  ctx.fillStyle = coreColor;
  ctx.beginPath();
  ctx.moveTo(x, y-s); ctx.lineTo(x+s, y); ctx.lineTo(x, y+s); ctx.lineTo(x-s, y);
  ctx.closePath();
  ctx.fill();

  // bright inner spark
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(x, y, s*0.32, 0, Math.PI*2);
  ctx.fill();

  // thin outline for crispness
  ctx.shadowBlur = 0;
  ctx.strokeStyle = edgeColor;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(x, y-s); ctx.lineTo(x+s, y); ctx.lineTo(x, y+s); ctx.lineTo(x-s, y);
  ctx.closePath();
  ctx.stroke();

  ctx.restore();
}

function drawQixGhostTrail(){
  if(!qix.ghostTrail || qix.ghostTrail.length===0) return;
  const now = performance.now();
  ctx.save();
  ctx.translate(0, HUD_TOP);
  ctx.globalCompositeOperation = 'lighter';
  for(const p of qix.ghostTrail){
    const age = now - p.born;
    const a = Math.max(0, 1 - age/340);
    if(a <= 0) continue;
    const r = CELL*1.5*a + 1.5;
    const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    g.addColorStop(0, `hsla(${(now/8)%360},100%,65%,${a*0.35})`);
    g.addColorStop(1, `hsla(${(now/8)%360},100%,55%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawQix(){
  ctx.save();
  ctx.translate(0, HUD_TOP);
  const t = performance.now();
  const hue = (t/8) % 360;
  ctx.strokeStyle = `hsl(${hue},100%,65%)`;
  ctx.lineWidth = 3;
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = 12;
  // jittery chaotic stick figure around center
  const n = 6;
  let px = qix.x, py = qix.y;
  ctx.beginPath();
  ctx.moveTo(px,py);
  let seedAng = Math.atan2(qix.vy,qix.vx);
  for(let i=0;i<n;i++){
    const ang = seedAng + Math.sin(t/140 + i*1.7)*2.4 + i*1.15;
    const len = 16 + 22*Math.abs(Math.sin(t/97 + i*2.3));
    px += Math.cos(ang)*len;
    py += Math.sin(ang)*len;
    ctx.lineTo(px,py);
  }
  ctx.stroke();
  // mirror set for fuller shape
  ctx.strokeStyle = `hsl(${(hue+180)%360},100%,60%)`;
  ctx.beginPath();
  px = qix.x; py = qix.y;
  ctx.moveTo(px,py);
  for(let i=0;i<n;i++){
    const ang = seedAng+Math.PI + Math.cos(t/130 + i*1.3)*2.1 + i*1.0;
    const len = 13 + 19*Math.abs(Math.cos(t/110 + i*1.9));
    px += Math.cos(ang)*len;
    py += Math.sin(ang)*len;
    ctx.lineTo(px,py);
  }
  ctx.stroke();
  ctx.restore();
}

function drawSpeedPowerup(){
  if(!speedPowerup) return;
  const t = performance.now();
  const age = t - speedPowerup.born;
  const warn = age > SPEED_POWERUP_LIFESPAN_MS - 3000; // blink before despawning
  if(warn && Math.floor(t/140)%2===0) return;

  const x = pxOf(speedPowerup.c), y = pyOf(speedPowerup.r);
  const pulse = 1 + Math.sin(t/160)*0.18;
  ctx.save();
  ctx.translate(0, HUD_TOP);

  // halo
  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(x,y,0,x,y,CELL*3.2*pulse);
  halo.addColorStop(0,'rgba(255,230,60,0.6)');
  halo.addColorStop(1,'rgba(255,230,60,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(x,y,CELL*3.2*pulse,0,Math.PI*2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // lightning bolt icon
  const s = 7*pulse;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(Math.sin(t/500)*0.15);
  ctx.shadowColor = '#ffe63c';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#ffe63c';
  ctx.beginPath();
  ctx.moveTo(2*s*0.2, -s);
  ctx.lineTo(-s*0.55, s*0.15);
  ctx.lineTo(0, s*0.15);
  ctx.lineTo(-2*s*0.2, s);
  ctx.lineTo(s*0.55, -s*0.15);
  ctx.lineTo(0, -s*0.15);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // label
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px "Courier New", monospace';
  ctx.fillStyle = '#ffe63c';
  ctx.shadowColor = '#ffe63c';
  ctx.shadowBlur = 8;
  ctx.fillText('SPEED', x, y - CELL*2.3);

  ctx.restore();
}

function drawSparx(){
  ctx.save();
  ctx.translate(0, HUD_TOP);
  const t = performance.now();
  for(const s of sparx){
    const x = (s._rx!=null)?s._rx:pxOf(s.c), y = (s._ry!=null)?s._ry:pyOf(s.r);
    const pulse = 1 + Math.sin(t/90 + s.hue)*0.2;
    const size = 10*pulse;

    // soft halo
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const halo = ctx.createRadialGradient(x,y,0,x,y,size*3);
    halo.addColorStop(0, `hsla(${s.hue},100%,60%,0.55)`);
    halo.addColorStop(1, `hsla(${s.hue},100%,50%,0)`);
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(x,y,size*3,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    // glowing diamond core
    ctx.shadowColor = `hsl(${s.hue},100%,55%)`;
    ctx.shadowBlur = 14;
    ctx.fillStyle = `hsl(${s.hue},100%,58%)`;
    ctx.beginPath();
    ctx.moveTo(x, y-size); ctx.lineTo(x+size, y); ctx.lineTo(x, y+size); ctx.lineTo(x-size, y);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 6;
    ctx.fillStyle = '#fff6e0';
    ctx.beginPath();
    ctx.arc(x, y, size*0.28, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawHUD(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,CANVAS_W,HUD_TOP);
  ctx.fillRect(0,CANVAS_H-HUD_BOTTOM,CANVAS_W,HUD_BOTTOM);

  ctx.textBaseline = 'top';
  ctx.font = '16px "Courier New", monospace';
  ctx.fillStyle = '#00eaff';
  ctx.fillText('SCORE', 12, 6);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px "Courier New", monospace';
  ctx.fillText(String(score).padStart(6,'0'), 12, 24);

  ctx.font = '16px "Courier New", monospace';
  ctx.fillStyle = '#ff2fd0';
  ctx.textAlign = 'center';
  ctx.fillText('HIGH', CANVAS_W/2, 6);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px "Courier New", monospace';
  ctx.fillText(String(highScore).padStart(6,'0'), CANVAS_W/2, 24);
  ctx.textAlign = 'left';

  ctx.font = '16px "Courier New", monospace';
  ctx.fillStyle = '#39ff14';
  ctx.textAlign = 'right';
  ctx.fillText('AREA', CANVAS_W-12, 6);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px "Courier New", monospace';
  ctx.fillText(Math.floor(percent)+'%', CANVAS_W-12, 24);
  ctx.textAlign = 'left';

  // bottom bar: lives + level
  const by = CANVAS_H-HUD_BOTTOM;
  ctx.fillStyle = '#fff';
  for(let i=0;i<Math.max(0,lives-1);i++){
    const x = 16 + i*18, y = by+16;
    ctx.beginPath();
    ctx.moveTo(x,y-5); ctx.lineTo(x+5,y); ctx.lineTo(x,y+5); ctx.lineTo(x-5,y);
    ctx.closePath(); ctx.fill();
  }
  const lvlPulse = 1 + Math.sin(performance.now()/400)*0.08;
  ctx.save();
  ctx.textAlign = 'right';
  ctx.font = `bold ${Math.round(16*lvlPulse)}px "Courier New", monospace`;
  ctx.fillStyle = '#ffae00';
  ctx.shadowColor = '#ffae00';
  ctx.shadowBlur = 8;
  ctx.fillText('LEVEL ' + level, CANVAS_W-12, by+9);
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.fillStyle = '#555';
  ctx.font = '12px "Courier New", monospace';
  ctx.fillText('GOAL '+TARGET_PERCENT+'%', CANVAS_W/2-34, by+9);
}

function drawFieldBorderGlow(){
  const intensity = borderGlowIntensity();
  const hue = (claimHue + 180) % 360;
  ctx.save();
  ctx.shadowColor = `hsla(${hue},100%,65%,${0.6*intensity})`;
  ctx.shadowBlur = 8 + intensity*20;
  ctx.strokeStyle = `hsla(${hue},100%,70%,${0.25+intensity*0.45})`;
  ctx.lineWidth = 1.5 + intensity*2;
  ctx.strokeRect(1, HUD_TOP+1, FIELD_W-2, FIELD_H-2);
  ctx.restore();
}

function drawField(){
  const t = performance.now();
  ctx.save();
  ctx.filter = `hue-rotate(${(t/60)%360}deg) saturate(1.15) brightness(1.06)`;
  ctx.shadowColor = `hsla(${claimHue},100%,60%,0.5)`;
  ctx.shadowBlur = 10;
  ctx.drawImage(buf, 0, HUD_TOP);
  ctx.restore();

  // animated circuit-line shimmer, masked to exactly whatever is currently claimed
  cfxCtx.clearRect(0,0,FIELD_W,FIELD_H);
  cfxCtx.save();
  const scrollX = (t*0.012) % 24;
  const scrollY = (t*0.007) % 24;
  cfxCtx.translate(-scrollX, -scrollY);
  const cPattern = cfxCtx.createPattern(circuitTile, 'repeat');
  cfxCtx.fillStyle = cPattern;
  cfxCtx.fillRect(0, 0, FIELD_W+24, FIELD_H+24);
  cfxCtx.restore();
  cfxCtx.globalCompositeOperation = 'destination-in';
  cfxCtx.drawImage(buf, 0, 0);
  cfxCtx.globalCompositeOperation = 'source-over';
  const shimmer = 0.10 + Math.sin(t/500)*0.04;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = shimmer;
  ctx.drawImage(claimFx, 0, HUD_TOP);
  ctx.restore();

  // faint CRT scanline overlay across the field
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, HUD_TOP, FIELD_W, FIELD_H);
  ctx.clip();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = scanPattern;
  ctx.fillRect(0, HUD_TOP, FIELD_W, FIELD_H);
  ctx.restore();
}

function centerText(lines, startY, mainSize){
  ctx.save();
  ctx.textAlign = 'center';
  lines.forEach((l,i)=>{
    ctx.font = (l.size||mainSize) + 'px "Courier New", monospace';
    ctx.fillStyle = l.color || '#fff';
    ctx.fillText(l.text, CANVAS_W/2, startY + i*(l.gap||28));
  });
  ctx.restore();
}

function drawGlowTitle(text, cx, cy, sizePx, scale, alpha){
  scale = scale||1; alpha = (alpha==null)?1:alpha;
  const t = performance.now();
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${sizePx}px "Courier New", monospace`;
  const w = ctx.measureText(text).width;

  // animated rainbow gradient across the title
  const hueShift = (t/22) % 360;
  const grad = ctx.createLinearGradient(-w/2, 0, w/2, 0);
  const stops = 6;
  for(let i=0;i<=stops;i++){
    const h = (hueShift + i*(360/stops)) % 360;
    grad.addColorStop(i/stops, `hsl(${h},100%,62%)`);
  }

  // soft outer glow pass (blurred colorful halo behind the letters)
  ctx.shadowColor = `hsl(${hueShift},100%,60%)`;
  ctx.shadowBlur = 34;
  ctx.fillStyle = grad;
  ctx.fillText(text, 0, 0);
  ctx.fillText(text, 0, 0);

  // crisp bright pass on top for readability
  ctx.shadowBlur = 10;
  ctx.fillStyle = grad;
  ctx.fillText(text, 0, 0);

  // thin white highlight edge
  ctx.shadowBlur = 0;
  ctx.lineWidth = Math.max(1, sizePx*0.02);
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.strokeText(text, 0, 0);

  ctx.restore();
}

function render(){
  ctx.save();
  if(shake.t > 0){
    const intensity = shake.t/shake.dur;
    const amp = shake.mag * intensity * intensity; // ease-out taper
    ctx.translate((Math.random()*2-1)*amp, (Math.random()*2-1)*amp);
  }
  ctx.clearRect(-30,-30,CANVAS_W+60,CANVAS_H+60);
  drawBackground();
  drawHUD();
  drawField();
  drawFieldBorderGlow();

  if(state==='playing' || state==='paused' || state==='levelclear' || state==='dying' || state==='demo'){
    drawTrail();
    drawParticles();
    drawSpeedPowerup();
    drawSparx();
    drawQixGhostTrail();
    drawQix();
    drawPlayer();
  }

  if(respawnTimer > 0 && (state==='playing' || state==='demo')){
    const n = Math.max(1, Math.min(3, Math.ceil(respawnTimer/1000)));
    const frac = (respawnTimer % 1000) / 1000; // 1 -> 0 within each second
    const pulse = 1 + frac*0.6;
    const alpha = 0.5 + frac*0.5;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.round(64*pulse)}px "Courier New", monospace`;
    ctx.fillStyle = '#ff2020';
    ctx.shadowColor = '#ff2020';
    ctx.shadowBlur = 22;
    ctx.fillText(String(n), CANVAS_W/2, HUD_TOP + FIELD_H/2);
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 6;
    ctx.globalAlpha = 0.85;
    ctx.fillText('GET READY', CANVAS_W/2, HUD_TOP + FIELD_H/2 + 46*pulse);
    ctx.restore();
  }

  if(extraLifeMsgTimer > 0 && (state==='playing' || state==='demo')){
    const p = extraLifeMsgTimer/1900;
    const bob = Math.sin(performance.now()/90) * 3;
    ctx.save();
    ctx.globalAlpha = Math.min(1, p*2.2);
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillStyle = '#39ff14';
    ctx.shadowColor = '#39ff14';
    ctx.shadowBlur = 14;
    ctx.fillText('EXTRA LIFE!', CANVAS_W/2, HUD_TOP + FIELD_H*0.32 + bob);
    ctx.restore();
  }

  if(speedMsgTimer > 0 && (state==='playing' || state==='demo')){
    const p = speedMsgTimer/1600;
    const bob = Math.sin(performance.now()/90) * 3;
    ctx.save();
    ctx.globalAlpha = Math.min(1, p*2.2);
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillStyle = '#ffe63c';
    ctx.shadowColor = '#ffe63c';
    ctx.shadowBlur = 14;
    ctx.fillText('SPEED BOOST!', CANVAS_W/2, HUD_TOP + FIELD_H*0.4 + bob);
    ctx.restore();
  }

  if(state==='demo'){
    const t = performance.now();
    const blink = Math.floor(t/500)%2===0;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillStyle = '#ff2fd0';
    ctx.shadowColor = '#ff2fd0';
    ctx.shadowBlur = 8;
    ctx.fillText('DEMO MODE', CANVAS_W/2, HUD_TOP + 18);
    if(blink){
      ctx.font = '13px "Courier New", monospace';
      ctx.fillStyle = '#fff200';
      ctx.shadowColor = '#fff200';
      ctx.fillText('PRESS ENTER OR ANY KEY TO PLAY', CANVAS_W/2, HUD_TOP + 36);
    }
    ctx.restore();
  }

  if(state==='menu'){
    const vig = ctx.createRadialGradient(CANVAS_W/2,CANVAS_H/2,CANVAS_H*0.15,CANVAS_W/2,CANVAS_H/2,CANVAS_H*0.72);
    vig.addColorStop(0,'rgba(0,0,0,0)');
    vig.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle = vig;
    ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
    drawParticles();
    drawQixGhostTrail();
    drawQix();
    const pulse = 1 + Math.sin(performance.now()/480)*0.035;
    drawGlowTitle(TITLE_TEXT, CANVAS_W/2, TITLE_Y, TITLE_SIZE, pulse, 1);
    centerText([
      {text:'CLAIM '+TARGET_PERCENT+'% OF THE FIELD', size:16, color:'#aaa'},
      {text:'AVOID THE QIX  •  DODGE THE SPARX', size:14, color:'#777'},
      {text:'', size:8},
      {text:'PRESS ENTER OR CLICK TO START', size:18, color:'#fff200'}
    ], 210, 16);
    if(getGamepad()){
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '12px "Courier New", monospace';
      ctx.fillStyle = '#39ff14';
      ctx.shadowColor = '#39ff14';
      ctx.shadowBlur = 6;
      ctx.fillText('🎮 GAMEPAD CONNECTED', CANVAS_W/2, 300);
      ctx.restore();
    }
  } else if(state==='paused'){
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
    centerText([{text:'PAUSED', size:30, color:'#00eaff'}], CANVAS_H/2-10, 30);
  } else if(state==='levelclear'){
    const bigClear = percent >= 80;
    ctx.fillStyle = bigClear ? 'rgba(20,10,0,0.45)' : 'rgba(0,0,0,0.4)';
    ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
    if(bigClear){
      centerText([
        {text:'AMAZING CLEAR!', size:34, color:'#ffd400'},
        {text:Math.floor(percent)+'% CAPTURED', size:18, color:'#fff'},
        {text:'LEVEL ' + level + ' COMPLETE', size:14, color:'#aaa'}
      ], CANVAS_H/2-30, 34);
    } else {
      centerText([
        {text:'FIELD CLAIMED!', size:28, color:'#39ff14'},
        {text:'LEVEL ' + level + ' COMPLETE', size:16, color:'#fff'}
      ], CANVAS_H/2-20, 28);
    }
  } else if(state==='gameover'){
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
    centerText([
      {text:'GAME OVER', size:34, color:'#ff2020'},
      {text:'SCORE ' + score, size:18, color:'#fff'},
      {text:'', size:8},
      {text:'PRESS ENTER OR CLICK TO RETRY', size:16, color:'#fff200'}
    ], CANVAS_H/2-40, 34);
  }

  if(launchTransition > 0){
    const p = 1 - (launchTransition/LAUNCH_TRANSITION_MS);
    const easeP = p*p;
    ctx.fillStyle = `rgba(0,0,0,${Math.max(0,(1-p)*0.88)})`;
    ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
    const scale = 1 + easeP*5.2;
    const alpha = Math.max(0, 1 - p*1.15);
    if(alpha > 0){
      drawGlowTitle(TITLE_TEXT, CANVAS_W/2, TITLE_Y, TITLE_SIZE, scale, alpha);
    }
  }

  ctx.restore();
}

// ---------- LOOP ----------
function frame(t){
  if(!lastT) lastT = t;
  const dt = Math.min(50, t-lastT);
  lastT = t;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
resetPlayer();
layBorder();
spawnQix();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
