<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCB INVADERS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;cursor:none;user-select:none}
#c{display:block;position:fixed;top:0;left:0}
#hud{position:fixed;top:0;left:0;width:100%;display:flex;justify-content:space-between;padding:10px 18px;color:#0f0;font-size:clamp(10px,1.6vw,17px);text-shadow:0 0 6px #0f0;pointer-events:none;z-index:5}
.hb{text-align:center}
.hl{font-size:0.6em;opacity:0.65;letter-spacing:2px}
.hv{font-size:1.35em;font-weight:bold}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,0,0.88)}
#ov h1{color:#0f0;font-size:clamp(26px,5.5vw,68px);letter-spacing:5px;text-shadow:0 0 18px #0f0,0 0 36px #0f0;margin-bottom:12px;text-align:center}
#ov p{color:#0a0;font-size:clamp(10px,1.6vw,17px);letter-spacing:3px;margin-bottom:36px;text-align:center;opacity:0.8}
#obtn{background:transparent;border:2px solid #0f0;color:#0f0;font-family:'Courier New',monospace;font-size:clamp(13px,2vw,20px);letter-spacing:4px;padding:12px 36px;cursor:pointer;text-shadow:0 0 8px #0f0;box-shadow:0 0 14px #0f0;transition:all 0.2s}
#obtn:hover{background:rgba(0,255,0,0.13)}
#bn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#0f0;font-size:clamp(18px,3.5vw,44px);letter-spacing:7px;text-shadow:0 0 18px #0f0;z-index:8;pointer-events:none;opacity:0;transition:opacity 0.5s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="hb"><div class="hl">SCORE</div><div class="hv" id="esc">0</div></div>
  <div class="hb"><div class="hl">LEVEL</div><div class="hv" id="elv">1</div></div>
  <div class="hb"><div class="hl">LIVES</div><div class="hv" id="elf">▲▲▲</div></div>
  <div class="hb"><div class="hl">ENERGY</div><div id="ebar" style="margin-top:4px;width:clamp(60px,8vw,100px);height:10px;background:#111;border:1px solid #0a0;border-radius:3px;overflow:hidden"><div id="efill" style="height:100%;width:100%;background:#0f0;transition:width 0.1s,background 0.1s"></div></div></div>
  <div class="hb"><div class="hl">HI-SCORE</div><div class="hv" id="ehi">0</div></div>
</div>
<div id="ov">
  <h1 id="otitle">PCB INVADERS</h1>
  <p id="osub">MOUSE TO AIM &nbsp;·&nbsp; CLICK TO FIRE</p>
  <button id="obtn">INSERT COIN</button>
</div>
<div id="bn"></div>

  H = canvas.height = window.innerHeight;

// ── Audio ─────────────────────────────────────────────────
var audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playNote(freq, startTime, dur, vol, type) {
  var ac = getAudio();
  var osc = ac.createOscillator();
  var gain = ac.createGain();
  osc.connect(gain); gain.connect(ac.destination);
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(vol || 0.18, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
  osc.start(startTime); osc.stop(startTime + dur);
}
function playFanfare() {
  var ac = getAudio();
  var now = ac.currentTime;
  // Ascending arpeggio: C E G C' E' — then triumphant chord
  var notes = [262, 330, 392, 524, 659, 784];
  var times = [0, 0.12, 0.24, 0.36, 0.48, 0.60];
  for (var i = 0; i < notes.length; i++) {
    playNote(notes[i], now + times[i], 0.18, 0.15, 'square');
    playNote(notes[i] * 1.5, now + times[i], 0.18, 0.06, 'sine');
  }
  // Final chord bloom at 0.72s
  var chord = [524, 659, 784, 1048];
  for (var j = 0; j < chord.length; j++) {
    playNote(chord[j], now + 0.72, 0.55, 0.10, 'sine');
  }
  // Drum hit
  (function() {
    var buf = ac.createBuffer(1, ac.sampleRate * 0.2, ac.sampleRate);
    var data = buf.getChannelData(0);
    for (var k = 0; k < data.length; k++) data[k] = (Math.random()*2-1) * Math.pow(1 - k/data.length, 4);
    var src = ac.createBufferSource();
    var g2 = ac.createGain();
    src.buffer = buf; src.connect(g2); g2.connect(ac.destination);
    g2.gain.setValueAtTime(0.3, now + 0.72);
    src.start(now + 0.72);
  })();
}

// Invader march — 4-note descending bassline, pitch shifts with count & level
var marchStep = 0;
var marchNotes = [160, 130, 110, 90];
function sndMarch(aliveCount) {
  var ac = getAudio();
  var now = ac.currentTime;
  var pitch = marchNotes[marchStep % 4] * (1 + (55 - Math.min(55, aliveCount)) / 55 * 0.8);
  pitch *= (1 + (level - 1) * 0.06);
  var osc = ac.createOscillator();
  var gain = ac.createGain();
  osc.connect(gain); gain.connect(ac.destination);
  osc.type = 'square';
  osc.frequency.setValueAtTime(pitch, now);
  osc.frequency.exponentialRampToValueAtTime(pitch * 0.7, now + 0.07);
  gain.gain.setValueAtTime(0.12, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
  osc.start(now); osc.stop(now + 0.1);
  marchStep++;
}

// Player laser shot — quick rising zap
function sndShoot() {
  var ac = getAudio();
  var now = ac.currentTime;
  var osc = ac.createOscillator();
  var gain = ac.createGain();
  osc.connect(gain); gain.connect(ac.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
  gain.gain.setValueAtTime(0.14, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
  osc.start(now); osc.stop(now + 0.13);
}

// Invader explosion — short noise burst + low thud
function sndInvaderDie() {
  var ac = getAudio();
  var now = ac.currentTime;
  // Noise burst
  var len = ac.sampleRate * 0.18;
  var buf = ac.createBuffer(1, len, ac.sampleRate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < len; i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 1.5);
  var src = ac.createBufferSource();
  var g1 = ac.createGain();
  src.buffer = buf; src.connect(g1); g1.connect(ac.destination);
  g1.gain.setValueAtTime(0.22, now);
  src.start(now);
  // Low punch tone
  var osc = ac.createOscillator();
  var g2 = ac.createGain();
  osc.connect(g2); g2.connect(ac.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, now);
  osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
  g2.gain.setValueAtTime(0.2, now);
  g2.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
  osc.start(now); osc.stop(now + 0.2);
}

// UFO hit — descending warble + explosion
function sndUFOHit() {
  var ac = getAudio();
  var now = ac.currentTime;
  // Warble sweep
  var osc = ac.createOscillator();
  var g1 = ac.createGain();
  osc.connect(g1); g1.connect(ac.destination);
  osc.type = 'square';
  osc.frequency.setValueAtTime(880, now);
  osc.frequency.exponentialRampToValueAtTime(55, now + 0.5);
  g1.gain.setValueAtTime(0.15, now);
  g1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
  osc.start(now); osc.stop(now + 0.52);
  // Noise layer
  var len2 = ac.sampleRate * 0.35;
  var buf2 = ac.createBuffer(1, len2, ac.sampleRate);
  var data2 = buf2.getChannelData(0);
  for (var i = 0; i < len2; i++) data2[i] = (Math.random()*2-1) * Math.pow(1 - i/len2, 1.2);
  var src2 = ac.createBufferSource();
  var g2 = ac.createGain();
  src2.buffer = buf2; src2.connect(g2); g2.connect(ac.destination);
  g2.gain.setValueAtTime(0.25, now);
  src2.start(now);
  // 1UP chime
  playNote(523, now + 0.3, 0.1, 0.1, 'sine');
  playNote(784, now + 0.42, 0.15, 0.12, 'sine');
}

// Player destroyed — dramatic descending wail + noise
function sndHit() {
  var ac = getAudio();
  var now = ac.currentTime;
  var osc = ac.createOscillator();
  var g = ac.createGain();
  osc.connect(g); g.connect(ac.destination);
  osc.type = 'square';
  osc.frequency.setValueAtTime(220, now);
  osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
  g.gain.setValueAtTime(0.15, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  osc.start(now); osc.stop(now + 0.16);
}

function sndPlayerDie() {
  var ac = getAudio();
  var now = ac.currentTime;
  // Wail sweep down
  var osc = ac.createOscillator();
  var g1 = ac.createGain();
  osc.connect(g1); g1.connect(ac.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(440, now);
  osc.frequency.exponentialRampToValueAtTime(30, now + 0.9);
  g1.gain.setValueAtTime(0.18, now);
  g1.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
  osc.start(now); osc.stop(now + 0.95);
  // Crunch noise
  var len3 = ac.sampleRate * 0.6;
  var buf3 = ac.createBuffer(1, len3, ac.sampleRate);
  var data3 = buf3.getChannelData(0);
  for (var i = 0; i < len3; i++) data3[i] = (Math.random()*2-1) * Math.pow(1 - i/len3, 0.8);
  var src3 = ac.createBufferSource();
  var g3 = ac.createGain();
  src3.buffer = buf3; src3.connect(g3); g3.connect(ac.destination);
  g3.gain.setValueAtTime(0.28, now);
  src3.start(now);
}

let score = 0, hiScore = 0, lives = 3, level = 1;

// ── UI helpers ───────────────────────────────────────────
function setLives() { elfEl.textContent = '▲'.repeat(Math.max(0, lives)); }
function setEnergy() {
  var pct = (player ? player.hp / 3 : 1) * 100;
  var fill = document.getElementById('efill');
  var bar  = document.getElementById('ebar');
  fill.style.width = pct + '%';
  fill.style.background = player && player.hp === 1 ? '#f00' : player && player.hp === 2 ? '#ff0' : '#0f0';
  bar.style.borderColor = player && player.hp === 1 ? '#f00' : '#0a0';
}
function setScore() { escEl.textContent = score; ehiEl.textContent = hiScore; }

function showBanner(txt, dur) {
  dur = dur || 1600;
  bnEl.textContent = txt;
  bnEl.style.opacity = '1';
  if (bannerTO) clearTimeout(bannerTO);
  bannerTO = setTimeout(() => { bnEl.style.opacity = '0'; }, dur);
}

// ── Init / start ─────────────────────────────────────────
function startGame() {
  score = 0; lives = 3; level = 1;
  hiScore = hiScore; // keep
  setScore(); setLives();
  ovEl.style.display = 'none';
  initLevel();
  gameState = 'play';
}
btnEl.addEventListener('click', startGame);

function gameOver(msg) {
  gameState = 'over';
  showBanner(msg, 9999);
  setTimeout(function() {
    titleEl.textContent = msg;
    subEl.textContent   = 'SCORE: ' + score;
    btnEl.textContent   = 'PLAY AGAIN';
    ovEl.style.display  = 'flex';
  }, 2200);
}

function initLevel() {
  curBg  = bgImgs[Math.floor(Math.random() * bgImgs.length)];
  bgAlpha = 0;
  isBossLevel = (level % 3 === 0) && (level % 5 !== 0);
  boss = null;

  const cellW = 62 * SC, cellH = 48 * SC;
  const startX = W / 2 - (11 * cellW) / 2 + cellW / 2;
  const startY = H * 0.14;

  invaders = [];
  if (isBossLevel) {
    // Boss level: spawn boss + a reduced guard of invaders
    var bossHp = 5 + Math.floor(level / 3) * 3;
    boss = {
      x: W / 2, y: H * 0.18,
      hp: bossHp, maxHp: bossHp,
      dir: 1,
      speed: (1.2 + level * 0.15) * SC,
      fireTimer: 0,
      sz: 80 * SC
    };
    // Spawn 2 rows of guard invaders below boss
    var guardCols = 7, guardStartX = W/2 - (guardCols * cellW)/2 + cellW/2;
    for (let r = 0; r < 2; r++) {
      for (let col = 0; col < guardCols; col++) {
        invaders.push({
          x: guardStartX + col * cellW,
          y: H * 0.42 + r * cellH,
          tp: 1, sz: 38 * SC, alive: true, pts: 20
        });
      }
    }
    showBanner('⚠ BOSS LEVEL ⚠');
  } else {
    for (let r = 0; r < 5; r++) {
      for (let col = 0; col < 11; col++) {
        const tp = r < 1 ? 0 : r < 3 ? 1 : 2;
        invaders.push({
          x: startX + col * cellW,
          y: startY + r * cellH,
          tp: tp, sz: 38 * SC, alive: true,
          pts: tp === 0 ? 30 : tp === 1 ? 20 : 10
        });
      }
    }
  }

  player = { x: W / 2, y: H - 48 * SC, w: 38 * SC, h: 18 * SC, inv: 0, hp: 3 };

  bullets  = [];
  eBullets = [];

  const bCount = 4, bw = 58 * SC, bh = 38 * SC;
  barriers = [];
  for (let i = 0; i < bCount; i++) {
    const bx = W * (i + 1) / (bCount + 1) - bw / 2;
    const by = H - 120 * SC;
    const cells = [];
    for (let br = 0; br < 4; br++) {
      for (let bc = 0; bc < 8; bc++) {
        if (br === 0 && (bc === 0 || bc === 7)) continue;
        cells.push({ bx: bc, by: br, ok: true });
      }
    }
    barriers.push({ x: bx, y: by, cw: bw / 8, ch: bh / 4, cells: cells });
  }

  particles = [];
  popups    = [];
  ufo       = null;
  ufoOn     = false;
  ufoTimer  = 0;
  iDir      = 1;
  iSpeed    = (0.7 + level * 0.18) * SC;
  iDropY    = (14 + level * 1.2) * SC;
  iTimer    = 0;
  iFireRate = Math.max(0.4, 1.4 + level * 0.18);

  elvEl.textContent = level;
  setLives();
  if (!isBossLevel) showBanner('LEVEL ' + level);
  setEnergy();
}

// ── Effects ──────────────────────────────────────────────
function boom(x, y, col, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = (2 + Math.random() * 7) * SC;
    particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
                     life: 1, dec: 0.018 + Math.random()*0.025,
                     sz: (5 + Math.random()*9)*SC, col: col });
  }
}
function bigBoom(x, y, baseCol) {
  // Primary color burst
  boom(x, y, baseCol, 18);
  // Secondary complementary ring
  var hue = parseInt(baseCol.replace('#',''), 16);
  var altCols = ['#fff', '#ff0', baseCol];
  for (var ci = 0; ci < altCols.length; ci++) {
    for (var i = 0; i < 8; i++) {
      var a = (i / 8) * Math.PI * 2;
      var sp = (4 + Math.random() * 5) * SC;
      particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
                       life: 1, dec: 0.012 + Math.random()*0.02,
                       sz: (3 + Math.random()*6)*SC, col: altCols[ci] });
    }
  }
}
function popup(x, y, txt, col) {
  popups.push({ x: x, y: y, txt: txt, col: col, life: 1, vy: -1.5 * SC });
}

// ── Collision ────────────────────────────────────────────
function barrierHit(bx, by, hw) {
  for (var b = 0; b < barriers.length; b++) {
    var bar = barriers[b];
    for (var ci = 0; ci < bar.cells.length; ci++) {
      var c = bar.cells[ci];
      if (!c.ok) continue;
      var cx = bar.x + c.bx * bar.cw;
      var cy = bar.y + c.by * bar.ch;
      if (bx + hw > cx && bx - hw < cx + bar.cw && by > cy && by < cy + bar.ch) {
        c.ok = false;
        return true;
      }
    }
  }
  return false;
}

function aliveInvaders() {
  var out = [];
  for (var i = 0; i < invaders.length; i++) if (invaders[i].alive) out.push(invaders[i]);
  return out;
}
function bottomInvaders() {
  var map = {};
  for (var i = 0; i < invaders.length; i++) {
    var inv = invaders[i];
    if (!inv.alive) continue;
    var k = Math.round(inv.x / 10);
    if (!map[k] || inv.y > map[k].y) map[k] = inv;
  }
  var out = [];
  for (var k in map) out.push(map[k]);
  return out;
}

// ── Update ───────────────────────────────────────────────
function update(dt, t) {
  if (gameState === 'fanfare') {
    fanfareTimer -= dt;
    var npf = [];
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.08*SC; p.life -= p.dec;
      if (p.life > 0) npf.push(p);
    }
    particles = npf;
    if (Math.random() < 0.35) {
      var hue = Math.random() * 360;
      boom(Math.random()*W, Math.random()*H*0.7, 'hsl('+Math.round(hue)+',100%,60%)', 3);
    }
    if (fanfareTimer <= 0) {
      level++;
      particles = [];
      initLevel();
      gameState = 'play';
    }
    return;
  }
  if (gameState === 'respawn') {
    respawnTimer -= dt;
    // Keep particles/popups alive during countdown
    var np2 = [];
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.08*SC; p.life -= p.dec;
      if (p.life > 0) np2.push(p);
    }
    particles = np2;
    if (respawnTimer <= 0) {
      gameState = 'play';
      player.x = W / 2;
      player.inv = 2.0; // brief invincibility after respawn
      player.hp = 3; setEnergy();
      eBullets = []; // clear any bullets that would instantly kill
    }
    return;
  }
  if (gameState !== 'play') return;

  if (bgAlpha < 0.32) bgAlpha = Math.min(0.32, bgAlpha + dt * 0.6);

  // Player
  player.x += (mouseX - player.x) * Math.min(1, dt * 14);
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
  player.y = H - 48 * SC;
  if (player.inv > 0) player.inv -= dt;

  // Auto-fire while mouse held
  if (mouseHeld && gameState === 'play') {
    fireTimer -= dt;
    if (fireTimer <= 0) {
      fireTimer = FIRE_RATE;
      if (bullets.length < 6) {
        var hue = (Date.now() / 8) % 360;
        var bulletColor = 'hsl(' + Math.round(hue) + ',100%,65%)';
        bullets.push({ x: player.x, y: player.y - player.h, w: 3*SC, h: 14*SC, col: bulletColor });
        sndShoot();
      }
    }
  } else {
    fireTimer = 0;
  }

  // Move player bullets
  var bspd = 11 * SC;
  var nb = [];
  for (var i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    b.y -= bspd;
    if (b.y > 0) nb.push(b);
  }
  bullets = nb;

  // Move enemy bullets
  var espd = (2.5 + level * 0.45) * SC;
  var neb = [];
  for (var i = 0; i < eBullets.length; i++) {
    var eb = eBullets[i];
    if (eb.vx !== undefined) {
      eb.x += eb.vx; eb.y += eb.vy;
    } else {
      eb.y += espd;
    }
    eb.t += dt;
    if (eb.y < H && eb.x > -20 && eb.x < W+20) neb.push(eb);
  }
  eBullets = neb;

  // Move invaders
  var alive = aliveInvaders();
  if (alive.length === 0) {
    gameState = 'fanfare';
    fanfareTimer = FANFARE_DUR;
    playFanfare();
    return;
  }

  // ── Boss update ──────────────────────────────────────────
  if (isBossLevel && boss) {
    // Sinusoidal movement across screen
    boss.x += boss.speed * boss.dir;
    if (boss.x > W - boss.sz || boss.x < boss.sz) {
      boss.dir *= -1;
      boss.y += 12 * SC; // creep down slowly
      boss.speed *= 1.04;
    }
    // Boss shoots bursts
    boss.fireTimer -= dt;
    if (boss.fireTimer <= 0) {
      boss.fireTimer = Math.max(0.4, 1.8 - level * 0.08);
      // Spread shot: 3 bullets in a fan
      var angles = [-0.3, 0, 0.3];
      for (var ai = 0; ai < angles.length; ai++) {
        var ang = angles[ai];
        var spd = (4 + level * 0.4) * SC;
        eBullets.push({
          x: boss.x + Math.sin(ang) * boss.sz * 0.4,
          y: boss.y + boss.sz * 0.5,
          w: 8*SC, h: 20*SC, t: 0,
          vx: Math.sin(ang) * spd * 0.6,
          vy: spd * Math.cos(ang)
        });
      }
    }
    // Boss reaches bottom = instant game over
    if (boss.y + boss.sz > H - 75*SC) {
      lives = 0; setLives(); gameOver('INVADED!'); return;
    }
  }

  iTimer += dt;
  var totalInv = 55; // 5 rows x 11 cols
  var countFactor = 1 + Math.pow((totalInv - alive.length) / totalInv, 1.5) * 9.0;
  var interval = Math.max(0.07, 0.55 - level * 0.018);
  if (iTimer >= interval) {
    iTimer = 0;
    sndMarch(alive.length);
    var step = iSpeed * countFactor;
    var hitEdge = false;
    for (var i = 0; i < alive.length; i++) {
      alive[i].x += step * iDir;
      if (alive[i].x > W - alive[i].sz || alive[i].x < alive[i].sz) hitEdge = true;
    }
    if (hitEdge) {
      iDir *= -1;
      for (var i = 0; i < alive.length; i++) {
        alive[i].y += iDropY;
        alive[i].x += step * iDir * 2;
      }
    }
  }

  // Enemy fire
  if (Math.random() < iFireRate * dt) {
    var bots = bottomInvaders();
    if (bots.length > 0) {
      var shooter = bots[Math.floor(Math.random() * bots.length)];
      eBullets.push({ x: shooter.x, y: shooter.y + shooter.sz / 2, w: 7*SC, h: 18*SC, t: 0 });
    }
  }

  // UFO
  ufoTimer += dt;
  if (!ufoOn && ufoTimer > 14 + Math.random() * 18) {
    ufoTimer = 0; ufoOn = true;
    ufo = { x: -45*SC, y: 55*SC, spd: (2 + level * 0.25) * SC };
  }
  if (ufoOn && ufo) {
    ufo.x += ufo.spd;
    if (ufo.x > W + 50*SC) { ufoOn = false; ufo = null; }
  }

  // Player bullets vs things
  var nb2 = [];
  for (var i = 0; i < bullets.length; i++) {
    var b = bullets[i]; var keep = true;
    // vs UFO
    if (keep && ufoOn && ufo && Math.abs(b.x - ufo.x) < 32*SC && Math.abs(b.y - ufo.y) < 14*SC) {
      var pts = (Math.floor(Math.random() * 4) + 1) * 50;
      score += pts; if (score > hiScore) hiScore = score;
      setScore();
      sndUFOHit();
      // 1UP
      lives++; setLives(); showBanner('1UP !!!');
      // Big multicolor UFO explosion
      var ufoColors = ['#f0f','#ff0','#f44','#0ff','#fff','#fa0'];
      for (var uc = 0; uc < ufoColors.length; uc++) boom(ufo.x, ufo.y, ufoColors[uc], 14);
      popup(ufo.x, ufo.y - 28, '+'+pts+' 1UP!', '#f0f');
      ufoOn = false; ufo = null; keep = false;
    }
    // vs invaders
    if (keep) {
      for (var j = 0; j < invaders.length; j++) {
        var inv = invaders[j];
        if (!inv.alive) continue;
        if (Math.abs(b.x - inv.x) < inv.sz && Math.abs(b.y - inv.y) < inv.sz) {
          inv.alive = false; keep = false;
          score += inv.pts; if (score > hiScore) hiScore = score; setScore();
          sndInvaderDie();
          var col = inv.tp === 0 ? '#0f0' : inv.tp === 1 ? '#0ff' : '#cf0';
          bigBoom(inv.x, inv.y, col); popup(inv.x, inv.y - 18, '+'+inv.pts, col);
          break;
        }
      }
    }
    // vs boss
    if (keep && isBossLevel && boss) {
      if (Math.abs(b.x - boss.x) < boss.sz * 0.6 && Math.abs(b.y - boss.y) < boss.sz * 0.55) {
        keep = false;
        boss.hp--;
        sndInvaderDie();
        var bHue = Math.round(Math.random() * 360);
        boom(b.x, b.y, 'hsl('+bHue+',100%,60%)', 8);
        popup(boss.x, boss.y - 20, 'HIT! ' + boss.hp + '/' + boss.maxHp + ' HP', '#fff');
        if (boss.hp <= 0) {
          // Boss dead!
          score += 500 + level * 50;
          if (score > hiScore) hiScore = score;
          setScore();
          lives++; setLives();
          var bColors = ['#f0f','#ff0','#f44','#0ff','#0f0','#fa0','#fff'];
          for (var bc2=0; bc2<bColors.length; bc2++) boom(boss.x, boss.y, bColors[bc2], 20);
          popup(boss.x, boss.y - 40, 'BOSS DOWN! +' + (500+level*50) + ' 1UP!', '#f0f');
          sndUFOHit();
          boss = null;
          // Clear remaining guards
          for (var bi=0;bi<invaders.length;bi++) invaders[bi].alive = false;
        }
      }
    }
    // vs barriers
    if (keep && barrierHit(b.x, b.y, b.w / 2)) keep = false;
    if (keep) nb2.push(b);
  }
  bullets = nb2;

  // Enemy bullets vs barriers/player
  var neb2 = [];
  for (var i = 0; i < eBullets.length; i++) {
    var eb = eBullets[i]; var keep = true;
    if (barrierHit(eb.x, eb.y, eb.w / 2)) { keep = false; }
    if (keep && player.inv <= 0) {
      var dx = Math.abs(eb.x - player.x);
      var dy = eb.y - (player.y - player.h);
      if (dx < player.w * 0.55 && dy > 0 && dy < player.h * 1.8) {
        keep = false;
        player.hp--;
        setEnergy();
        if (player.hp <= 0) {
          // Ship destroyed
          boom(player.x, player.y, '#0f0', 16);
          sndPlayerDie();
          lives--; setLives();
          if (lives <= 0) { gameOver('GAME OVER'); return; }
          gameState = 'respawn';
          respawnTimer = 3.0;
          player.inv = 0;
        } else {
          // Shield hit — flash and brief invincibility
          sndHit();
          player.inv = 1.2;
          boom(player.x, player.y, player.hp === 2 ? '#ff0' : '#f00', 6);
        }
      }
    }
    if (keep) neb2.push(eb);
  }
  eBullets = neb2;

  // Invaders reach bottom
  for (var i = 0; i < alive.length; i++) {
    if (alive[i].y > H - 75*SC) { lives = 0; setLives(); gameOver('INVADED!'); return; }
  }

  // Particles
  var np = [];
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.08*SC; p.life -= p.dec;
    if (p.life > 0) np.push(p);
  }
  particles = np;

  // Popups
  var npo = [];
  for (var i = 0; i < popups.length; i++) {
    var po = popups[i]; po.y += po.vy; po.life -= 0.022;
    if (po.life > 0) npo.push(po);
  }
  popups = npo;
}

// ── Draw ─────────────────────────────────────────────────
function drawInvader(inv, t) {
  var x = inv.x, y = inv.y, tp = inv.tp, s = inv.sz * 0.5;
  // Each invader gets a unique hue from its grid position
  var baseHue = (inv.x * 0.4 + inv.y * 0.6 + t * 28) % 360;
  var pulse = 0.82 + 0.18 * Math.sin(t * 3.5 + x * 0.05);
  var lightness = Math.round(45 + 20 * pulse);
  var col1 = 'hsl(' + Math.round(baseHue) + ',100%,' + lightness + '%)';
  var col2 = 'hsl(' + Math.round((baseHue + 40) % 360) + ',100%,' + Math.round(lightness + 15) + '%)';
  var shadowCol = 'hsl(' + Math.round(baseHue) + ',100%,60%)';
  ctx.save(); ctx.translate(x, y);
  ctx.shadowColor = shadowCol; ctx.shadowBlur = 18;

  if (tp === 0) {
    // Saucer — dome body, legs, glowing eyes
    ctx.fillStyle = col1;
    ctx.beginPath(); ctx.ellipse(0, 0, s*1.15, s*0.68, 0, 0, Math.PI*2); ctx.fill();
    // top dome
    ctx.fillStyle = col2;
    ctx.beginPath(); ctx.ellipse(0, -s*0.28, s*0.6, s*0.45, 0, Math.PI, Math.PI*2); ctx.fill();
    // legs
    ctx.fillStyle = col1;
    for (var i = -1; i <= 1; i++) ctx.fillRect(i*s*0.65-s*0.13, s*0.32, s*0.26, s*0.55);
    // feet
    ctx.fillStyle = col2;
    for (var i = -1; i <= 1; i++) ctx.fillRect(i*s*0.65-s*0.22, s*0.87, s*0.44, s*0.18);
    // eyes
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#fff';
    ctx.fillRect(-s*0.42, -s*0.12, s*0.32, s*0.26);
    ctx.fillRect( s*0.10, -s*0.12, s*0.32, s*0.26);
    ctx.fillStyle = 'hsl(' + Math.round((baseHue+180)%360) + ',100%,60%)';
    ctx.fillRect(-s*0.34, -s*0.06, s*0.18, s*0.16);
    ctx.fillRect( s*0.16, -s*0.06, s*0.18, s*0.16);

  } else if (tp === 1) {
    // Crab — wide body, alternating claws, antenna
    ctx.fillStyle = col1;
    ctx.fillRect(-s*0.75, -s*0.42, s*1.5, s*0.9);
    // antenna
    ctx.fillStyle = col2;
    ctx.fillRect(-s*0.35, -s*0.42-s*0.55, s*0.12, s*0.55);
    ctx.fillRect( s*0.23, -s*0.42-s*0.55, s*0.12, s*0.55);
    ctx.beginPath(); ctx.arc(-s*0.29, -s*0.97, s*0.16, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( s*0.29, -s*0.97, s*0.16, 0, Math.PI*2); ctx.fill();
    // claws alternate
    var co = Math.sin(t*5) > 0 ? s*0.18 : 0;
    ctx.fillStyle = col2;
    ctx.fillRect(-s*1.18, -s*0.14+co, s*0.46, s*0.32);
    ctx.fillRect( s*0.72, -s*0.14-co, s*0.46, s*0.32);
    // claw tips
    ctx.fillStyle = col1;
    ctx.fillRect(-s*1.32, -s*0.22+co, s*0.2, s*0.48);
    ctx.fillRect( s*1.12, -s*0.22-co, s*0.2, s*0.48);
    // eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(-s*0.38,-s*0.28,s*0.26,s*0.26);
    ctx.fillRect( s*0.12,-s*0.28,s*0.26,s*0.26);
    ctx.fillStyle = 'hsl(' + Math.round((baseHue+180)%360) + ',100%,55%)';
    ctx.fillRect(-s*0.30,-s*0.20,s*0.14,s*0.14);
    ctx.fillRect( s*0.20,-s*0.20,s*0.14,s*0.14);
    // bottom prongs
    ctx.fillStyle = col1;
    ctx.fillRect(-s*0.55, s*0.48, s*0.26, s*0.44);
    ctx.fillRect( s*0.29, s*0.48, s*0.26, s*0.44);

  } else {
    // Squid — round head, flared skirt, wiggly tentacles
    ctx.fillStyle = col1;
    ctx.beginPath(); ctx.arc(0, -s*0.15, s*0.78, 0, Math.PI*2); ctx.fill();
    // skirt
    ctx.beginPath();
    ctx.moveTo(-s*0.78, -s*0.05);
    ctx.quadraticCurveTo(-s*1.0, s*0.5, -s*0.78, s*0.6);
    ctx.lineTo( s*0.78, s*0.6);
    ctx.quadraticCurveTo( s*1.0, s*0.5,  s*0.78, -s*0.05);
    ctx.closePath(); ctx.fill();
    // skirt highlight
    ctx.fillStyle = col2;
    ctx.beginPath();
    ctx.moveTo(-s*0.6, s*0.0);
    ctx.quadraticCurveTo(-s*0.7, s*0.4, -s*0.55, s*0.52);
    ctx.lineTo( s*0.55, s*0.52);
    ctx.quadraticCurveTo( s*0.7, s*0.4,  s*0.6, s*0.0);
    ctx.closePath(); ctx.fill();
    // tentacles
    ctx.fillStyle = col1;
    var tw = Math.sin(t*6) * s * 0.18;
    for (var i = -2; i <= 2; i++) {
      var tx2 = i*s*0.3, tentOff = (i%2===0?tw:-tw);
      ctx.fillRect(tx2-s*0.1, s*0.6, s*0.2, s*0.42+tentOff);
      // tip
      ctx.fillStyle = col2;
      ctx.beginPath(); ctx.arc(tx2, s*0.6+s*0.42+tentOff, s*0.12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = col1;
    }
    // eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(-s*0.36,-s*0.24,s*0.24,s*0.24);
    ctx.fillRect( s*0.12,-s*0.24,s*0.24,s*0.24);
    ctx.fillStyle = 'hsl(' + Math.round((baseHue+180)%360) + ',100%,55%)';
    ctx.fillRect(-s*0.28,-s*0.17,s*0.14,s*0.14);
    ctx.fillRect( s*0.14,-s*0.17,s*0.14,s*0.14);
  }
  ctx.restore();
}

function drawPlayer(t) {
  if (!player) return;
  if (gameState === 'respawn') return; // hidden during countdown
  if (player.inv > 0 && Math.floor(t * 10) % 2 === 0) return;
  var x=player.x, y=player.y, w=player.w, h=player.h;
  var shipCol = player.hp === 3 ? '#0f0' : player.hp === 2 ? '#ff0' : '#f44';
  ctx.save(); ctx.shadowColor=shipCol; ctx.shadowBlur=14; ctx.fillStyle=shipCol;
  ctx.beginPath();
  ctx.moveTo(x, y-h); ctx.lineTo(x+w*0.38,y); ctx.lineTo(x+w*0.5,y);
  ctx.lineTo(x+w*0.5,y+h*0.32); ctx.lineTo(x-w*0.5,y+h*0.32);
  ctx.lineTo(x-w*0.5,y); ctx.lineTo(x-w*0.38,y); ctx.closePath(); ctx.fill();
  ctx.fillRect(x-SC*2, y-h*1.42, SC*4, h*0.48);
  ctx.fillStyle='hsla('+(player.hp===3?'120':player.hp===2?'60':'0')+',100%,60%,'+(0.4+0.6*Math.abs(Math.sin(t*8)))+')'; 
  ctx.fillRect(x-w*0.3,y+h*0.32,w*0.18,SC*5);
  ctx.fillRect(x+w*0.12,y+h*0.32,w*0.18,SC*5);
  ctx.restore();
}

function drawBoss(t) {
  if (!boss) return;
  var x = boss.x, y = boss.y, s = boss.sz;
  var hpFrac = boss.hp / boss.maxHp;
  // Cycling rainbow hue
  var hue = (t * 60) % 360;
  var hue2 = (hue + 120) % 360;
  var hue3 = (hue + 240) % 360;
  var pulse = 0.7 + 0.3 * Math.sin(t * 5);

  ctx.save();
  ctx.translate(x, y);

  // Outer pulsing ring
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.72, 0, Math.PI * 2);
  var ringGrad = ctx.createRadialGradient(0,0,s*0.45, 0,0,s*0.72);
  ringGrad.addColorStop(0, 'hsla('+Math.round(hue)+',100%,50%,0)');
  ringGrad.addColorStop(1, 'hsla('+Math.round(hue)+',100%,60%,'+(0.4*pulse)+')');
  ctx.fillStyle = ringGrad;
  ctx.fill();
  ctx.strokeStyle = 'hsl('+Math.round(hue)+',100%,65%)';
  ctx.lineWidth = 3 * SC;
  ctx.shadowColor = 'hsl('+Math.round(hue)+',100%,60%)';
  ctx.shadowBlur = 24;
  ctx.stroke();

  // Body gradient
  var bodyGrad = ctx.createRadialGradient(-s*0.2,-s*0.2,0, 0,0,s*0.6);
  bodyGrad.addColorStop(0, 'hsl('+Math.round(hue)+',100%,70%)');
  bodyGrad.addColorStop(0.5, 'hsl('+Math.round(hue2)+',100%,50%)');
  bodyGrad.addColorStop(1, 'hsl('+Math.round(hue3)+',100%,30%)');
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = bodyGrad;
  ctx.shadowBlur = 30;
  ctx.fill();

  // Rotating inner pattern
  ctx.save();
  ctx.rotate(t * 1.5);
  for (var i = 0; i < 6; i++) {
    var a = (i / 6) * Math.PI * 2;
    var armHue = (hue + i * 60) % 360;
    ctx.strokeStyle = 'hsl('+Math.round(armHue)+',100%,70%)';
    ctx.lineWidth = 2.5 * SC;
    ctx.shadowColor = 'hsl('+Math.round(armHue)+',100%,65%)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*s*0.15, Math.sin(a)*s*0.15);
    ctx.lineTo(Math.cos(a)*s*0.48, Math.sin(a)*s*0.48);
    ctx.stroke();
    // Tip jewel
    ctx.fillStyle = 'hsl('+Math.round(armHue)+',100%,80%)';
    ctx.beginPath();
    ctx.arc(Math.cos(a)*s*0.48, Math.sin(a)*s*0.48, s*0.06, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // Core eye
  var eyeGrad = ctx.createRadialGradient(0,0,0,0,0,s*0.18);
  eyeGrad.addColorStop(0, '#fff');
  eyeGrad.addColorStop(0.4, 'hsl('+Math.round((hue+180)%360)+',100%,70%)');
  eyeGrad.addColorStop(1, 'hsl('+Math.round((hue+180)%360)+',100%,30%)');
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.18, 0, Math.PI * 2);
  ctx.fillStyle = eyeGrad;
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 20;
  ctx.fill();

  // Danger spikes when low health
  if (hpFrac < 0.5) {
    var spikeCount = 8;
    ctx.strokeStyle = 'hsl('+Math.round(hue)+',100%,70%)';
    ctx.lineWidth = 2 * SC;
    ctx.save();
    ctx.rotate(-t * 2);
    for (var si = 0; si < spikeCount; si++) {
      var sa = (si / spikeCount) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(sa)*s*0.55, Math.sin(sa)*s*0.55);
      ctx.lineTo(Math.cos(sa)*s*(0.72+0.1*Math.sin(t*8+si)), Math.sin(sa)*s*(0.72+0.1*Math.sin(t*8+si)));
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.restore();

  // HP bar
  var barW = s * 2.2, barH = 10 * SC;
  var barX = x - barW/2, barY = y - s * 0.9;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(barX, barY, barW, barH);
  var barCol = hpFrac > 0.5 ? '#0f0' : hpFrac > 0.25 ? '#ff0' : '#f00';
  ctx.fillStyle = barCol;
  ctx.shadowColor = barCol; ctx.shadowBlur = 8;
  ctx.fillRect(barX, barY, barW * hpFrac, barH);
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1; ctx.shadowBlur = 0;
  ctx.strokeRect(barX, barY, barW, barH);
  // BOSS label
  ctx.font = 'bold ' + Math.round(11*SC) + 'px Courier New';
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.fillText('BOSS  ' + boss.hp + ' / ' + boss.maxHp + ' HP', x, barY - 4*SC);
}

function drawUFO() {
  if (!ufoOn || !ufo) return;
  ctx.save(); ctx.shadowColor='#f0f'; ctx.shadowBlur=18;
  ctx.fillStyle='#c00c'; ctx.beginPath(); ctx.ellipse(ufo.x,ufo.y,28*SC,11*SC,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#faf'; ctx.beginPath(); ctx.ellipse(ufo.x,ufo.y-7*SC,13*SC,7*SC,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f0f';
  for (var i=-2;i<=2;i++){ctx.beginPath();ctx.arc(ufo.x+i*9*SC,ufo.y+9*SC,2.5*SC,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

function drawBarriers() {
  for (var b=0;b<barriers.length;b++) {
    var bar=barriers[b];
    ctx.fillStyle='#0b0'; ctx.shadowColor='#0f0'; ctx.shadowBlur=4;
    for (var ci=0;ci<bar.cells.length;ci++) {
      var c=bar.cells[ci];
      if (c.ok) ctx.fillRect(bar.x+c.bx*bar.cw, bar.y+c.by*bar.ch, bar.cw-1, bar.ch-1);
    }
  }
}

function drawBullets(t) {
  for (var i=0;i<bullets.length;i++) {
    var b=bullets[i];
    ctx.save();
    ctx.shadowColor=b.col; ctx.shadowBlur=12;
    ctx.fillStyle=b.col;
    // bright core
    ctx.fillRect(b.x-b.w/2, b.y-b.h, b.w, b.h);
    // wider soft glow strip
    ctx.globalAlpha=0.35;
    ctx.fillRect(b.x-b.w*1.5, b.y-b.h, b.w*3, b.h);
    ctx.restore();
  }
  for (var i=0;i<eBullets.length;i++) {
    var eb=eBullets[i];
    var ebHue = (eb.x * 0.8 + t * 120) % 360;
    var ebCol = 'hsl(' + Math.round(ebHue) + ',100%,60%)';
    ctx.save();
    ctx.shadowColor = ebCol; ctx.shadowBlur = 16;
    // wide outer glow
    ctx.strokeStyle = 'hsla(' + Math.round(ebHue) + ',100%,50%,0.4)';
    ctx.lineWidth = eb.w * 2.5;
    ctx.beginPath(); ctx.moveTo(eb.x, eb.y); ctx.lineTo(eb.x, eb.y - eb.h); ctx.stroke();
    // core bolt with zigzag
    ctx.strokeStyle = ebCol;
    ctx.lineWidth = eb.w;
    var zz = eb.w * 1.2 * Math.sin(eb.t * 12);
    ctx.beginPath();
    ctx.moveTo(eb.x, eb.y);
    ctx.lineTo(eb.x + zz, eb.y - eb.h * 0.33);
    ctx.lineTo(eb.x - zz, eb.y - eb.h * 0.66);
    ctx.lineTo(eb.x, eb.y - eb.h);
    ctx.stroke();
    // bright tip
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.w * 0.8, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawFX() {
  for (var i=0;i<particles.length;i++) {
    var p=particles[i];
    ctx.save(); ctx.globalAlpha=p.life; ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=5;
    ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz); ctx.restore();
  }
  ctx.save(); ctx.font='bold '+Math.round(13*SC)+'px Courier New'; ctx.textAlign='center';
  for (var i=0;i<popups.length;i++) {
    var po=popups[i]; ctx.globalAlpha=po.life; ctx.fillStyle=po.col; ctx.fillText(po.txt,po.x,po.y);
  }
  ctx.restore();
}

function drawCursor(t) {
  ctx.save(); ctx.strokeStyle='#0f0'; ctx.lineWidth=1.5; ctx.shadowColor='#0f0'; ctx.shadowBlur=8;
  var r=11*SC;
  ctx.beginPath(); ctx.arc(mouseX,mouseY,r,0,Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouseX-r*1.6,mouseY); ctx.lineTo(mouseX-r*0.4,mouseY);
  ctx.moveTo(mouseX+r*0.4,mouseY); ctx.lineTo(mouseX+r*1.6,mouseY);
  ctx.moveTo(mouseX,mouseY-r*1.6); ctx.lineTo(mouseX,mouseY-r*0.4);
  ctx.moveTo(mouseX,mouseY+r*0.4); ctx.lineTo(mouseX,mouseY+r*1.6);
  ctx.stroke();
  ctx.save(); ctx.translate(mouseX,mouseY); ctx.rotate(t*2);
  ctx.beginPath(); ctx.arc(0,0,r*0.55,0,Math.PI*0.45); ctx.stroke(); ctx.restore();
  ctx.restore();
}

function draw(t) {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);

  // PCB background
  // Photo background
  if (curBg && curBg.complete && curBg.naturalWidth > 0) {
    ctx.save();
    ctx.globalAlpha = bgAlpha;
    var sc2 = Math.min(W / curBg.naturalWidth, H / curBg.naturalHeight);
    var dw = curBg.naturalWidth * sc2, dh = curBg.naturalHeight * sc2;
    ctx.drawImage(curBg, (W - dw) / 2, (H - dh) / 2, dw, dh);
    ctx.restore();
  }

  // Grid
  ctx.save(); ctx.globalAlpha=0.035; ctx.strokeStyle='#0f0'; ctx.lineWidth=1;
  var gstep=38*SC;
  for (var gx=0;gx<W;gx+=gstep){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
  for (var gy=0;gy<H;gy+=gstep){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}
  ctx.restore();

  // Ground line
  ctx.save(); ctx.strokeStyle='#0f0'; ctx.lineWidth=1.5; ctx.shadowColor='#0f0'; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.moveTo(0,H-28*SC); ctx.lineTo(W,H-28*SC); ctx.stroke(); ctx.restore();

  if (gameState === 'play' || gameState === 'over' || gameState === 'levelup' || gameState === 'respawn' || gameState === 'fanfare') {
    drawBarriers();
    for (var i=0;i<invaders.length;i++) if (invaders[i].alive) drawInvader(invaders[i],t);
    drawUFO();
    drawBoss(t);
    drawBullets(t);
    drawPlayer(t);
    drawFX();
  }

  // Fanfare overlay
  if (gameState === 'fanfare') {
    var prog = 1 - fanfareTimer / FANFARE_DUR; // 0→1
    ctx.save();
    // Flash pulse on beat (notes hit at 0, 0.12, 0.24 ... 0.72)
    var beatPulse = Math.max(0, 1 - (fanfareTimer % 0.12) / 0.06);
    ctx.fillStyle = 'rgba(255,255,255,' + (beatPulse * 0.07) + ')';
    ctx.fillRect(0, 0, W, H);
    // LEVEL CLEAR text
    var fs = Math.round(clamp(W * 0.09, 32, 90));
    ctx.font = 'bold ' + fs + 'px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // Rainbow cycle on text
    var textHue = (t * 120) % 360;
    ctx.fillStyle = 'hsl(' + Math.round(textHue) + ',100%,65%)';
    ctx.shadowColor = 'hsl(' + Math.round(textHue) + ',100%,55%)';
    ctx.shadowBlur = 30;
    // Slight scale-in bounce
    var scl = prog < 0.15 ? prog / 0.15 : 1.0 + 0.04 * Math.sin(t * 18);
    ctx.save();
    ctx.translate(W/2, H/2 - fs * 0.6);
    ctx.scale(scl, scl);
    ctx.fillText('LEVEL CLEAR', 0, 0);
    ctx.restore();
    // Level number
    var fs2 = Math.round(fs * 0.55);
    ctx.font = 'bold ' + fs2 + 'px Courier New';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 14;
    ctx.globalAlpha = 0.85;
    ctx.fillText('ENTERING LEVEL ' + (level + 1), W/2, H/2 + fs * 0.35);
    ctx.restore();
  }

  // Respawn countdown overlay
  if (gameState === 'respawn') {
    var cd = Math.ceil(respawnTimer);
    // Dim vignette
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    // Pulsing ring at player position
    var px = player ? player.x : W/2, py = player ? player.y : H - 48*SC;
    var ringR = (60 + 20*Math.sin(t*8)) * SC;
    ctx.strokeStyle = 'rgba(0,255,0,' + (0.3+0.3*Math.sin(t*8)) + ')';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#0f0'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(px, py, ringR, 0, Math.PI*2); ctx.stroke();
    // Big countdown digit
    var fsize = Math.round(120 * SC);
    ctx.font = 'bold ' + fsize + 'px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var pulse2 = 0.7 + 0.3*Math.sin(t * Math.PI * 2); // pulses once/sec
    ctx.globalAlpha = pulse2;
    ctx.fillStyle = '#0f0';
    ctx.shadowColor = '#0f0'; ctx.shadowBlur = 40;
    ctx.fillText(cd, W/2, H/2);
    // Sub-label
    ctx.globalAlpha = 0.7;
    ctx.font = 'bold ' + Math.round(18*SC) + 'px Courier New';
    ctx.fillStyle = '#0a0';
    ctx.shadowBlur = 8;
    ctx.fillText('RESPAWNING', W/2, H/2 + fsize*0.7);
    ctx.restore();
  }

  // Scanlines
  ctx.save(); ctx.globalAlpha=0.055; ctx.fillStyle='#000';
  for (var sy=0;sy<H;sy+=4) ctx.fillRect(0,sy,W,2);
  ctx.restore();

  drawCursor(t);
}

// ── Loop ─────────────────────────────────────────────────
var lastTS = 0;
function loop(ts) {
  var dt = Math.min((ts - lastTS) / 1000, 0.05);
  lastTS = ts;
  update(dt, ts / 1000);
  draw(ts / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(function(ts){ lastTS=ts; requestAnimationFrame(loop); });

})();
</script>
</body>
