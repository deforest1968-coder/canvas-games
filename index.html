<body>
<canvas id="c"></canvas>
<div id="title"><h1>HTML ARCADE</h1><h2>SELECT A DESTINATION</h2></div>
<div id="hint">ARROW KEYS / CLICK TO FLY &nbsp;&nbsp;•&nbsp;&nbsp; TOUCH A PLANET TO LAUNCH</div>

<script>
(function(){
"use strict";
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const tooltip=document.getElementById('tooltip');
const launchFlash=document.getElementById('launchFlash');
const hint=document.getElementById('hint');

let W=0,H=0,dpr=1;
function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
resize();

// ---------- utility ----------
function rand(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function easeInOut(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
function dist2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hexRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const num=parseInt(hex,16);
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function shade(hex,percent){
  const {r,g,b}=hexRgb(hex);
  const t=percent<0?0:255, p=Math.abs(percent);
  const nr=Math.round((t-r)*p+r), ng=Math.round((t-g)*p+g), nb=Math.round((t-b)*p+b);
  return `rgb(${nr},${ng},${nb})`;
}

// ---------- games catalogue ----------
// file: exact relative filename next to this browser file. name: display label.
const GAMES=[
  {file:'asteroids.html', name:'ASTEROIDS', color:'#8fa8ff'},
  {file:'BOSCONIAN — Space Battle.html', name:'BOSCONIAN', color:'#ff6a4d'},
  {file:'breakout.html', name:'BREAKOUT', color:'#ff5cf0'},
  {file:'colonizer.html', name:'COLONIZER', color:'#66ccff'},
  {file:'COMBAT - Tank Mode.html', name:'COMBAT: TANK MODE', color:'#c8ff33'},
  {file:'frenzy.html', name:'FRENZY', color:'#ff4477'},
  {file:'missile_command.html', name:'MISSILE COMMAND', color:'#ff3344'},
  {file:'qix.html', name:'QIX', color:'#33ccff'},
  {file:'quantum_generator.html', name:'QUANTUM GENERATOR', color:'#b088ff'},
  {file:'Robotron_Canvas.html', name:'ROBOTRON', color:'#33ddaa'},
  {file:'space_invaders.html', name:'SPACE INVADERS', color:'#7dffb3'},
  {file:'stargate.html', name:'STARGATE', color:'#b088ff'},
  {file:'vanguard.html', name:'VANGUARD', color:'#66ffcc'},
  {file:'venture.html', name:'VENTURE', color:'#ffcc55'}
];

// ---------- starfield ----------
let stars=[];
function makeStars(){
  stars=[];
  for(let i=0;i<220;i++){
    stars.push({x:Math.random(),y:Math.random(),r:rand(0.4,1.8),tw:rand(0,Math.PI*2),spd:rand(0.5,2)});
  }
}
makeStars();
function drawStars(dt){
  for(const s of stars){
    s.tw+=dt*s.spd;
    const a=0.3+0.55*Math.abs(Math.sin(s.tw));
    ctx.fillStyle=`rgba(200,225,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fill();
  }
}

// ---------- planet layout (fixed seed so games stay in familiar spots) ----------
const layoutRng=mulberry32(90210);
function buildLayout(){
  const cols=6, rows=5;
  const cellW=1/cols, cellH=1/rows;
  const positions=[];
  for(let i=0;i<GAMES.length;i++){
    const col=i%cols, row=Math.floor(i/cols);
    const jitterX=(layoutRng()-0.5)*cellW*0.5;
    const jitterY=(layoutRng()-0.5)*cellH*0.5;
    const x=clamp((col+0.5)/cols+jitterX, 0.06,0.94);
    const y=clamp((row+0.6)/rows+jitterY, 0.14,0.92);
    positions.push({x,y});
  }
  return positions;
}
const layout=buildLayout();
const planets=GAMES.map((g,i)=>{
  const sizeRoll=layoutRng();
  const radius = sizeRoll<0.3 ? rand(24,32) : sizeRoll<0.7 ? rand(34,44) : rand(46,58);
  return {
    game:g, x:layout[i].x, y:layout[i].y, radius,
    seed:Math.floor(layoutRng()*100000)
  };
});

function planetVisualPos(p){
  const phase=(p.seed%1000)/1000*Math.PI*2;
  return {
    x:p.x*W + Math.sin(clockT*0.32+phase)*9,
    y:p.y*H + Math.cos(clockT*0.26+phase*1.3)*7
  };
}
function planetThrob(p){
  const phase=(p.seed%1000)/1000*Math.PI*2;
  return 1+0.05*Math.sin(clockT*1.6+phase*2);
}

// ---------- ship ----------
let ship={x:0.5,y:0.92};
let shipAngle=0, shipThrust=false;
let STATE='fly'; // fly, travel, zoom
let travelInfo=null, zoomInfo=null;

function drawShip(x,y,angle,thrust,scale){
  scale=scale||1;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.scale(scale,scale);
  ctx.fillStyle='rgba(70,190,255,0.9)';
  ctx.strokeStyle='#0a6b8a';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(-3,1); ctx.lineTo(-13,9); ctx.lineTo(-9,11); ctx.lineTo(-2,7);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(3,1); ctx.lineTo(13,9); ctx.lineTo(9,11); ctx.lineTo(2,7);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  const grad=ctx.createLinearGradient(-8,-13,8,10);
  grad.addColorStop(0,'#ffffff');
  grad.addColorStop(0.35,'#9fefff');
  grad.addColorStop(0.7,'#3fa8dd');
  grad.addColorStop(1,'#0a5a80');
  ctx.fillStyle=grad;
  ctx.strokeStyle='#0af';
  ctx.lineWidth=1.4;
  ctx.shadowColor='#5be8ff';
  ctx.shadowBlur=18;
  ctx.beginPath();
  ctx.moveTo(0,-13); ctx.lineTo(5,4); ctx.lineTo(6,9); ctx.lineTo(0,6); ctx.lineTo(-6,9); ctx.lineTo(-5,4);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur=0;
  const canopyGrad=ctx.createRadialGradient(0,-4,1,0,-3,4.5);
  canopyGrad.addColorStop(0,'#ffffff'); canopyGrad.addColorStop(0.5,'#aee3ff'); canopyGrad.addColorStop(1,'#2a7fb0');
  ctx.fillStyle=canopyGrad;
  ctx.beginPath(); ctx.ellipse(0,-3,2.8,4.6,0,0,Math.PI*2); ctx.fill();
  if(thrust){
    for(const ox of [-4.5,4.5]){
      ctx.fillStyle='rgba(255,190,70,0.9)';
      ctx.beginPath();
      ctx.moveTo(ox-2,10); ctx.lineTo(ox,10+rand(8,16)); ctx.lineTo(ox+2,10);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

// ---------- planet rendering ----------
function drawPlanet(p,highlighted){
  const vp=planetVisualPos(p);
  const cx=vp.x, cy=vp.y, r=p.radius*planetThrob(p);
  const rng=mulberry32(p.seed);
  const grad=ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1,cx,cy,r);
  grad.addColorStop(0, p.game.color);
  grad.addColorStop(1, shade(p.game.color,-0.6));
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.16)';
  for(let i=0;i<4;i++){
    const a=rng()*Math.PI*2, rr=rng()*r*0.55, sz=rng()*r*0.2+3;
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,sz,0,Math.PI*2); ctx.fill();
  }
  const pulse=highlighted?0.6+0.4*Math.sin(clockT*6):0;
  ctx.strokeStyle=highlighted?'#ffffff':p.game.color;
  ctx.lineWidth=highlighted?3:2;
  ctx.shadowColor=p.game.color;
  ctx.shadowBlur=highlighted?18+10*pulse:8;
  ctx.beginPath(); ctx.arc(cx,cy,r+5,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur=0;

  ctx.fillStyle='#eafcff';
  ctx.font='bold 12px Courier New';
  ctx.textAlign='center';
  ctx.shadowColor='#000'; ctx.shadowBlur=4;
  ctx.fillText(p.game.name, cx, cy+r+20);
  ctx.shadowBlur=0;
  return {cx,cy,r};
}

// ---------- launching ----------
let launching=false;
let launchCooldown=0;
function launchGame(planet){
  if(launching) return;
  launching=true;
  launchFlash.style.transition='opacity 0.12s ease-out';
  launchFlash.style.opacity='0.85';
  setTimeout(()=>{
    launchFlash.style.transition='opacity 0.5s ease-in';
    launchFlash.style.opacity='0';
  },120);
  try{
    window.open(encodeURI(planet.game.file), '_blank');
  }catch(e){ /* ignore */ }
  setTimeout(()=>{ launching=false; }, 500);
}

function startTravel(planet){
  if(STATE!=='fly') return;
  STATE='travel';
  const from={x:ship.x,y:ship.y};
  const to={x:planet.x,y:planet.y};
  const d=Math.hypot((to.x-from.x)*W,(to.y-from.y)*H);
  travelInfo={from,to,t:0,duration:clamp(d/300,0.5,2.2),target:planet};
  hint.textContent='EN ROUTE...';
}
function updateTravel(dt){
  travelInfo.t+=dt/travelInfo.duration;
  const t=clamp(travelInfo.t,0,1);
  const e=easeInOut(t);
  ship.x=lerp(travelInfo.from.x,travelInfo.to.x,e);
  ship.y=lerp(travelInfo.from.y,travelInfo.to.y,e);
  if(t>=1){
    startZoom(travelInfo.target);
  }
}
function startZoom(planet){
  STATE='zoom';
  zoomInfo={planet,t:0,duration:1.1};
  hint.textContent='';
}
function updateZoom(dt){
  zoomInfo.t+=dt;
  if(zoomInfo.t>=zoomInfo.duration){
    launchGame(zoomInfo.planet);
    // move the ship off the planet so it can't immediately re-trigger a launch,
    // and arm a short cooldown as a second safety net (e.g. if this tab was
    // throttled in the background and resumes with a big elapsed-time jump)
    const p=zoomInfo.planet;
    const safeDist=(p.radius+40)/Math.min(W,H);
    const ang=Math.random()*Math.PI*2;
    ship.x=clamp(p.x+Math.cos(ang)*safeDist, 0.02,0.98);
    ship.y=clamp(p.y+Math.sin(ang)*safeDist, 0.04,0.97);
    launchCooldown=0.8;
    STATE='fly';
    hint.textContent='ARROW KEYS / CLICK TO FLY  •  TOUCH A PLANET TO LAUNCH';
  }
}
function drawZoom(dt){
  const t=clamp(zoomInfo.t/zoomInfo.duration,0,1);
  const e=easeInOut(t);
  drawStars(dt);
  const scale=lerp(1,5.4,e);
  const vp=planetVisualPos(zoomInfo.planet);
  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.scale(scale,scale);
  ctx.translate(-vp.x,-vp.y);
  drawPlanet(zoomInfo.planet,true);
  ctx.restore();
  const fadeIn=clamp(t*2.5,0,1);
  ctx.globalAlpha=fadeIn;
  ctx.fillStyle='#eafcff';
  ctx.font='bold 22px Courier New';
  ctx.textAlign='center';
  ctx.shadowColor='#5be8ff'; ctx.shadowBlur=14;
  ctx.fillText('LAUNCHING '+zoomInfo.planet.game.name, W/2, 60);
  ctx.shadowBlur=0;
  ctx.globalAlpha=1;
}

// ---------- input ----------
let keys={left:false,right:false,up:false,down:false};
let mouse={x:0,y:0};
window.addEventListener('keydown',e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left=true;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right=true;
  if(['ArrowUp','w','W'].includes(e.key)) keys.up=true;
  if(['ArrowDown','s','S'].includes(e.key)) keys.down=true;
});
window.addEventListener('keyup',e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left=false;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right=false;
  if(['ArrowUp','w','W'].includes(e.key)) keys.up=false;
  if(['ArrowDown','s','S'].includes(e.key)) keys.down=false;
});
canvas.addEventListener('mousemove',e=>{
  mouse.x=e.clientX; mouse.y=e.clientY;
  let hovered=null;
  for(const p of planets){
    const vp=planetVisualPos(p);
    if(dist2(mouse.x,mouse.y,vp.x,vp.y) < (p.radius+10)*(p.radius+10)){ hovered=p; break; }
  }
  if(hovered){
    tooltip.style.display='block';
    tooltip.style.left=e.clientX+'px';
    tooltip.style.top=e.clientY+'px';
    tooltip.textContent=hovered.game.name;
    tooltip.style.color=hovered.game.color;
    canvas.style.cursor='pointer';
  } else {
    tooltip.style.display='none';
    canvas.style.cursor='crosshair';
  }
});
canvas.addEventListener('mouseleave',()=>{ tooltip.style.display='none'; });
canvas.addEventListener('click',e=>{
  for(const p of planets){
    const vp=planetVisualPos(p);
    if(dist2(e.clientX,e.clientY,vp.x,vp.y) < (p.radius+10)*(p.radius+10)){
      startTravel(p);
      return;
    }
  }
});
canvas.addEventListener('touchstart',e=>{
  const t=e.touches[0];
  for(const p of planets){
    const vp=planetVisualPos(p);
    if(dist2(t.clientX,t.clientY,vp.x,vp.y) < (p.radius+16)*(p.radius+16)){
      startTravel(p);
      e.preventDefault();
      return;
    }
  }
},{passive:false});

// ---------- main loop ----------
let clockT=0;
let lastT=performance.now();
function updateFly(dt){
  let dx=0,dy=0;
  if(keys.left) dx-=1;
  if(keys.right) dx+=1;
  if(keys.up) dy-=1;
  if(keys.down) dy+=1;
  if(dx!==0||dy!==0){
    const len=Math.hypot(dx,dy)||1;
    const speed=250;
    ship.x=clamp(ship.x+(dx/len)*speed*dt/W, 0.02,0.98);
    ship.y=clamp(ship.y+(dy/len)*speed*dt/H, 0.04,0.97);
    shipAngle=Math.atan2(dx,-dy);
    shipThrust=true;
  } else {
    shipThrust=false;
  }
  if(launchCooldown>0){
    launchCooldown=Math.max(0,launchCooldown-dt);
    return;
  }
  // fly into a planet to launch it
  for(const p of planets){
    const vp=planetVisualPos(p);
    if(dist2(ship.x*W,ship.y*H,vp.x,vp.y) < (p.radius+14)*(p.radius+14)){
      startTravel(p);
      break;
    }
  }
}
function drawFly(dt){
  drawStars(dt);
  let hoveredPlanet=null;
  for(const p of planets){
    const vp=planetVisualPos(p);
    if(dist2(mouse.x,mouse.y,vp.x,vp.y) < (p.radius+10)*(p.radius+10)) hoveredPlanet=p;
  }
  ctx.strokeStyle='rgba(120,200,255,0.15)';
  ctx.lineWidth=1;
  const shipPx=ship.x*W, shipPy=ship.y*H;
  for(const p of planets){
    const vp=planetVisualPos(p);
    ctx.beginPath();
    ctx.moveTo(shipPx,shipPy);
    ctx.lineTo(vp.x,vp.y);
    ctx.stroke();
  }
  for(const p of planets){ drawPlanet(p, p===hoveredPlanet); }
  drawShip(ship.x*W, ship.y*H, shipAngle, shipThrust);
}
function drawTravel(dt){
  drawStars(dt);
  for(const p of planets){ drawPlanet(p, p===travelInfo.target); }
  const dx=(travelInfo.to.x-travelInfo.from.x), dy=(travelInfo.to.y-travelInfo.from.y);
  const angle=Math.atan2(dx,-dy);
  drawShip(ship.x*W, ship.y*H, angle, true);
}

function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;
  clockT+=dt;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(3,5,14,0.4)';
  ctx.fillRect(0,0,W,H);

  if(STATE==='fly'){ updateFly(dt); drawFly(dt); }
  else if(STATE==='travel'){ updateTravel(dt); drawTravel(dt); }
  else if(STATE==='zoom'){ updateZoom(dt); drawZoom(dt); }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
