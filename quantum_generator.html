<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quantum Generator</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<button id="back-button">&larr; Back</button>
<button id="mute-button">&#128266; Mute</button>
<pre id="math-panel"></pre>
<div id="ui-overlay">
  <h1 id="title">Quantum Generator</h1>
  <div id="ball-count">Balls: 0</div>
  <div id="level-display">Level 1: Circle</div>
</div>

<div id="launch-screen">
  <div id="launch-panel">
    <h1 id="launch-title">Quantum Generator</h1>
    <p id="launch-subtitle">Configure the simulation, then launch.</p>

    <label class="launch-field">
      <span>Starting ball count</span>
      <input type="number" id="opt-starting-balls" min="1" max="200" step="1" value="5">
    </label>

    <label class="launch-field">
      <span>Total ball count</span>
      <input type="number" id="opt-ball-cap" min="10" max="20000" step="10" value="1000">
    </label>

    <label class="launch-field">
      <span>Rotation speed</span>
      <input type="range" id="opt-rotation-speed" min="0" max="3" step="0.05" value="1">
      <span class="launch-field-value" id="opt-rotation-speed-value">1.0x</span>
    </label>

    <label class="launch-field">
      <span>Ball speed</span>
      <input type="range" id="opt-ball-speed" min="0.2" max="3" step="0.05" value="1">
      <span class="launch-field-value" id="opt-ball-speed-value">1.0x</span>
    </label>

    <label class="launch-field">
      <span>Ball size</span>
      <input type="range" id="opt-ball-size" min="0.2" max="4" step="0.05" value="1">
      <span class="launch-field-value" id="opt-ball-size-value">1.0x</span>
    </label>

    <label class="launch-field">
      <span>Gap size</span>
      <input type="range" id="opt-gap-size" min="2" max="60" step="0.25" value="11.25">
      <span class="launch-field-value" id="opt-gap-size-value">11.3°</span>
    </label>

    <label class="launch-field">
      <span>Balls spawned per escape</span>
      <input type="number" id="opt-spawn-multiplier" min="0" max="20" step="1" value="2">
    </label>

    <button id="launch-button">Launch</button>
  </div>
</div>
<style>
  #ui-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
    pointer-events: none;
    font-family: 'Courier New', monospace;
    color: #fff;
    z-index: 10;
  }
  #title {
    margin: 24px 0 4px 0;
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff5555, #ffdd55, #55ff88, #55ddff, #cc77ff, #ff5555);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: title-shimmer 6s linear infinite;
    text-shadow: 0 0 25px rgba(120, 180, 255, 0.35);
  }
  @keyframes title-shimmer {
    to { background-position: 200% center; }
  }
  #ball-count {
    font-size: 1rem;
    letter-spacing: 0.1em;
    color: #9fd8ff;
    text-shadow: 0 0 8px rgba(80, 160, 255, 0.6);
  }
  #level-display {
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: #ffd39f;
    text-shadow: 0 0 8px rgba(255, 170, 80, 0.6);
    margin-top: 2px;
  }

  #launch-screen {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, rgba(10, 15, 30, 0.92), rgba(0, 0, 0, 0.97));
    font-family: 'Courier New', monospace;
  }
  #launch-panel {
    width: min(90vw, 420px);
    padding: 32px 28px;
    border-radius: 16px;
    background: rgba(15, 20, 35, 0.75);
    border: 1px solid rgba(120, 180, 255, 0.35);
    box-shadow: 0 0 40px rgba(80, 140, 255, 0.25);
    text-align: center;
  }
  #launch-title {
    margin: 0 0 6px 0;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff5555, #ffdd55, #55ff88, #55ddff, #cc77ff, #ff5555);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: title-shimmer 6s linear infinite;
  }
  #launch-subtitle {
    margin: 0 0 24px 0;
    color: #9fb8d8;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
  }
  .launch-field {
    display: block;
    text-align: left;
    margin-bottom: 20px;
    color: #d6e6ff;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
  }
  .launch-field span:first-child {
    display: block;
    margin-bottom: 6px;
  }
  .launch-field input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(120, 180, 255, 0.4);
    background: rgba(0, 0, 0, 0.4);
    color: #fff;
    font-family: inherit;
    font-size: 0.9rem;
  }
  .launch-field input[type="range"] {
    width: 100%;
    accent-color: #55ddff;
    vertical-align: middle;
  }
  .launch-field-value {
    display: inline-block;
    margin-top: 4px;
    color: #9fd8ff;
    font-size: 0.8rem;
  }
  #launch-button {
    margin-top: 8px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #55ddff, #cc77ff);
    color: #05070f;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 0.95rem;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(120, 180, 255, 0.4);
  }
  #launch-button:hover {
    filter: brightness(1.1);
  }
  #launch-screen.hidden {
    display: none;
  }
  #back-button {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 20;
    padding: 8px 14px;
    border: 1px solid rgba(120, 180, 255, 0.4);
    border-radius: 8px;
    background: rgba(10, 15, 30, 0.6);
    color: #9fd8ff;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    display: none;
  }
  #back-button:hover {
    background: rgba(20, 30, 55, 0.85);
    color: #fff;
  }
  #back-button.visible {
    display: block;
  }
  #mute-button {
    position: fixed;
    top: 58px;
    left: 16px;
    z-index: 20;
    padding: 8px 14px;
    border: 1px solid rgba(120, 180, 255, 0.4);
    border-radius: 8px;
    background: rgba(10, 15, 30, 0.6);
    color: #9fd8ff;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    display: none;
  }
  #mute-button:hover {
    background: rgba(20, 30, 55, 0.85);
    color: #fff;
  }
  #mute-button.visible {
    display: block;
  }
  #mute-button.muted {
    color: #ff8f8f;
    border-color: rgba(255, 120, 120, 0.4);
  }
  #math-panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 15;
    margin: 0;
    padding: 10px 16px 12px 16px;
    background: linear-gradient(to top, rgba(0, 4, 12, 0.88), rgba(0, 4, 12, 0.55) 80%, transparent);
    border-top: 1px solid rgba(120, 220, 200, 0.25);
    color: #7fffd4;
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    line-height: 1.55;
    white-space: pre-wrap;
    pointer-events: none;
    text-shadow: 0 0 6px rgba(80, 255, 210, 0.35);
    display: none;
  }
  #math-panel.visible {
    display: block;
  }
  #math-panel .m-dim {
    color: #4f9c8c;
  }
  #math-panel .m-val {
    color: #ffe27a;
  }
</style>
<script>
const canvas = document.getElementById('canvas');
const ballCountEl = document.getElementById('ball-count');
const levelEl = document.getElementById('level-display');
const mathPanelEl = document.getElementById('math-panel');
const ctx = canvas.getContext('2d');

// --- Audio ---
let audioCtx = null;
let masterGain = null;
let isMuted = false;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = isMuted ? 0 : 1;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function setMuted(muted) {
  isMuted = muted;
  if (masterGain) masterGain.gain.value = muted ? 0 : 1;
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

let boomBuffer = null;
let boomDecodePromise = null;
function ensureBoomDecoded() {
  if (boomBuffer || boomDecodePromise) return boomDecodePromise;
  const ctx = getAudioCtx();
  boomDecodePromise = ctx.decodeAudioData(base64ToArrayBuffer(boomBase64))
    .then(buf => { boomBuffer = buf; })
    .catch(() => {});
  return boomDecodePromise;
}

function playBoom() {
  const ctx = getAudioCtx();
  const play = () => {
    if (!boomBuffer) return;
    const src = ctx.createBufferSource();
    const gain = ctx.createGain();
    gain.gain.value = 0.09;
    src.buffer = boomBuffer;
    src.connect(gain);
    gain.connect(masterGain);
    src.start();
  };
  if (boomBuffer) {
    play();
  } else {
    ensureBoomDecoded().then(play);
  }
}

// Throttled, quiet blips so rapid escapes/spawns don't spam the ear
let lastEscapeSoundTime = 0;
let lastSpawnSoundTime = 0;
const SOUND_COOLDOWN_MS = 60;

// Map a ball's HSL color to a distinct pitch + waveform so each hue has its own escape sound
function hueFromColor(colorStr) {
  const match = /hsl\(\s*(\d+(?:\.\d+)?)/.exec(colorStr);
  return match ? parseFloat(match[1]) : 0;
}

function hueToFrequency(hue) {
  // spread hues across a bit over two octaves, starting on a low A
  return 220 * Math.pow(2, hue / 360 * 2.2);
}

const ESCAPE_WAVEFORMS = ['sine', 'triangle', 'sawtooth', 'square'];
function hueToWaveform(hue) {
  const idx = Math.floor((hue / 360) * ESCAPE_WAVEFORMS.length) % ESCAPE_WAVEFORMS.length;
  return ESCAPE_WAVEFORMS[idx];
}

function playEscapeSound(color) {
  const now = performance.now();
  if (now - lastEscapeSoundTime < SOUND_COOLDOWN_MS) return;
  lastEscapeSoundTime = now;
  try {
    const ctx = getAudioCtx();
    const hue = hueFromColor(color);
    const freq = hueToFrequency(hue);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = hueToWaveform(hue);
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freq * 0.65, 40), ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.05, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  } catch (e) {}
}

function playSpawnSound() {
  const now = performance.now();
  if (now - lastSpawnSoundTime < SOUND_COOLDOWN_MS) return;
  lastSpawnSoundTime = now;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, ctx.currentTime);
    gain.gain.setValueAtTime(0.04, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start();
    osc.stop(ctx.currentTime + 0.07);
  } catch (e) {}
}

// Browsers require a user gesture before audio can play - unlock and pre-decode on first interaction
function unlockAudio() {
  getAudioCtx();
  ensureBoomDecoded();
  window.removeEventListener('pointerdown', unlockAudio);
  window.removeEventListener('keydown', unlockAudio);
}
window.addEventListener('pointerdown', unlockAudio);
window.addEventListener('keydown', unlockAudio);


function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => {
  resize();
  initStars();
  if (typeof initBalls === 'function') initBalls();
});

// Starfield — split into far/mid/near layers for a sense of depth. Farther
// stars are smaller, dimmer, twinkle slower, and drift slower than nearer ones.
let stars = [];
const STAR_LAYERS = [
  { share: 0.50, rMin: 0.2, rMax: 0.6, twinkleMin: 0.003, twinkleMax: 0.008, alphaMax: 0.45, drift: 0.02 }, // far
  { share: 0.32, rMin: 0.5, rMax: 1.1, twinkleMin: 0.007, twinkleMax: 0.015, alphaMax: 0.7, drift: 0.06 },  // mid
  { share: 0.18, rMin: 1.0, rMax: 2.0, twinkleMin: 0.012, twinkleMax: 0.025, alphaMax: 1.0, drift: 0.13 }   // near
];

function initStars() {
  const count = Math.floor((canvas.width * canvas.height) / 3000);
  stars = [];
  STAR_LAYERS.forEach((layer, layerIndex) => {
    const layerCount = Math.round(count * layer.share);
    for (let i = 0; i < layerCount; i++) {
      const driftAngle = Math.random() * Math.PI * 2;
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: layer.rMin + Math.random() * (layer.rMax - layer.rMin),
        twinkleSpeed: layer.twinkleMin + Math.random() * (layer.twinkleMax - layer.twinkleMin),
        twinklePhase: Math.random() * Math.PI * 2,
        alphaMax: layer.alphaMax,
        vx: Math.cos(driftAngle) * layer.drift,
        vy: Math.sin(driftAngle) * layer.drift,
        layer: layerIndex
      });
    }
  });
}
initStars();

function updateStars() {
  const w = canvas.width;
  const h = canvas.height;
  for (const s of stars) {
    s.x += s.vx;
    s.y += s.vy;
    // wrap around the edges so drifting stars loop seamlessly
    if (s.x < -5) s.x = w + 5;
    else if (s.x > w + 5) s.x = -5;
    if (s.y < -5) s.y = h + 5;
    else if (s.y > h + 5) s.y = -5;
  }
}

function drawStars(time) {
  for (const s of stars) {
    const twinkle = 0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.twinklePhase);
    const alpha = twinkle * s.alphaMax;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
    ctx.fill();
  }
}

// Slowly-shifting, menacing backdrop: blood reds, sickly greens, toxic purples,
// with a low pulsing vignette like a heartbeat (replaces the brighter nebula)
function drawBackground(time) {
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;

  // near-black base with a faint bloody tint, not a neutral black
  ctx.fillStyle = '#0a0202';
  ctx.fillRect(0, 0, w, h);

  const t = time * 0.05;
  const blobs = [
    { hue: (backgroundHueOffset + t * 8) % 360, dx: Math.cos(t) * 0.28, dy: Math.sin(t * 0.8) * 0.22, r: 0.85 },
    { hue: (backgroundHueOffset + t * 8 + 40) % 360, dx: Math.cos(t * 0.7 + 2) * 0.3, dy: Math.sin(t * 1.1 + 1) * 0.26, r: 0.75 },
    { hue: (backgroundHueOffset + t * 8 - 40 + 360) % 360, dx: Math.cos(t * 1.3 + 4) * 0.25, dy: Math.sin(t * 0.6 + 3) * 0.3, r: 0.8 }
  ];

  ctx.globalCompositeOperation = 'lighter';
  for (const b of blobs) {
    const bx = cx + b.dx * w;
    const by = cy + b.dy * h;
    const radius = Math.max(w, h) * b.r;
    const grad = ctx.createRadialGradient(bx, by, 0, bx, by, radius);
    grad.addColorStop(0, `hsla(${b.hue}, 80%, 26%, 0.4)`);
    grad.addColorStop(0.5, `hsla(${b.hue}, 75%, 16%, 0.18)`);
    grad.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }
  ctx.globalCompositeOperation = 'source-over';

  // slow pulsing vignette, like a heartbeat closing in from the edges
  const pulse = 0.5 + 0.5 * Math.sin(time * 1.6);
  const vignette = ctx.createRadialGradient(cx, cy, Math.max(w, h) * 0.2, cx, cy, Math.max(w, h) * 0.72);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(0.75, `rgba(20,0,0,${(0.25 + pulse * 0.15).toFixed(2)})`);
  vignette.addColorStop(1, `rgba(0,0,0,${(0.75 + pulse * 0.15).toFixed(2)})`);
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, w, h);
}

// Circle parameters
let angle = 0;
let frameCount = 0;
let rotationSpeed = 0.012; // radians per frame, clockwise
let gapSize = Math.PI / 16; // size of the missing section (radians)

// --- Level / shape system ---
// Each shape is defined by an angle -> radius-multiplier function (relative to
// the base apothem), so drawing and physics can treat every shape uniformly.
let currentLevel = 0;
let currentShape = null;
let boundaryFlash = 0; // ramps up gently on wall bounces, decays every frame; drives a subtle reactive glow
const BOUNDARY_FLASH_CAP = 0.55;
let backgroundHueOffset = Math.random() * 360;

// blood red, sickly bile green, toxic purple, charred ember orange
const MENACING_HUE_ANCHORS = [355, 0, 8, 95, 108, 268, 280, 18];

function rerollBackgroundPalette() {
  const anchor = MENACING_HUE_ANCHORS[Math.floor(Math.random() * MENACING_HUE_ANCHORS.length)];
  const jitter = (Math.random() - 0.5) * 12;
  backgroundHueOffset = (anchor + jitter + 360) % 360;
}
let ballSpeedMultiplier = 1;
let ballSizeMultiplier = 1;
let spawnMultiplier = 2;
let startingBallCount = 5;

function shapeNameForSides(sides) {
  const names = { 3: 'Triangle', 4: 'Square', 5: 'Pentagon', 6: 'Hexagon', 7: 'Heptagon', 8: 'Octagon', 9: 'Nonagon' };
  return names[sides] || (sides + '-gon');
}

// Generic wave-based boundary: r(theta) = 1 + amplitude * shape(cos(k*(theta-offset)))
// sharpness > 1 sharpens the peaks into points (stars), sharpness < 1 flattens
// them into plateaus (gear teeth), sharpness = 1 gives smooth sine petals.
function makeWaveRadiusFn(k, amplitude, sharpness, offset) {
  return function (theta) {
    const c = Math.cos(k * (theta - offset));
    const shaped = Math.sign(c) * Math.pow(Math.abs(c), sharpness);
    return 1 + amplitude * shaped;
  };
}

// Ten extra spinning shapes beyond the plain regular polygons, each a small
// recipe of {name, k, amplitude, sharpness} fed into makeWaveRadiusFn. A
// random rotation offset is applied when the shape is picked for a level.
const WAVE_SHAPE_RECIPES = [
  { name: 'Pentagram Star', k: 5, amplitude: 0.42, sharpness: 3.5 },
  { name: 'Hexagram Star', k: 6, amplitude: 0.40, sharpness: 3.5 },
  { name: 'Heptagram Star', k: 7, amplitude: 0.36, sharpness: 3.2 },
  { name: 'Gear', k: 8, amplitude: 0.20, sharpness: 0.35 },
  { name: 'Cog Wheel', k: 12, amplitude: 0.14, sharpness: 0.3 },
  { name: 'Flower', k: 6, amplitude: 0.28, sharpness: 1 },
  { name: 'Daisy', k: 9, amplitude: 0.24, sharpness: 0.8 },
  { name: 'Sun Burst', k: 10, amplitude: 0.30, sharpness: 2.4 },
  { name: 'Ninja Star', k: 4, amplitude: 0.48, sharpness: 5 },
  { name: 'Amoeba', k: null, amplitude: null, sharpness: null } // handled specially below
];

function makeWaveShape(recipe, offset) {
  if (recipe.name === 'Amoeba') {
    // organic wobble: two low harmonics summed instead of one clean multiple
    const offset2 = offset * 1.7 + 1.3;
    return {
      type: 'wave',
      name: 'Amoeba',
      radiusFn: (theta) => 1 + 0.18 * Math.cos(3 * (theta - offset)) + 0.10 * Math.cos(7 * (theta - offset2))
    };
  }
  return {
    type: 'wave',
    name: recipe.name,
    radiusFn: makeWaveRadiusFn(recipe.k, recipe.amplitude, recipe.sharpness, offset)
  };
}

function makeShapeForLevel(level) {
  if (level === 0) {
    return { type: 'circle', name: 'Circle' };
  }
  if (level === 1) {
    return { type: 'polygon', sides: 4, rotationOffset: 0, name: 'Square' };
  }
  if (level === 2) {
    return { type: 'polygon', sides: 4, rotationOffset: Math.PI / 4, name: 'Diamond' };
  }
  const offset = Math.random() * Math.PI * 2;
  // roughly even odds between a plain regular polygon and one of the ten new shapes
  if (Math.random() < 0.4) {
    const sides = 3 + Math.floor(Math.random() * 6); // 3..8
    return { type: 'polygon', sides, rotationOffset: offset, name: shapeNameForSides(sides) };
  }
  const recipe = WAVE_SHAPE_RECIPES[Math.floor(Math.random() * WAVE_SHAPE_RECIPES.length)];
  return makeWaveShape(recipe, offset);
}

// Returns the shape boundary distance from center as a multiplier of the base
// apothem, given a LOCAL angle (i.e. already rotated into the shape's own frame).
function shapeRadiusMultiplier(shape, theta) {
  if (!shape || shape.type === 'circle') return 1;
  if (shape.type === 'wave') return shape.radiusFn(theta);
  const n = shape.sides;
  const segment = (Math.PI * 2) / n;
  let t = theta - shape.rotationOffset;
  t = ((t % segment) + segment) % segment;
  if (t > segment / 2) t -= segment;
  return 1 / Math.cos(t);
}

function drawCircle() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const baseApothem = Math.min(canvas.width, canvas.height) * 0.32;

  // throbbing size and glow, boosted by recent wall bounces (boundaryFlash)
  const throb = Math.sin(frameCount * 0.06);
  const R = baseApothem * (1 + throb * 0.03);
  const lineWidth = 10 + throb * 4 + boundaryFlash * 5;
  const shadowBlur = 25 + throb * 15 + boundaryFlash * 18;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  ctx.beginPath();
  // Sample the boundary densely from just past the gap all the way around to
  // the start of the gap. This works for the circle and any polygon alike.
  const startTheta = gapSize / 2;
  const endTheta = Math.PI * 2 - gapSize / 2;
  const steps = 240;
  for (let i = 0; i <= steps; i++) {
    const theta = startTheta + (endTheta - startTheta) * (i / steps);
    const r = R * shapeRadiusMultiplier(currentShape, theta);
    const x = r * Math.cos(theta);
    const y = r * Math.sin(theta);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }

  // cycling multicolored gradient around the ring, flashed brighter on bounces
  const hueOffset = (frameCount * 1.5) % 360;
  const flashLightness = 60 + boundaryFlash * 12;
  let strokeStyle;
  if (typeof ctx.createConicGradient === 'function') {
    const gradient = ctx.createConicGradient(0, 0, 0);
    for (let i = 0; i <= 6; i++) {
      const hue = (hueOffset + i * 60) % 360;
      gradient.addColorStop(i / 6, `hsl(${hue}, 100%, ${flashLightness}%)`);
    }
    strokeStyle = gradient;
  } else {
    // fallback for browsers without conic gradient support
    const gradient = ctx.createLinearGradient(-R, -R, R, R);
    for (let i = 0; i <= 6; i++) {
      const hue = (hueOffset + i * 60) % 360;
      gradient.addColorStop(i / 6, `hsl(${hue}, 100%, ${flashLightness}%)`);
    }
    strokeStyle = gradient;
  }

  ctx.strokeStyle = strokeStyle;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = `hsl(${hueOffset}, 100%, ${flashLightness}%)`;
  ctx.shadowBlur = shadowBlur;
  ctx.stroke();

  ctx.restore();
}

function drawGapLabel() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const baseApothem = Math.min(canvas.width, canvas.height) * 0.32;
  const throb = Math.sin(frameCount * 0.06);
  const R = baseApothem * (1 + throb * 0.03);

  // gap is centered at local theta = 0, so its live world angle is just the ring's rotation
  const r0 = R * shapeRadiusMultiplier(currentShape, 0);
  const worldTheta = angle;
  const labelR = r0 + 26;
  const x = cx + labelR * Math.cos(worldTheta);
  const y = cy + labelR * Math.sin(worldTheta);

  ctx.save();
  ctx.translate(x, y);
  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#eafff6';
  ctx.shadowColor = '#7fffd4';
  ctx.shadowBlur = 12;
  ctx.fillText('EXIT', 0, 0);
  ctx.restore();
}

// Bouncing balls
let balls = [];
const TRAIL_LENGTH = 6;
const TRAIL_ENABLED_MAX = 250; // skip trail rendering once the swarm gets too big to keep perf sane

function randomVividColor() {
  const hue = Math.floor(Math.random() * 360);
  const sat = 85 + Math.random() * 15;
  const light = 55 + Math.random() * 15;
  return `hsl(${hue}, ${sat}%, ${light}%)`;
}

function getCircleGeometry() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.min(canvas.width, canvas.height) * 0.32; // base apothem (non-throbbing), used for physics
  return { cx, cy, radius };
}

function makeBall() {
  const { radius } = getCircleGeometry();
  const ballRadius = (5 + Math.random() * 3) * ballSizeMultiplier;
  const spawnR = Math.random() * (radius - ballRadius - 20);
  const spawnAngle = Math.random() * Math.PI * 2;
  const speed = (14 + Math.random() * 8) * ballSpeedMultiplier;
  const dir = Math.random() * Math.PI * 2;
  return {
    x: Math.cos(spawnAngle) * spawnR,
    y: Math.sin(spawnAngle) * spawnR,
    vx: Math.cos(dir) * speed,
    vy: Math.sin(dir) * speed,
    r: ballRadius,
    color: randomVividColor(),
    escaped: false,
    trail: []
  };
}

function initBalls() {
  balls = [];
  for (let i = 0; i < startingBallCount; i++) {
    balls.push(makeBall());
  }
}
currentShape = makeShapeForLevel(currentLevel);
initBalls();

function normalizeAngle(a) {
  // modulo-based wrap: O(1) regardless of how large `a` has grown, unlike the
  // old while-loop version which slowed to a crawl (looked like a freeze)
  // after hours of play once `angle` accumulated into the thousands of radians
  a = a % (Math.PI * 2);
  if (a > Math.PI) a -= Math.PI * 2;
  else if (a < -Math.PI) a += Math.PI * 2;
  return a;
}

function updateBalls() {
  const { radius } = getCircleGeometry(); // base apothem
  const newBalls = [];

  for (const b of balls) {
    b.x += b.vx;
    b.y += b.vy;

    if (!exploding) {
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > TRAIL_LENGTH) b.trail.shift();
    }

    if (!b.escaped) {
      // bounce off the shape's boundary (coordinates are relative to center)
      const dist = Math.sqrt(b.x * b.x + b.y * b.y);
      const ballAngle = Math.atan2(b.y, b.x);
      const localTheta = normalizeAngle(ballAngle - angle);
      const boundaryR = radius * shapeRadiusMultiplier(currentShape, localTheta);
      const maxDist = boundaryR - b.r;
      if (dist > maxDist) {
        const nx = b.x / dist;
        const ny = b.y / dist;
        const vr = b.vx * nx + b.vy * ny; // radial velocity component
        if (vr > 0) {
          // actually moving outward through the boundary
          // gap occupies world-angle range (angle - gapSize/2, angle + gapSize/2)
          if (Math.abs(localTheta) < gapSize / 2) {
            // passes through the gap - let it fly free
            b.escaped = true;
            playEscapeSound(b.color);
            for (let i = 0; i < spawnMultiplier; i++) newBalls.push(makeBall());
            playSpawnSound();
          } else {
            // reposition just inside boundary
            b.x = nx * maxDist;
            b.y = ny * maxDist;
            // reflect velocity across normal
            const dot = vr;
            b.vx -= 2 * dot * nx;
            b.vy -= 2 * dot * ny;
            boundaryFlash = Math.min(BOUNDARY_FLASH_CAP, boundaryFlash + 0.08);
          }
        }
      }
    } else {
      // free-flying outside: drift freely (can float off screen),
      // but bounce off the shape's outer wall if it drifts back toward it
      const dist = Math.sqrt(b.x * b.x + b.y * b.y);
      const ballAngle = Math.atan2(b.y, b.x);
      const localTheta = normalizeAngle(ballAngle - angle);
      const boundaryR = radius * shapeRadiusMultiplier(currentShape, localTheta);
      const outerContact = boundaryR + b.r;
      if (dist < outerContact) {
        const nx = b.x / dist;
        const ny = b.y / dist;
        const vr = b.vx * nx + b.vy * ny; // radial velocity component
        if (vr < 0) {
          // actually moving inward through the boundary
          if (Math.abs(localTheta) < gapSize / 2) {
            // re-enters through the gap
            b.escaped = false;
          } else {
            // reposition just outside the wall
            b.x = nx * outerContact;
            b.y = ny * outerContact;
            // reflect velocity across normal
            const dot = vr;
            b.vx -= 2 * dot * nx;
            b.vy -= 2 * dot * ny;
            boundaryFlash = Math.min(BOUNDARY_FLASH_CAP, boundaryFlash + 0.08);
          }
        }
      }
    }
  }

  if (newBalls.length) balls.push(...newBalls);

  // clean up balls that have floated far off screen so the array doesn't grow forever
  const margin = 300;
  balls = balls.filter(b => {
    if (!b.escaped) return true;
    const { cx, cy } = getCircleGeometry();
    const screenX = b.x + cx;
    const screenY = b.y + cy;
    return screenX > -margin && screenX < canvas.width + margin &&
           screenY > -margin && screenY < canvas.height + margin;
  });

  // simple ball-to-ball collisions
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = a.r + b.r;
      if (dist > 0 && dist < minDist) {
        const nx = dx / dist, ny = dy / dist;
        const overlap = (minDist - dist) / 2;
        a.x -= nx * overlap;
        a.y -= ny * overlap;
        b.x += nx * overlap;
        b.y += ny * overlap;
        const dvx = b.vx - a.vx, dvy = b.vy - a.vy;
        const rel = dvx * nx + dvy * ny;
        if (rel < 0) {
          a.vx += rel * nx;
          a.vy += rel * ny;
          b.vx -= rel * nx;
          b.vy -= rel * ny;
        }
      }
    }
  }
}

function drawBalls() {
  const { cx, cy } = getCircleGeometry();
  ctx.save();
  ctx.translate(cx, cy);
  const showTrails = balls.length <= TRAIL_ENABLED_MAX;
  for (const b of balls) {
    if (showTrails && b.trail && b.trail.length > 1) {
      ctx.lineCap = 'round';
      ctx.strokeStyle = b.color;
      ctx.lineWidth = Math.max(1, b.r * 0.85);
      for (let i = 0; i < b.trail.length - 1; i++) {
        const p0 = b.trail[i];
        const p1 = b.trail[i + 1];
        ctx.globalAlpha = ((i + 1) / b.trail.length) * 0.3;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 12;
    ctx.fill();
  }
  ctx.restore();
}

// Explosion when the ball count hits the cap
let BALL_CAP = 1000;
const explosionDuration = 70; // frames
let exploding = false;
let explosionTimer = 0;
let explosionParticles = [];

function triggerExplosion() {
  playBoom();
  exploding = true;
  explosionTimer = 0;
  explosionParticles = [];
  const { radius } = getCircleGeometry();

  // fragments of the ring itself, flying outward
  const ringCount = 90;
  for (let i = 0; i < ringCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = 5 + Math.random() * 9;
    explosionParticles.push({
      x: Math.cos(a) * radius,
      y: Math.sin(a) * radius,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      r: 3 + Math.random() * 3,
      life: 1,
      color: '#3399ff'
    });
  }

  // burst from every ball currently on screen
  for (const b of balls) {
    const a = Math.atan2(b.y, b.x) || Math.random() * Math.PI * 2;
    const speed = 4 + Math.random() * 8;
    const jitter = (Math.random() - 0.5) * 1.5;
    explosionParticles.push({
      x: b.x,
      y: b.y,
      vx: Math.cos(a + jitter) * speed,
      vy: Math.sin(a + jitter) * speed,
      r: b.r * 0.6,
      life: 1,
      color: b.color
    });
  }

  balls = [];
}

function updateExplosion() {
  explosionTimer++;
  for (const p of explosionParticles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life -= 1 / explosionDuration;
  }
  if (explosionTimer >= explosionDuration) {
    exploding = false;
    angle = 0;
    currentLevel++;
    currentShape = makeShapeForLevel(currentLevel);
    rerollBackgroundPalette();
    if (levelEl) levelEl.textContent = `Level ${currentLevel + 1}: ${currentShape.name}`;
    initBalls();
  }
}

function drawExplosion() {
  const { cx, cy } = getCircleGeometry();
  ctx.save();
  ctx.translate(cx, cy);
  for (const p of explosionParticles) {
    const alpha = Math.max(p.life, 0);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 15;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function animate(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBackground(time * 0.001);

  updateStars();
  drawStars(time * 0.001);

  if (exploding) {
    updateExplosion();
    drawExplosion();
  } else {
    drawCircle();
    drawGapLabel();
    updateBalls();
    drawBalls();
    boundaryFlash *= 0.92;

    if (balls.length >= BALL_CAP) {
      triggerExplosion();
    }

    angle += rotationSpeed; // clockwise rotation
    if (angle > Math.PI * 2) angle -= Math.PI * 2;
    else if (angle < -Math.PI * 2) angle += Math.PI * 2;
    frameCount++;
  }

  updateScreenShake();

  if (ballCountEl) {
    ballCountEl.textContent = exploding ? 'Balls: 0' : `Balls: ${balls.length}`;
  }

  if (mathPanelEl && frameCount % 4 === 0) {
    updateMathPanel();
  }

  if (running) requestAnimationFrame(animate);
}

const MAX_SHAKE_PX = 22;

function updateScreenShake() {
  let intensity;
  if (exploding) {
    // sharp jolt that decays over the course of the explosion
    const t = explosionTimer / explosionDuration;
    intensity = MAX_SHAKE_PX * 1.8 * (1 - t);
  } else {
    // gradually ramps up as the ball population approaches the cap
    const ratio = Math.min(balls.length / BALL_CAP, 1);
    intensity = MAX_SHAKE_PX * Math.pow(ratio, 1.6);
  }

  if (intensity < 0.15) {
    canvas.style.transform = '';
    return;
  }

  const dx = (Math.random() * 2 - 1) * intensity;
  const dy = (Math.random() * 2 - 1) * intensity;
  canvas.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
}

function updateMathPanel() {
  const { radius: R0 } = getCircleGeometry();
  const val = (s) => `<span class="m-val">${s}</span>`;
  const dim = (s) => `<span class="m-dim">${s}</span>`;

  if (exploding) {
    mathPanelEl.innerHTML =
      `${dim('State:')} ${val('EXPLODING')}  frame ${val(explosionTimer)}/${val(explosionDuration)}  particles=${val(explosionParticles.length)}\n` +
      `${dim('Next:')} level ${val(currentLevel + 2)}, θ→0, ball count→${val(startingBallCount)}`;
    return;
  }

  const throb = Math.sin(frameCount * 0.06);
  const R = R0 * (1 + throb * 0.03);
  const angleDeg = ((angle * 180 / Math.PI) % 360).toFixed(1);
  const gapDeg = (gapSize * 180 / Math.PI).toFixed(2);
  const shapeName = currentShape ? currentShape.name : 'Circle';

  const avgSpeed = balls.length
    ? (balls.reduce((sum, b) => sum + Math.sqrt(b.vx * b.vx + b.vy * b.vy), 0) / balls.length)
    : 0;
  const escapedCount = balls.filter(b => b.escaped).length;

  mathPanelEl.innerHTML =
    `${dim('θ=')}${val(angleDeg + '°')} ${dim('ω=')}${val(rotationSpeed.toFixed(4))} ${dim('R=')}${val(R.toFixed(1) + 'px')} ${dim('Gap=')}${val(gapDeg + '°')} ${dim('[' + shapeName + ']')}\n` +
    `${dim('Balls=')}${val(balls.length + '/' + BALL_CAP)} ${dim('Escaped=')}${val(escapedCount)} ${dim('avg|v|=')}${val(avgSpeed.toFixed(1) + 'px/f')} ${dim('k=')}${val(spawnMultiplier)} ${dim('frame=')}${val(frameCount)}`;
}

// --- Launch screen wiring ---
const launchScreen = document.getElementById('launch-screen');
const launchButton = document.getElementById('launch-button');
const backButton = document.getElementById('back-button');
const muteButton = document.getElementById('mute-button');
const optBallCap = document.getElementById('opt-ball-cap');
const optStartingBalls = document.getElementById('opt-starting-balls');
const optRotationSpeed = document.getElementById('opt-rotation-speed');
const optRotationSpeedValue = document.getElementById('opt-rotation-speed-value');
const optBallSpeed = document.getElementById('opt-ball-speed');
const optBallSpeedValue = document.getElementById('opt-ball-speed-value');
const optBallSize = document.getElementById('opt-ball-size');
const optBallSizeValue = document.getElementById('opt-ball-size-value');
const optGapSize = document.getElementById('opt-gap-size');
const optGapSizeValue = document.getElementById('opt-gap-size-value');
const optSpawnMultiplier = document.getElementById('opt-spawn-multiplier');

const BASE_ROTATION_SPEED = 0.012;
let running = false;

function refreshRangeLabels() {
  if (optRotationSpeedValue) optRotationSpeedValue.textContent = parseFloat(optRotationSpeed.value).toFixed(2) + 'x';
  if (optBallSpeedValue) optBallSpeedValue.textContent = parseFloat(optBallSpeed.value).toFixed(2) + 'x';
  if (optBallSizeValue) optBallSizeValue.textContent = parseFloat(optBallSize.value).toFixed(2) + 'x';
  if (optGapSizeValue) optGapSizeValue.textContent = parseFloat(optGapSize.value).toFixed(1) + '°';
}
if (optRotationSpeed) optRotationSpeed.addEventListener('input', refreshRangeLabels);
if (optBallSpeed) optBallSpeed.addEventListener('input', refreshRangeLabels);
if (optBallSize) optBallSize.addEventListener('input', refreshRangeLabels);
if (optGapSize) optGapSize.addEventListener('input', refreshRangeLabels);
refreshRangeLabels();

function launchGame() {
  const cap = parseInt(optBallCap.value, 10);
  BALL_CAP = (!isNaN(cap) && cap > 0) ? cap : 1000;

  const startCount = parseInt(optStartingBalls.value, 10);
  startingBallCount = (!isNaN(startCount) && startCount > 0) ? startCount : 5;
  if (startingBallCount > BALL_CAP) startingBallCount = BALL_CAP;

  const rotationMultiplier = parseFloat(optRotationSpeed.value);
  rotationSpeed = BASE_ROTATION_SPEED * (isNaN(rotationMultiplier) ? 1 : rotationMultiplier);

  const speedMultiplier = parseFloat(optBallSpeed.value);
  ballSpeedMultiplier = isNaN(speedMultiplier) ? 1 : speedMultiplier;

  const sizeMultiplier = parseFloat(optBallSize.value);
  ballSizeMultiplier = isNaN(sizeMultiplier) ? 1 : sizeMultiplier;

  const gapDeg = parseFloat(optGapSize.value);
  gapSize = (!isNaN(gapDeg) && gapDeg > 0) ? (gapDeg * Math.PI / 180) : (Math.PI / 16);

  const spawnMult = parseInt(optSpawnMultiplier.value, 10);
  spawnMultiplier = (!isNaN(spawnMult) && spawnMult >= 0) ? spawnMult : 2;

  // reset simulation state fresh with the chosen settings
  currentLevel = 0;
  currentShape = makeShapeForLevel(currentLevel);
  rerollBackgroundPalette();
  angle = 0;
  frameCount = 0;
  boundaryFlash = 0;
  exploding = false;
  explosionParticles = [];
  initBalls();
  if (levelEl) levelEl.textContent = `Level 1: ${currentShape.name}`;

  if (launchScreen) launchScreen.classList.add('hidden');
  if (backButton) backButton.classList.add('visible');
  if (muteButton) muteButton.classList.add('visible');
  if (mathPanelEl) mathPanelEl.classList.add('visible');

  running = true;
  requestAnimationFrame(animate);
}

function returnToMenu() {
  running = false;
  canvas.style.transform = '';
  if (launchScreen) launchScreen.classList.remove('hidden');
  if (backButton) backButton.classList.remove('visible');
  if (muteButton) muteButton.classList.remove('visible');
  if (mathPanelEl) mathPanelEl.classList.remove('visible');
}

function toggleMute() {
  setMuted(!isMuted);
  if (muteButton) {
    muteButton.textContent = isMuted ? '\u{1F507} Muted' : '\u{1F50A} Mute';
    muteButton.classList.toggle('muted', isMuted);
  }
}

if (launchButton) launchButton.addEventListener('click', launchGame);
if (backButton) backButton.addEventListener('click', returnToMenu);
if (muteButton) muteButton.addEventListener('click', toggleMute);
</script>
</body>
</html>
