<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISSILE COMMAND</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --green: #39ff14;
    --cyan: #00f5ff;
    --yellow: #ffe600;
    --pink: #ff00c8;
    --orange: #ff6600;
    --red: #ff2200;
    --bg: #000008;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    height: 100vh;
    font-family: 'Press Start 2P', cursive;
    overflow: hidden;
    cursor: crosshair;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 6px 16px;
    color: var(--yellow);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-shadow: 0 0 8px var(--yellow);
    flex-shrink: 0;
  }

  #hud span { min-width: 120px; }
  #hud span:nth-child(2) { text-align: center; }
  #hud span:last-child { text-align: right; }

  #wrap {
    position: relative;
    flex: 1;
    width: 100%;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--bg);
  }

  /* scanlines over canvas */
  #wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,8,0.85);
    z-index: 20;
    gap: 18px;
  }

  #overlay h1 {
    font-size: 2.4rem;
    color: var(--pink);
    text-shadow: 3px 3px 0 var(--cyan), 0 0 30px var(--pink);
    letter-spacing: 0.15em;
    animation: flicker 1.4s infinite alternate;
  }

  #overlay .sub {
    color: var(--cyan);
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-shadow: 0 0 10px var(--cyan);
  }

  #overlay .instructions {
    color: #888;
    font-size: 0.45rem;
    line-height: 2;
    text-align: center;
    letter-spacing: 0.08em;
  }

  #overlay button {
    font-family: 'Press Start 2P', cursive;
    font-size: 0.75rem;
    padding: 14px 36px;
    background: transparent;
    color: var(--green);
    border: 3px solid var(--green);
    cursor: pointer;
    text-shadow: 0 0 10px var(--green);
    box-shadow: 0 0 20px rgba(57,255,20,0.4);
    letter-spacing: 0.15em;
    transition: all 0.15s;
    margin-top: 8px;
  }

  #overlay button:hover {
    background: var(--green);
    color: #000;
    box-shadow: 0 0 40px var(--green);
    transform: scale(1.05);
  }

  @keyframes flicker {
    0%   { opacity: 1; }
    92%  { opacity: 1; }
    93%  { opacity: 0.8; }
    95%  { opacity: 1; }
    98%  { opacity: 0.9; }
    100% { opacity: 1; }
  }

  #gameover-score {
    color: var(--yellow);
    font-size: 0.65rem;
    text-shadow: 0 0 10px var(--yellow);
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<div id="hud">
  <span>SCORE: <span id="scoreEl">000000</span></span>
  <span id="waveEl">WAVE 1</span>
  <span>CITIES: <span id="citiesEl">██████</span></span>
</div>

<div id="wrap">
  <canvas id="c" width="800" height="540"></canvas>

  <div id="overlay">
    <h1>MISSILE COMMAND</h1>
    <p class="sub">DEFEND YOUR CITIES</p>
    <div class="instructions">
      CLICK TO FIRE INTERCEPTORS<br>
      PROTECT YOUR 6 CITIES FROM ATTACK<br>
      3 MISSILE BATTERIES — USE THEM WISELY
    </div>
    <button id="startBtn">INSERT COIN</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize(){
  const wrap = document.getElementById('wrap');
  W = canvas.width  = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
  GROUND_Y_val = H - 60;
  // Reposition batteries and cities proportionally
  batteries[0].x = W*0.1;
  batteries[1].x = W*0.5;
  batteries[2].x = W*0.9;
  cityPositions = [W*0.18, W*0.27, W*0.37, W*0.63, W*0.73, W*0.82];
  buildStars();
}

const bgImgs = BG_SRCS.map(src=>{ const i=new Image(); i.src=src; return i; });
function getBgIdx(w) { return (w-1) % bgImgs.length; }

// Use a getter so GROUND_Y is always current
let GROUND_Y_val = 480;
Object.defineProperty(window, 'GROUND_Y', { get: ()=>GROUND_Y_val });

// ── PALETTE ──────────────────────────────────────────
const C = {
  sky:    '#000008',
  ground: '#1a4a1a',
  city:   '#39ff14',
  silo:   '#00f5ff',
  missile:'#ff4400',
  trail:  'rgba(255,68,0,0.5)',
  inter:  '#ffffff',
  explode:['#ff2200','#ff6600','#ffe600','#ffffff','#ff00c8'],
  star:   '#c8e6ff',
  text:   '#39ff14',
};

// ── STATE ─────────────────────────────────────────────
let score=0, wave=1, cities=6, running=false;
let missiles=[], interceptors=[], explosions=[], stars=[], particles=[];
let batteries=[{x:80,ammo:10},{x:400,ammo:10},{x:720,ammo:10}];
let cityPositions=[130,210,290,510,590,670];
let citiesAlive=[true,true,true,true,true,true];
let betweenWaves=false, waveBonus=false;
let bonusTimer=0;
let missileKills=0;       // total kills this game
let killBank=0;           // tracks fractional ammo earned (earn 1 ammo per 2 kills)
let missilesSpawned=0;    // how many enemy missiles launched this wave
const WAVE_MISSILES=30;   // fixed missiles per wave

// Fanfare state
let fanfareActive=false, fanfareTimer=0, fanfareParticles=[];
const FAN_COLS=['#39ff14','#00f5ff','#ffe600','#ff00c8','#ff6600','#ffffff'];

// ── STARS ────────────────────────────────────────────
function buildStars(){
  stars=[];
  for(let i=0;i<120;i++) stars.push({
    x:Math.random()*W, y:Math.random()*(GROUND_Y-60),
    r:Math.random()*1.2+0.2, a:0.1+Math.random()*0.5
  });
}
buildStars();

// ── WAVE CONFIG ───────────────────────────────────────
function waveConfig(){
  return {
    count: WAVE_MISSILES,
    speed: 1.2 + wave*0.35,           // much faster base, steeper per-wave ramp
    interval: Math.max(14, 75 - wave*6), // spawns get tighter each wave
  };
}

let cfg, missileTimer=0;

// ── SPAWN ENEMY MISSILE ───────────────────────────────
function spawnMissile(){
  if(missilesSpawned>=WAVE_MISSILES) return;
  const alive = cityPositions.filter((_,i)=>citiesAlive[i]);
  const batTargets = batteries.map(b=>b.x);
  const allTargets = [...alive, ...batTargets];
  if(allTargets.length===0) return;
  const tx = allTargets[Math.floor(Math.random()*allTargets.length)] + (Math.random()-0.5)*30;
  const sx = Math.random()*W;
  missiles.push({
    x:sx, y:0, tx, ty:GROUND_Y,
    vx:0, vy:0,
    trail:[],
    alive:true,
    speed: cfg.speed*(0.85+Math.random()*0.3),
  });
  missilesSpawned++;
  const m=missiles[missiles.length-1];
  const dx=m.tx-m.x, dy=m.ty-m.y;
  const len=Math.sqrt(dx*dx+dy*dy);
  m.vx=dx/len*m.speed; m.vy=dy/len*m.speed;
}

// ── FIRE INTERCEPTOR ──────────────────────────────────
function fireInterceptor(mx,my){
  // find closest battery with ammo
  let best=null, bd=Infinity;
  batteries.forEach(b=>{
    if(b.ammo<=0) return;
    const d=Math.abs(b.x-mx);
    if(d<bd){ bd=d; best=b; }
  });
  if(!best) return;
  best.ammo--;
  const speed=6;
  const dx=mx-best.x, dy=my-GROUND_Y;
  const len=Math.sqrt(dx*dx+dy*dy);
  sndFire();
  interceptors.push({
    x:best.x, y:GROUND_Y,
    tx:mx, ty:my,
    vx:dx/len*speed, vy:dy/len*speed,
    alive:true, trail:[]
  });
}

// ── EXPLOSION ─────────────────────────────────────────
function boom(x,y,r,col,friendly){
  explosions.push({x,y,r,maxR:r,life:160,max:160,col,friendly,growing:true});
}

// ── PARTICLES ────────────────────────────────────────
function spawnParticles(x,y,col){
  for(let i=0;i<22;i++){
    const ang=Math.random()*Math.PI*2;
    const spd=1.5+Math.random()*5;
    particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
      life:55,max:55,col,sz:2+Math.random()*3.5});
  }
}

// ── AUDIO ─────────────────────────────────────────────
let AC = null;
function ensureAC(){
  if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
}

function sndFire(){
  ensureAC(); if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type='sawtooth';
  o.frequency.setValueAtTime(880, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(110, AC.currentTime+0.18);
  g.gain.setValueAtTime(0.18, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+0.18);
  o.start(AC.currentTime); o.stop(AC.currentTime+0.2);
}

function sndExplosion(big){
  ensureAC(); if(!AC) return;
  // White noise burst
  const bufSz = AC.sampleRate * (big ? 0.7 : 0.35);
  const buf = AC.createBuffer(1, bufSz, AC.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSz;i++) data[i]=(Math.random()*2-1)*(1-i/bufSz);
  const src = AC.createBufferSource();
  src.buffer = buf;
  const g = AC.createGain();
  const lp = AC.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value = big ? 600 : 900;
  src.connect(lp); lp.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(big ? 0.7 : 0.45, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+(big?0.65:0.32));
  src.start(AC.currentTime); src.stop(AC.currentTime+(big?0.7:0.36));
  // Low thump
  const o=AC.createOscillator(), og=AC.createGain();
  o.connect(og); og.connect(AC.destination);
  o.type='sine';
  o.frequency.setValueAtTime(big?140:90, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(20, AC.currentTime+(big?0.5:0.3));
  og.gain.setValueAtTime(big?0.6:0.4, AC.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+(big?0.5:0.3));
  o.start(AC.currentTime); o.stop(AC.currentTime+(big?0.55:0.35));
}

function sndImpact(){
  ensureAC(); if(!AC) return;
  // Enemy hits ground — lower, dirtier
  const bufSz = AC.sampleRate*0.4;
  const buf = AC.createBuffer(1,bufSz,AC.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSz;i++) data[i]=(Math.random()*2-1)*(1-i/bufSz)*0.8;
  const src=AC.createBufferSource(); src.buffer=buf;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=300;
  const g=AC.createGain();
  src.connect(lp); lp.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(0.5,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.38);
  src.start(AC.currentTime); src.stop(AC.currentTime+0.42);
}

// ── BACKGROUND MUSIC ──────────────────────────────────
let musicPlaying=false, musicNodes=[], musicGain=null;

// Minor-key arpeggio: Am-pentatonic feel, tense and atmospheric
const MUSIC_NOTES = [
  220, 261.6, 293.7, 329.6, 392, 440,   // A3-A4 minor pentatonic
  261.6, 349.2, 392, 440, 523.2, 440,   // variation
  220, 261.6, 329.6, 392, 349.2, 293.7, // descending dread
  261.6, 220, 246.9, 220, 196, 220       // low pulse ending
];
const MUSIC_DURS  = [0.18,0.18,0.18,0.18,0.18,0.36, 0.18,0.18,0.18,0.18,0.18,0.36,
                     0.18,0.18,0.18,0.18,0.18,0.36, 0.18,0.18,0.18,0.18,0.18,0.72];

function startMusic(){
  ensureAC(); if(!AC || musicPlaying) return;
  musicPlaying=true;
  musicGain=AC.createGain();
  // Subtle reverb-like delay
  const delay=AC.createDelay(0.5); delay.delayTime.value=0.22;
  const dGain=AC.createGain(); dGain.gain.value=0.18;
  musicGain.connect(delay); delay.connect(dGain); dGain.connect(AC.destination);
  musicGain.connect(AC.destination);
  musicGain.gain.value=0.0;
  // Fade in
  musicGain.gain.linearRampToValueAtTime(0.13, AC.currentTime+2.0);
  scheduleMusic(AC.currentTime+0.1);
}

function scheduleMusic(startAt){
  if(!musicPlaying || !AC) return;
  const totalDur=MUSIC_DURS.reduce((a,b)=>a+b,0);
  let t=startAt;
  MUSIC_NOTES.forEach((freq,i)=>{
    const dur=MUSIC_DURS[i];
    const o=AC.createOscillator(), g=AC.createGain();
    // Alternate between square (lead) and triangle (bass sub)
    o.type = i%6===5 ? 'square' : (freq<280 ? 'triangle' : 'sine');
    o.frequency.value=freq;
    // Slight detune for thickness
    o.detune.value=(Math.random()-0.5)*8;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(i%6===5?0.7:0.5, t+0.02);
    g.gain.setValueAtTime(i%6===5?0.7:0.5, t+dur*0.6);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur*0.95);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t+dur);
    musicNodes.push(o);
    t+=dur;
  });
  // Loop
  const loopId=setTimeout(()=>{ if(musicPlaying) scheduleMusic(startAt+totalDur); },
    (startAt+totalDur-AC.currentTime-0.5)*1000);
  musicNodes.push({stop:()=>clearTimeout(loopId)});
}

function stopMusic(){
  musicPlaying=false;
  if(musicGain){
    musicGain.gain.linearRampToValueAtTime(0, AC.currentTime+0.5);
  }
  musicNodes.forEach(n=>{ try{ n.stop(); }catch(e){} });
  musicNodes=[];
}

function setMusicTempo(waveNum){
  // Subtly pitch the music up with each wave for tension
  if(!musicGain) return;
  // done via global detune on oscillators indirectly; mainly affect gain presence
  const urgency=Math.min(1, (waveNum-1)*0.08);
  if(musicGain) musicGain.gain.value=0.13+urgency*0.08;
}


function update(){
  if(!running) return;

  // During fanfare, only update fanfare particles
  if(fanfareActive){
    fanfareTimer--;
    fanfareParticles.forEach(p=>{
      p.trail.push({x:p.x,y:p.y}); if(p.trail.length>6) p.trail.shift();
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.vx*=0.99; p.life--;
    });
    fanfareParticles=fanfareParticles.filter(p=>p.life>0);
    if(fanfareTimer<=0){
      fanfareActive=false;
      betweenWaves=false;
      waveBonus=false;
      wave++;
      missiles=[]; interceptors=[]; fanfareParticles=[];
      missilesSpawned=0;
      batteries.forEach(b=>{ b.ammo=10; });
      cfg=waveConfig();
      missileTimer=0;
      setMusicTempo(wave);
      updateHUD();
    }
    return;
  }

  // Wave spawning
  if(!betweenWaves){
    missileTimer++;
    if(missileTimer>=cfg.interval && missiles.filter(m=>m.alive).length<cfg.count){
      spawnMissile();
      missileTimer=0;
    }
  }

  // Move missiles
  missiles.forEach(m=>{
    if(!m.alive) return;
    m.trail.push({x:m.x,y:m.y});
    if(m.trail.length>80) m.trail.shift();
    m.x+=m.vx; m.y+=m.vy;

    // Hit ground
    if(m.y>=GROUND_Y){
      m.alive=false;
      sndImpact();
      boom(m.x,GROUND_Y,120,'rgba(255,100,0,0.9)',false);
      spawnParticles(m.x,GROUND_Y,C.missile);
      // Check city hits
      cityPositions.forEach((cx,i)=>{
        if(!citiesAlive[i]) return;
        if(Math.abs(m.x-cx)<22){ citiesAlive[i]=false; cities--; updateHUD(); }
      });
      // Battery hits
      batteries.forEach(b=>{
        if(Math.abs(m.x-b.x)<18){ b.ammo=0; }
      });
    }

    // Check explosion collisions
    explosions.forEach(e=>{
      if(!e.friendly) return;
      const dx=m.x-e.x, dy=m.y-e.y;
      if(dx*dx+dy*dy < e.r*e.r){
        m.alive=false;
        score+=25*wave; updateHUD();
        spawnParticles(m.x,m.y,'#ffe600');
        // Award 1 ammo per 2 kills
        missileKills++;
        killBank++;
        if(killBank>=2){
          killBank-=2;
          // Add ammo to battery with least ammo
          const b=batteries.reduce((a,b)=>b.ammo<a.ammo?b:a);
          b.ammo++;
        }
      }
    });
  });

  // Move interceptors
  interceptors.forEach(p=>{
    if(!p.alive) return;
    p.trail.push({x:p.x,y:p.y});
    if(p.trail.length>120) p.trail.shift();
    p.x+=p.vx; p.y+=p.vy;
    const dx=p.x-p.tx, dy=p.y-p.ty;
    if(dx*dx+dy*dy<36){
      p.alive=false;
      sndExplosion(true);
      boom(p.tx,p.ty,160,'rgba(255,255,255,0.95)',true);
    }
  });

  // Update explosions
  explosions.forEach(e=>{
    e.life--;
    if(e.growing){
      e.r+=1.4;
      if(e.r>=e.maxR) e.growing=false;
    } else {
      e.r=e.maxR*(e.life/e.max)*1.05;
    }
  });
  explosions=explosions.filter(e=>e.life>0 && e.r>0);

  // Update particles
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life--; });
  particles=particles.filter(p=>p.life>0);

  // Clean up dead missiles
  missiles=missiles.filter(m=>m.alive || m.trail.length>0);
  missiles.forEach(m=>{ if(!m.alive && m.trail.length) m.trail.shift(); });

  // Check wave end — all 30 spawned AND none active AND nothing in flight
  if(!betweenWaves && !fanfareActive){
    const active=missiles.filter(m=>m.alive).length;
    if(missilesSpawned>=WAVE_MISSILES && active===0 && interceptors.filter(i=>i.alive).length===0){
      betweenWaves=true;
      waveBonus=true;
      // Score bonuses
      batteries.forEach(b=>{ score+=b.ammo*100; });
      score+=cities*500;
      updateHUD();
      startFanfare();
    }
  }

  // Game over check
  const aliveCities=citiesAlive.filter(Boolean).length;
  if(aliveCities===0){
    running=false;
    showGameOver();
  }
}

// ── FANFARE ───────────────────────────────────────────
function startFanfare(){
  fanfareActive=true; fanfareTimer=220; fanfareParticles=[];
  // Big burst from center
  for(let i=0;i<180;i++){
    const ang=Math.random()*Math.PI*2, spd=3+Math.random()*12;
    fanfareParticles.push({
      x:W/2, y:H/2,
      vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
      life:fanfareTimer, max:fanfareTimer,
      col:FAN_COLS[Math.floor(Math.random()*FAN_COLS.length)],
      sz:2+Math.random()*5, trail:[]
    });
  }
  // Staggered side bursts
  for(let burst=0;burst<5;burst++){
    setTimeout(()=>{
      for(let i=0;i<50;i++){
        const ang=Math.random()*Math.PI*2, spd=2+Math.random()*9;
        fanfareParticles.push({
          x:W*(0.1+Math.random()*0.8), y:H*(0.2+Math.random()*0.5),
          vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-2,
          life:160, max:160,
          col:FAN_COLS[Math.floor(Math.random()*FAN_COLS.length)],
          sz:1.5+Math.random()*4, trail:[]
        });
      }
    }, burst*300);
  }
}

function drawFanfare(){
  const phase=220-fanfareTimer;
  const textAlpha=Math.min(1,phase/25)*Math.min(1,fanfareTimer/40);
  // dark overlay
  ctx.save(); ctx.globalAlpha=0.55; ctx.fillStyle='#000008'; ctx.fillRect(0,0,W,H); ctx.restore();
  // fanfare particles
  fanfareParticles.forEach(p=>{
    const a=p.life/p.max;
    if(p.trail.length>1){
      ctx.save(); ctx.strokeStyle=p.col; ctx.lineWidth=p.sz*0.4;
      for(let ti=1;ti<p.trail.length;ti++){
        ctx.globalAlpha=a*(ti/p.trail.length)*0.35;
        ctx.beginPath(); ctx.moveTo(p.trail[ti-1].x,p.trail[ti-1].y); ctx.lineTo(p.trail[ti].x,p.trail[ti].y); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save(); ctx.globalAlpha=a;
    ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
  // text
  if(textAlpha>0){
    const sc=0.6+Math.min(1,phase/20)*0.4;
    ctx.save();
    ctx.globalAlpha=textAlpha;
    ctx.translate(W/2,H*0.35); ctx.scale(sc,sc);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold 68px "Press Start 2P",cursive';
    ctx.fillStyle='#39ff14'; ctx.shadowColor='#39ff14'; ctx.shadowBlur=30;
    ctx.fillText('WAVE CLEAR!',0,0);
    ctx.font='28px "Press Start 2P",cursive';
    ctx.fillStyle='#ffe600'; ctx.shadowColor='#ffe600'; ctx.shadowBlur=18;
    ctx.fillText(`WAVE ${wave} COMPLETE`,0,70);
    ctx.font='16px "Press Start 2P",cursive';
    ctx.fillStyle='#00f5ff'; ctx.shadowColor='#00f5ff'; ctx.shadowBlur=12;
    ctx.fillText(`CITIES BONUS: ${cities*500}   AMMO BONUS: ${batteries.reduce((s,b)=>s+b.ammo,0)*100}`,0,115);
    ctx.restore();
  }
}

// ── DRAW ─────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);

  // Background image (cycles by wave)
  const bgIdx = getBgIdx(wave);
  const bg = bgImgs[bgIdx];
  ctx.fillStyle='#000010'; ctx.fillRect(0,0,W,H);
  if(bg.complete && bg.naturalWidth>0){
    const bw=bg.naturalWidth, bh=bg.naturalHeight;
    const sc=Math.max(W/bw, GROUND_Y/bh);
    const dw=bw*sc, dh=bh*sc;
    const dx=(W-dw)/2, dy=(GROUND_Y-dh);
    ctx.save(); ctx.globalAlpha=0.75;
    ctx.drawImage(bg,dx,dy,dw,dh);
    ctx.globalAlpha=1; ctx.restore();
  } else {
    // fallback gradient
    const sky=ctx.createLinearGradient(0,0,0,GROUND_Y);
    sky.addColorStop(0,'#000008'); sky.addColorStop(1,'#000d1a');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,GROUND_Y);
  }
  // dim overlay so missiles/cities stay readable
  ctx.fillStyle='rgba(0,0,10,0.35)'; ctx.fillRect(0,0,W,GROUND_Y);

  // Ground
  ctx.fillStyle='#0a2a0a'; ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  ctx.fillStyle='#1a5a1a'; ctx.fillRect(0,GROUND_Y,W,4);

  // Draw enemy missiles — shaped missile body + thick glowing trail
  missiles.forEach(m=>{
    const pts=[...m.trail];
    if(m.alive) pts.push({x:m.x,y:m.y});
    // Trail
    if(pts.length>=2){
      ctx.save();
      for(let i=1;i<pts.length;i++){
        const t=i/pts.length;
        const alpha=t*0.75;
        const lw=1.5+t*4;
        ctx.globalAlpha=alpha;
        // hot core: white → orange → red fade along trail
        const r=255, g=Math.floor(80+t*120), b=0;
        ctx.strokeStyle=`rgb(${r},${g},${b})`;
        ctx.shadowColor='#ff4400';
        ctx.shadowBlur=6+t*12;
        ctx.lineWidth=lw;
        ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(pts[i-1].x,pts[i-1].y);
        ctx.lineTo(pts[i].x,pts[i].y);
        ctx.stroke();
      }
      ctx.restore();
    }
    // Missile body
    if(m.alive){
      const angle=Math.atan2(m.vy,m.vx);
      ctx.save();
      ctx.translate(m.x,m.y);
      ctx.rotate(angle);
      // Glow halo
      ctx.shadowColor='#ff3300'; ctx.shadowBlur=18;
      // Body
      ctx.fillStyle='#dddddd';
      ctx.beginPath();
      ctx.ellipse(0,0,10,4,0,0,Math.PI*2);
      ctx.fill();
      // Nose cone (pointed tip in direction of travel)
      ctx.fillStyle='#ff2200';
      ctx.beginPath();
      ctx.moveTo(10,0);
      ctx.lineTo(4,-4);
      ctx.lineTo(4,4);
      ctx.closePath();
      ctx.fill();
      // Tail fins
      ctx.fillStyle='#aaaacc';
      ctx.beginPath();
      ctx.moveTo(-8,0); ctx.lineTo(-14,-7); ctx.lineTo(-10,0); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-8,0); ctx.lineTo(-14,7);  ctx.lineTo(-10,0); ctx.closePath(); ctx.fill();
      // Exhaust flame
      const flamelen=8+Math.random()*6;
      const fg=ctx.createLinearGradient(-10,0,-10-flamelen,0);
      fg.addColorStop(0,'rgba(255,200,50,0.95)');
      fg.addColorStop(0.5,'rgba(255,80,0,0.7)');
      fg.addColorStop(1,'rgba(255,0,0,0)');
      ctx.fillStyle=fg;
      ctx.beginPath();
      ctx.ellipse(-10-flamelen/2,0,flamelen/2,3+Math.random()*2,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  });

  // Draw interceptor trails — colorful segmented rainbow
  interceptors.forEach(p=>{
    if(!p.alive && p.trail.length===0) return;
    const pts=[...p.trail];
    if(p.alive) pts.push({x:p.x,y:p.y});
    if(pts.length<2){ ctx.restore&&ctx.restore(); return; }
    const RAINBOW=['#ff00c8','#ff6600','#ffe600','#39ff14','#00f5ff','#aa88ff'];
    ctx.save();
    for(let i=1;i<pts.length;i++){
      const t=i/pts.length;
      const ci=Math.floor(t*RAINBOW.length)%RAINBOW.length;
      const col=RAINBOW[ci];
      const alpha=t*0.92;
      const lw=1.2+t*3.5;
      ctx.globalAlpha=alpha;
      ctx.strokeStyle=col;
      ctx.shadowColor=col;
      ctx.shadowBlur=8+t*14;
      ctx.lineWidth=lw;
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(pts[i-1].x,pts[i-1].y);
      ctx.lineTo(pts[i].x,pts[i].y);
      ctx.stroke();
    }
    ctx.restore();
    // Bright head
    if(p.alive){
      ctx.save();
      ctx.shadowColor='#ffffff'; ctx.shadowBlur=22;
      // outer glow
      const hg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,8);
      hg.addColorStop(0,'rgba(255,255,255,1)');
      hg.addColorStop(0.4,'rgba(180,220,255,0.8)');
      hg.addColorStop(1,'rgba(100,180,255,0)');
      ctx.fillStyle=hg;
      ctx.beginPath(); ctx.arc(p.x,p.y,8,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  });

  // Draw explosions
  explosions.forEach(e=>{
    const a=e.life/e.max;
    ctx.save();
    ctx.globalAlpha=a*0.85;
    const grad=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r);
    if(e.friendly){
      grad.addColorStop(0,'rgba(255,255,255,1)');
      grad.addColorStop(0.3,'rgba(255,220,100,0.9)');
      grad.addColorStop(0.7,'rgba(255,80,0,0.5)');
      grad.addColorStop(1,'rgba(255,0,0,0)');
    } else {
      grad.addColorStop(0,'rgba(255,180,0,1)');
      grad.addColorStop(0.4,'rgba(255,60,0,0.8)');
      grad.addColorStop(1,'rgba(255,0,0,0)');
    }
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // Draw particles
  particles.forEach(p=>{
    const a=p.life/p.max;
    ctx.save(); ctx.globalAlpha=a;
    ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // Draw batteries
  batteries.forEach(b=>{
    const x=b.x, y=GROUND_Y;
    const hasAmmo=b.ammo>0;
    ctx.save();
    ctx.fillStyle=hasAmmo?C.silo:'#333';
    ctx.shadowColor=hasAmmo?C.silo:'transparent';
    ctx.shadowBlur=hasAmmo?12:0;
    // base
    ctx.fillRect(x-14,y-18,28,18);
    // barrel
    ctx.fillRect(x-4,y-28,8,12);
    // ammo dots
    ctx.fillStyle='#000';
    for(let i=0;i<10;i++){
      const px=x-12+i*2.6;
      ctx.fillStyle=i<b.ammo?C.silo:'#1a2a2a';
      ctx.fillRect(px,y-8,2,4);
    }
    ctx.restore();
  });

  // Draw cities
  cityPositions.forEach((cx,i)=>{
    if(!citiesAlive[i]) return;
    ctx.save();
    ctx.fillStyle=C.city;
    ctx.shadowColor=C.city; ctx.shadowBlur=10;
    // building silhouette
    const bldgs=[[cx-16,12],[cx-8,20],[cx,14],[cx+8,20],[cx+16,12]];
    bldgs.forEach(([bx,bh])=>{
      ctx.fillRect(bx-5,GROUND_Y-bh,10,bh);
    });
    ctx.restore();
  });

  // Fanfare overlay
  if(fanfareActive) drawFanfare();

  // Clean dead interceptors
  interceptors=interceptors.filter(p=>p.alive||p.trail.length>0);
  interceptors.forEach(p=>{ if(!p.alive&&p.trail.length) p.trail.shift(); });
}

// ── LOOP ─────────────────────────────────────────────
function loop(){ update(); draw(); requestAnimationFrame(loop); }

// ── HUD ───────────────────────────────────────────────
function updateHUD(){
  document.getElementById('scoreEl').textContent=score.toString().padStart(6,'0');
  document.getElementById('waveEl').textContent=`WAVE ${wave}  ${missilesSpawned}/${WAVE_MISSILES}`;
  const alive=citiesAlive.map(a=>a?'█':'░').join('');
  document.getElementById('citiesEl').textContent=alive;
}

// ── OVERLAY ───────────────────────────────────────────
function showGameOver(){
  stopMusic();
  const ov=document.getElementById('overlay');
  ov.innerHTML=`
    <h1 style="font-size:1.6rem">GAME OVER</h1>
    <p id="gameover-score" style="color:#ffe600;font-size:0.65rem;text-shadow:0 0 10px #ffe600;letter-spacing:0.1em">FINAL SCORE: ${score.toString().padStart(6,'0')}</p>
    <p class="sub">WAVE ${wave} REACHED</p>
    <button id="startBtn" style="font-family:'Press Start 2P',cursive;font-size:0.75rem;padding:14px 36px;background:transparent;color:#39ff14;border:3px solid #39ff14;cursor:pointer;text-shadow:0 0 10px #39ff14;box-shadow:0 0 20px rgba(57,255,20,0.4);letter-spacing:0.15em;margin-top:8px;">PLAY AGAIN</button>
  `;
  ov.style.display='flex';
  document.getElementById('startBtn').addEventListener('click', startGame);
}

function startGame(){
  stopMusic();
  score=0; wave=1; cities=6;
  citiesAlive=[true,true,true,true,true,true];
  missiles=[]; interceptors=[]; explosions=[]; particles=[]; fanfareParticles=[];
  batteries=[{x:W*0.1,ammo:10},{x:W*0.5,ammo:10},{x:W*0.9,ammo:10}];
  cityPositions=[W*0.18,W*0.27,W*0.37,W*0.63,W*0.73,W*0.82];
  missileKills=0; killBank=0; missilesSpawned=0;
  fanfareActive=false; fanfareTimer=0;
  betweenWaves=false; waveBonus=false;
  cfg=waveConfig(); missileTimer=0;
  running=true;
  updateHUD();
  document.getElementById('overlay').style.display='none';
  startMusic();
}

// ── INPUT ─────────────────────────────────────────────
canvas.addEventListener('click', e=>{
  ensureAC();
  if(!running) return;
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width, scaleY=H/rect.height;
  const mx=(e.clientX-rect.left)*scaleX;
  const my=(e.clientY-rect.top)*scaleY;
  fireInterceptor(mx,my);
});

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  ensureAC();
  if(!running) return;
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width, scaleY=H/rect.height;
  const t=e.touches[0];
  fireInterceptor((t.clientX-rect.left)*scaleX,(t.clientY-rect.top)*scaleY);
},{passive:false});

// ── START ─────────────────────────────────────────────
document.getElementById('startBtn').addEventListener('click', startGame);
window.addEventListener('resize', ()=>{ resize(); buildStars(); });
resize();
loop();
</script>
</body>
</html>
