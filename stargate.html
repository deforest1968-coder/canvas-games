<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STARGATE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #c { display: block; width: 100%; height: 100%; }
  #msg {
    position: absolute; bottom: 50px; left: 0; right: 0;
    color: #ff0; font-size: clamp(16px, 2.5vw, 26px);
    letter-spacing: 5px; text-align: center;
    text-shadow: 0 0 18px #ff0, 0 0 40px #ff08;
    pointer-events: none;
    font-family: 'Courier New', monospace;
    font-weight: bold;
  }
  #controls {
    position: absolute; bottom: 4px; left: 0; right: 0;
    color: #444; font-size: 10px; letter-spacing: 1px;
    text-align: center; pointer-events: none;
  }
  #pad-indicator {
    position: absolute; top: 78px; right: 12px;
    color: #0f08; font-size: 10px; letter-spacing: 1px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="pad-indicator"></div>
  <div id="msg"></div>
  <div id="controls">ARROWS/WASD · SPACE=fire · Z=bomb · X=hyper &nbsp;|&nbsp; GAMEPAD: stick/dpad · A=fire · B=bomb · Y=hyper · START=start</div>
</div>

<script>
// ─── Canvas / resize ────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, GH = 0, GROUND_Y = 0;
const WORLD = 4000;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  GH = H;
  GROUND_Y = GH - Math.round(GH * 0.1);
  if (stargate) { stargate.h = Math.round(GH * 0.16); stargate.y = GH * 0.25; }
}
window.addEventListener('resize', resize);

const msgEl   = document.getElementById('msg');
const padEl   = document.getElementById('pad-indicator');


// ─── Gamepad ────────────────────────────────────────────────────────────────
const gp = {
  connected: false,
  left: false, right: false, up: false, down: false,
  fire: false,
  prevBomb: false, prevHyper: false, prevStart: false,
  firedBomb: false, firedHyper: false, firedStart: false,
};

window.addEventListener('gamepadconnected', e => {
  gp.connected = true;
  padEl.textContent = '🎮 ' + e.gamepad.id.slice(0, 24);
});
window.addEventListener('gamepaddisconnected', () => {
  gp.connected = false; padEl.textContent = '';
});

function pollGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let pad = null;
  for (const p of pads) { if (p) { pad = p; break; } }
  if (!pad) return;
  gp.connected = true;

  const DEAD = 0.25;
  const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
  gp.left  = (pad.buttons[14]?.pressed) || ax < -DEAD;
  gp.right = (pad.buttons[15]?.pressed) || ax >  DEAD;
  gp.up    = (pad.buttons[12]?.pressed) || ay < -DEAD;
  gp.down  = (pad.buttons[13]?.pressed) || ay >  DEAD;
  gp.fire  = (pad.buttons[0]?.pressed)  || (pad.buttons[7]?.pressed); // A or R2

  const bombNow  = (pad.buttons[1]?.pressed) || (pad.buttons[2]?.pressed); // B or X
  const hyperNow = (pad.buttons[3]?.pressed);                               // Y
  const startNow = (pad.buttons[9]?.pressed) || (pad.buttons[8]?.pressed); // Start or Select

  gp.firedBomb  = bombNow  && !gp.prevBomb;
  gp.firedHyper = hyperNow && !gp.prevHyper;
  gp.firedStart = startNow && !gp.prevStart;

  gp.prevBomb  = bombNow;
  gp.prevHyper = hyperNow;
  gp.prevStart = startNow;
}

// ─── Keyboard ───────────────────────────────────────────────────────────────
const keys = {}, pressed = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true; e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Unified helpers
function iLeft()  { return keys['ArrowLeft']  || keys['KeyA'] || gp.left;  }
function iRight() { return keys['ArrowRight'] || keys['KeyD'] || gp.right; }
function iUp()    { return keys['ArrowUp']    || keys['KeyW'] || gp.up;    }
function iDown()  { return keys['ArrowDown']  || keys['KeyS'] || gp.down;  }
function iFire()  { return keys['Space'] || gp.fire; }
function iBomb()  { return pressed['KeyZ'] || gp.firedBomb; }
function iHyper() { return pressed['KeyX'] || gp.firedHyper; }
function iStart() { return pressed['Enter'] || pressed['Space'] || gp.firedStart; }

// ─── State ──────────────────────────────────────────────────────────────────
let state = 'title';
let score = 0, lives = 3, wave = 1;
let camera = 0, frameCount = 0, msgTimer = 0;

// ─── Player ─────────────────────────────────────────────────────────────────
let ship;
function resetShip() {
  ship = { wx: WORLD/2, y: GH/2-40, vx:0, vy:0, facing:1, alive:true,
           invTime:0, smartBombs:3, hyperCooldown:0, shootCooldown:0 };
}

// ─── Entities ───────────────────────────────────────────────────────────────
let bullets=[], enemyBullets=[];
// Each beam: { wx (world-fixed start), y (fixed), facing, life, maxLife, hue }
let beams=[];
let humanoids=[], landers=[], mutants=[], bombers=[], pods=[], swarmers=[];
let stargate = null;
let particles=[];
// Fireworks: rockets rise then burst into sparks (screen-space, not world-space)

// ─── Wave setup ─────────────────────────────────────────────────────────────
function spawnWave() {
  const d = Math.min(wave, 10);
  humanoids=[]; landers=[]; mutants=[]; bombers=[]; pods=[]; swarmers=[];
  bullets=[]; enemyBullets=[]; beams=[];
  for (let i=0;i<10;i++) humanoids.push({ wx:Math.random()*(WORLD-200)+100, y:GROUND_Y-20, vy:0, carried:false, carrier:null, alive:true });
  for (let i=0;i<4+d*2;i++) landers.push(makeLander());
  for (let i=0;i<Math.floor(d*1.5);i++) bombers.push(makeBomber());
  for (let i=0;i<Math.floor(d*0.8);i++) pods.push(makePod());
  if (!stargate) stargate = { wx:0, y:GH*0.25, w:50, h:Math.round(GH*0.16), pulse:0 };
  stargate.wx = Math.random()*(WORLD-200)+100;
  stargate.y = GH*0.25; stargate.h = Math.round(GH*0.16);
}

function makeLander() {
  return { wx:Math.random()*WORLD, y:Math.random()*(GH*0.4)+60, vx:(Math.random()-0.5)*4.2, vy:0,
           phase:'float', target:null, alive:true, shootTimer:Math.random()*180, hp:1 };
}
function makeBomber() {
  return { wx:Math.random()*WORLD, y:Math.random()*(GH*0.3)+50,
           vx:(Math.random()>0.5?1:-1)*(3.2+Math.random()*1.8), bombTimer:Math.random()*120+60, alive:true, hp:1 };
}
function makePod() {
  return { wx:Math.random()*WORLD, y:Math.random()*(GH*0.4)+40, vx:(Math.random()-0.5)*2.8, vy:0, alive:true, hp:3 };
}
function makeSwarmer(wx,y) {
  const a=Math.random()*Math.PI*2, s=5.5+Math.random()*2.5;
  return { wx, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, alive:true, hp:1, shootTimer:Math.random()*90 };
}
function makeMutant(wx,y) {
  return { wx, y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*7, alive:true, hp:2, chaseTimer:0 };
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function explode(wx,y,color,count) {
  for (let i=0;i<count;i++) {
    const a=Math.random()*Math.PI*2, s=Math.random()*4+1;
    particles.push({ wx, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:40+Math.random()*30, color, size:Math.random()*3+1 });
  }
}
function bigExplode(wx, y, colors, count) {
  // Core burst
  for (let i=0;i<count;i++) {
    const a=Math.random()*Math.PI*2;
    const s=Math.random()*8+2;
    const c=colors[Math.floor(Math.random()*colors.length)];
    particles.push({ wx, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:55+Math.random()*40, color:c, size:Math.random()*5+2 });
  }
  // Slower debris ring
  for (let i=0;i<count*0.6;i++) {
    const a=(i/count)*Math.PI*2;
    const s=Math.random()*3+1;
    particles.push({ wx, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-1, life:70+Math.random()*50, color:'#fff', size:Math.random()*2+1 });
  }
  // Fire sparks
  for (let i=0;i<count*0.4;i++) {
    const a=Math.random()*Math.PI*2, s=Math.random()*5+3;
    particles.push({ wx, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-2, life:30+Math.random()*20, color:'#ff8800', size:Math.random()*3+1 });
  }
}
function wxToSx(wx) {
  let dx=wx-camera;
  if (dx> WORLD/2) dx-=WORLD;
  if (dx<-WORLD/2) dx+=WORLD;
  return dx;
}
function worldWrap(wx) { return ((wx%WORLD)+WORLD)%WORLD; }
function onScreen(wx,m=60) { const s=wxToSx(wx); return s>-m&&s<W+m; }
function worldDist(ax,bx) { let d=ax-bx; if(d>WORLD/2)d-=WORLD; if(d<-WORLD/2)d+=WORLD; return d; }

// ─── Sound Engine ────────────────────────────────────────────────────────────
const AC = (() => { try { return new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; } })();

function unlockAudio() {
  if (AC && AC.state === 'suspended') AC.resume();
}
document.addEventListener('keydown', unlockAudio, { once: true });
document.addEventListener('pointerdown', unlockAudio, { once: true });

function playTone(opts) {
  if (!AC) return;
  const { type='sine', freq=440, freq2, freqTime, startFreq, vol=0.18, attack=0.005, decay=0.08, sustain=0, release=0.12, delay=0, duration } = opts;
  const t = AC.currentTime + delay;
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  const hold = duration || (attack + decay);
  g.gain.setValueAtTime(vol * sustain || vol * 0.3, t + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + hold + release);
  const o = AC.createOscillator();
  o.type = type;
  if (startFreq !== undefined) {
    o.frequency.setValueAtTime(startFreq, t);
    o.frequency.exponentialRampToValueAtTime(freq, t + (freqTime || decay));
  } else if (freq2 !== undefined) {
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq2, t + (freqTime || decay));
  } else {
    o.frequency.setValueAtTime(freq, t);
  }
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + hold + release + 0.05);
}

function playNoise(opts) {
  if (!AC) return;
  const { vol=0.15, attack=0.003, release=0.1, delay=0, filter=800, filterQ=1 } = opts;
  const t = AC.currentTime + delay;
  const buf = AC.createBuffer(1, AC.sampleRate * (release + 0.1), AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0; i<d.length; i++) d[i] = Math.random()*2-1;
  const src = AC.createBufferSource();
  src.buffer = buf;
  const filt = AC.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = filter; filt.Q.value = filterQ;
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + release);
  src.connect(filt); filt.connect(g); g.connect(AC.destination);
  src.start(t); src.stop(t + attack + release + 0.05);
}

// Named sound effects
function sndFire() {
  // Short zap — descending sweep
  playTone({ type:'sawtooth', startFreq:1800, freq:400, freqTime:0.04, vol:0.08, attack:0.001, decay:0.04, release:0.04 });
}
function sndAlienExplosion(big=false) {
  // Noisy crunch + pitched thump
  const vol = big ? 0.35 : 0.22;
  playNoise({ vol, attack:0.002, release: big ? 0.35 : 0.2, filter: big ? 350 : 600, filterQ: 0.8 });
  playTone({ type:'sawtooth', startFreq: big ? 220 : 440, freq: big ? 40 : 60, freqTime: big ? 0.25 : 0.15, vol: big ? 0.18 : 0.12, attack:0.001, decay: big ? 0.25 : 0.15, release:0.1 });
}
function sndShipExplosion() {
  playNoise({ vol:0.5, attack:0.001, release:0.6, filter:200, filterQ:0.5 });
  playTone({ type:'sawtooth', startFreq:600, freq:30, freqTime:0.4, vol:0.25, attack:0.001, decay:0.4, release:0.3 });
  playTone({ type:'sine', freq:80, vol:0.2, attack:0.01, decay:0.3, release:0.4, delay:0.05 });
}
function sndSmartBomb() {
  for (let i=0; i<5; i++) {
    playNoise({ vol:0.25, attack:0.002, release:0.2+i*0.06, filter:300+i*80, filterQ:0.6, delay:i*0.04 });
  }
  playTone({ type:'sine', freq:60, freq2:20, freqTime:0.5, vol:0.3, attack:0.01, decay:0.5, release:0.4 });
}
function sndHyperspace() {
  // Rising sweep then silence
  playTone({ type:'sine', startFreq:200, freq:2000, freqTime:0.3, vol:0.15, attack:0.01, decay:0.3, release:0.15 });
  playTone({ type:'triangle', startFreq:100, freq:3000, freqTime:0.25, vol:0.1, attack:0.005, decay:0.25, release:0.1, delay:0.05 });
}
function sndPodExplosion() {
  sndAlienExplosion(true);
  for (let i=0; i<4; i++) {
    playTone({ type:'square', startFreq:800+i*200, freq:150+i*50, freqTime:0.15, vol:0.08, attack:0.001, decay:0.15, release:0.1, delay:i*0.03 });
  }
}
function sndLanderShoot() {
  playTone({ type:'square', freq:280, freq2:180, freqTime:0.12, vol:0.09, attack:0.002, decay:0.1, release:0.08 });
}
function sndMutantHit() {
  playNoise({ vol:0.18, attack:0.001, release:0.15, filter:900, filterQ:1.2 });
  playTone({ type:'square', startFreq:600, freq:120, freqTime:0.1, vol:0.1, attack:0.001, decay:0.1, release:0.08 });
}
function snd1Up() {
  // Classic 1-up jingle: two rising tones
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => playTone({ type:'square', freq:f, vol:0.15, attack:0.005, decay:0.08, release:0.05, delay:i*0.09 }));
}
function sndFanfare() {
  // Brief level clear: ascending 4-note phrase
  const notes = [440, 554, 659, 880];
  notes.forEach((f, i) => playTone({ type:'square', freq:f, vol:0.18, attack:0.005, decay:0.1, release:0.06, delay:i*0.1 }));
  // Chord flourish at end
  [880, 1108, 1319].forEach((f, i) => playTone({ type:'sine', freq:f, vol:0.1, attack:0.01, decay:0.2, release:0.15, delay:0.42+i*0.01 }));
}
function sndBigFanfare() {
  // Every 5th wave — full triumph jingle
  const melody = [523, 523, 523, 415, 622, 523, 415, 622, 523];
  const times  = [0, 0.13, 0.26, 0.35, 0.45, 0.58, 0.68, 0.78, 0.92];
  melody.forEach((f, i) => playTone({ type:'square', freq:f, vol:0.2, attack:0.005, decay:0.1, release:0.07, delay:times[i] }));
  // Bass line
  const bass = [131, 131, 131, 104, 156, 131];
  const bt   = [0, 0.13, 0.26, 0.35, 0.45, 0.58];
  bass.forEach((f, i) => playTone({ type:'sawtooth', freq:f, vol:0.14, attack:0.005, decay:0.1, release:0.08, delay:bt[i] }));
  // Final chord
  [523, 659, 784, 1047].forEach((f, i) => playTone({ type:'sine', freq:f, vol:0.12, attack:0.02, decay:0.3, release:0.3, delay:1.05+i*0.01 }));
}


// ─── Fireworks ───────────────────────────────────────────────────────────────
const FW_PALETTES = [
  ['#ff4444','#ff8800','#ffff00','#fff'],
  ['#00ffff','#0088ff','#8800ff','#fff'],
  ['#00ff88','#00ffcc','#ffff00','#fff'],
  ['#ff00ff','#ff4488','#ffaaff','#fff'],
  ['#ffaa00','#ff6600','#fff','#ffff44'],
  ['#44ff00','#00ff44','#ffff00','#fff'],
];
let fireworks=[], fwSparks=[], fwSchedule=[];

function launchFirework(x, targetY, palette) {
  fireworks.push({ x, y:GH+10, targetY, vx:(Math.random()-0.5)*1.5, vy:-12-Math.random()*6, palette, burst:false, trail:[] });
}

function burstFirework(fw) {
  const count = 80+Math.random()*40;
  for (let i=0;i<count;i++) {
    const a=(i/count)*Math.PI*2+Math.random()*0.2, spd=2.5+Math.random()*4;
    const c=fw.palette[Math.floor(Math.random()*fw.palette.length)];
    fwSparks.push({ x:fw.x, y:fw.y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-1, life:70+Math.random()*50, maxLife:120, color:c, size:2+Math.random()*2 });
  }
  for (let i=0;i<24;i++) {
    const a=(i/24)*Math.PI*2;
    fwSparks.push({ x:fw.x, y:fw.y, vx:Math.cos(a)*6.5, vy:Math.sin(a)*6.5, life:50, maxLife:50, color:'#fff', size:3 });
  }
}

function updateFireworks() {
  // Launch scheduled rockets
  for (const s of fwSchedule) { if (--s.delay <= 0) launchFirework(s.x, s.targetY, s.palette); }
  fwSchedule = fwSchedule.filter(s => s.delay > 0);

  for (const fw of fireworks) {
    fw.trail.push({x:fw.x, y:fw.y});
    if (fw.trail.length > 10) fw.trail.shift();
    fw.x += fw.vx; fw.y += fw.vy; fw.vy += 0.25;
    if (!fw.burst && fw.y <= fw.targetY) { fw.burst=true; burstFirework(fw); }
  }
  fireworks = fireworks.filter(fw => !fw.burst);
  fwSparks  = fwSparks.filter(s => { s.x+=s.vx; s.y+=s.vy; s.vy+=0.08; s.vx*=0.97; return --s.life>0; });
}

function drawFireworks() {
  for (const fw of fireworks) {
    for (let i=0;i<fw.trail.length;i++) {
      const t=fw.trail[i], a=i/fw.trail.length;
      ctx.globalAlpha=a*0.7; ctx.fillStyle=fw.palette[0];
      ctx.beginPath(); ctx.arc(t.x, t.y, a*3, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.fillStyle='#fff';
    ctx.shadowColor=fw.palette[0]; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(fw.x, fw.y, 3, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
  for (const s of fwSparks) {
    const a=s.life/s.maxLife;
    ctx.globalAlpha=a; ctx.fillStyle=s.color;
    ctx.shadowColor=s.color; ctx.shadowBlur=6*a;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size*a, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

function scheduleFireworks(big) {
  fireworks=[]; fwSparks=[];
  const count = big ? 18 : 7;
  for (let i=0;i<count;i++) {
    fwSchedule.push({
      delay: i*(big?14:22)+Math.floor(Math.random()*8),
      x: 60+Math.random()*(W-120),
      targetY: 40+Math.random()*(GH*0.55),
      palette: FW_PALETTES[Math.floor(Math.random()*FW_PALETTES.length)]
    });
  }
}

function update() {
  pollGamepad();
  frameCount++;
  if (msgTimer>0) msgTimer--;
  if (msgTimer===0&&msgEl.textContent!=='') msgEl.textContent='';

  if (state==='title')   { if(iStart()) startGame(); clearInput(); return; }
  if (state==='gameover'){ if(iStart()) state='title'; clearInput(); return; }
  if (state==='waveStart'){ updateFireworks(); if(msgTimer<=0){ fireworks=[]; fwSparks=[]; fwSchedule=[]; state='playing'; } clearInput(); return; }
  if (state==='dead') {
    if(msgTimer<=0) { if(lives>0) respawn(); else { state='gameover'; showMsg('GAME OVER'); } }
    updateParticles(); clearInput(); return;
  }

  // Ship
  const ACCEL=0.85, DRAG=0.84, MAX_VX=16, MAX_VY=11;
  let tx=0, ty=0;
  if(iLeft())  { tx=-1; ship.facing=-1; }
  if(iRight()) { tx= 1; ship.facing= 1; }
  if(iUp())    ty=-1;
  if(iDown())  ty= 1;
  ship.vx=Math.max(-MAX_VX,Math.min(MAX_VX,(ship.vx+tx*ACCEL)*DRAG));
  ship.vy=Math.max(-MAX_VY,Math.min(MAX_VY,(ship.vy+ty*ACCEL)*DRAG));
  ship.wx=worldWrap(ship.wx+ship.vx);
  ship.y=Math.max(30,Math.min(GROUND_Y-20,ship.y+ship.vy));
  camera=ship.wx-W/2;

  // ── Beam autofire ──
  // shootCooldown reused as beam fire rate timer
  if (ship.shootCooldown > 0) ship.shootCooldown--;
  if (iFire() && ship.shootCooldown <= 0) {
    // Beam extends from ship nose to the screen edge in facing direction
    const shipSx = wxToSx(ship.wx);
    const distToEdge = ship.facing > 0 ? (W - shipSx) : shipSx;
    const BEAM_LEN = distToEdge + 20; // in screen pixels = world units (1:1 at this scale)
    const hue = (frameCount * 14) % 360;
    beams.push({
      wx: ship.wx + ship.facing * 18,
      y:  ship.y,
      facing: ship.facing,
      len: BEAM_LEN,
      life: 18, maxLife: 18,
      hue
    });
    ship.shootCooldown = 8;
    sndFire();
  }
  // Age / remove expired beams
  beams = beams.filter(b => --b.life > 0);
  // Build bullet hit-points covering the full visible beam width
  bullets = [];
  for (const bm of beams) {
    const sx0 = wxToSx(bm.wx);
    if (bm.facing > 0 && sx0 > W) continue;
    if (bm.facing < 0 && sx0 < 0) continue;
    const steps = 20;
    for (let s = 0; s <= steps; s++) {
      const frac = s / steps;
      // screen x interpolated toward edge
      const sxSample = sx0 + bm.facing * frac * (bm.facing > 0 ? (W - sx0 + 20) : (sx0 + 20));
      // convert screen x back to world x for hit detection
      const wxSample = worldWrap(camera + sxSample);
      bullets.push({ wx: wxSample, y: bm.y, life: 2, vx: 0 });
    }
  }
  if(iBomb()&&ship.smartBombs>0) { ship.smartBombs--; smartBomb(); }
  if(iHyper()&&ship.hyperCooldown<=0) {
    ship.wx=Math.random()*WORLD; ship.y=Math.random()*(GROUND_Y-80)+60;
    ship.vx=ship.vy=0; ship.hyperCooldown=180;
    explode(ship.wx,ship.y,'#0ff',20); showMsg('HYPERSPACE!'); sndHyperspace();
  }
  if(ship.hyperCooldown>0) ship.hyperCooldown--;
  if(ship.invTime>0) ship.invTime--;

  // bullets rebuilt from beams each frame above; no filter needed
  enemyBullets=enemyBullets.filter(b=>{
    b.wx=worldWrap(b.wx+b.vx*1.6); b.y+=b.vy*1.6; b.life--;
    if(ship.alive&&ship.invTime<=0&&Math.abs(worldDist(b.wx,ship.wx))<12&&Math.abs(b.y-ship.y)<10) { killShip(); return false; }
    return b.life>0&&b.y>0&&b.y<H;
  });

  updateLanders(); updateMutants(); updateBombers(); updatePods(); updateSwarmers();

  stargate.pulse=(stargate.pulse+0.05)%(Math.PI*2);
  if(Math.abs(worldDist(ship.wx,stargate.wx))<stargate.w/2&&Math.abs(ship.y-(stargate.y+stargate.h/2))<stargate.h/2) {
    addScore(500); ship.wx=worldWrap(ship.wx+WORLD*0.4); showMsg('STARGATE WARP!');
  }

  updateParticles();
  checkBulletHits();

  if(landers.length+mutants.length+bombers.length+pods.length+swarmers.length===0&&state==='playing') {
    wave++;
    // 1-up every wave
    lives++;
    const isMilestone = (wave % 5 === 0);
    // Fanfare sounds — stagger 1up jingle after fanfare begins
    if (isMilestone) { setTimeout(sndBigFanfare, 200); setTimeout(snd1Up, 1400); }
    else             { setTimeout(sndFanfare, 100);    setTimeout(snd1Up, 520);  }
    scheduleFireworks(isMilestone);
    spawnWave();
    showMsg(isMilestone ? `★ WAVE ${wave} ★  BONUS LIFE!` : `WAVE ${wave}  +1 LIFE`);
    state='waveStart';
    msgTimer = isMilestone ? 220 : 140;
  }
  if(humanoids.filter(h=>h.alive).length===0&&mutants.length===0&&landers.length>0) {
    for(const l of landers) if(l.alive) { mutants.push(makeMutant(l.wx,l.y)); l.alive=false; }
    landers=landers.filter(l=>l.alive);
  }
  clearInput();
}

function clearInput() {
  for(const k in pressed) pressed[k]=false;
  gp.firedBomb=gp.firedHyper=gp.firedStart=false;
}

function updateLanders() {
  for(const l of landers) {
    if(!l.alive) continue;
    l.wx=worldWrap(l.wx+l.vx);
    if(l.phase==='float'&&Math.random()<0.003) {
      const h=humanoids.find(h=>h.alive&&!h.carried);
      if(h) { l.phase='descend'; l.target=h; }
    }
    if(l.phase==='descend'&&l.target) {
      const dx=worldDist(l.wx,l.target.wx); l.wx=worldWrap(l.wx-dx*0.07); l.y+=1.6;
      if(l.y>=l.target.y-5) { l.phase='carry'; l.target.carried=true; l.target.carrier=l; }
    }
    if(l.phase==='carry'&&l.target) {
      l.y-=1.8; l.target.y=l.y+18; l.target.wx=l.wx;
      if(l.y<30) { mutants.push(makeMutant(l.wx,l.y)); l.target.alive=false; l.alive=false; }
    }
    if(l.y<50) l.y=50;
    if(l.y>GROUND_Y-20&&l.phase!=='carry') l.y=GROUND_Y-20;
    if(--l.shootTimer<=0) { l.shootTimer=100+Math.random()*120; shootAt(l.wx,l.y,ship.wx,ship.y,5,6); sndLanderShoot(); }
  }
  landers=landers.filter(l=>l.alive);
}
function updateMutants() {
  for(const m of mutants) {
    if(!m.alive) continue;
    if(--m.chaseTimer<=0) {
      m.chaseTimer=30;
      const dx=worldDist(ship.wx,m.wx),dy=ship.y-m.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      m.vx=dx/d*8; m.vy=dy/d*8;
    }
    m.wx=worldWrap(m.wx+m.vx); m.y=Math.max(20,Math.min(GROUND_Y-10,m.y+m.vy));
    if(ship.invTime<=0&&Math.abs(worldDist(m.wx,ship.wx))<14&&Math.abs(m.y-ship.y)<12) killShip();
  }
  mutants=mutants.filter(m=>m.alive);
}
function updateBombers() {
  for(const b of bombers) {
    if(!b.alive) continue;
    b.wx=worldWrap(b.wx+b.vx);
    if(--b.bombTimer<=0) {
      b.bombTimer=90+Math.random()*90;
      const dy=ship.y-b.y;
      enemyBullets.push({ wx:b.wx, y:b.y, vx:0, vy:dy>0?2:-2, life:90, color:'#fa0' });
    }
  }
  bombers=bombers.filter(b=>b.alive);
}
function updatePods() {
  for(const p of pods) { if(!p.alive) continue; p.wx=worldWrap(p.wx+p.vx); p.y+=Math.sin(frameCount*0.03+p.wx*0.01)*0.3; }
  pods=pods.filter(p=>p.alive);
}
function updateSwarmers() {
  for(const s of swarmers) {
    if(!s.alive) continue;
    s.wx=worldWrap(s.wx+s.vx); s.y+=s.vy;
    if(s.y<20||s.y>GROUND_Y-10) s.vy*=-1;
    if(--s.shootTimer<=0) { s.shootTimer=60+Math.random()*60; shootAt(s.wx,s.y,ship.wx,ship.y,4.5,5); }
    const dx=worldDist(ship.wx,s.wx),dy=ship.y-s.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    s.vx+=dx/d*0.22; s.vy+=dy/d*0.22;
    const sp=Math.sqrt(s.vx*s.vx+s.vy*s.vy); if(sp>9){s.vx=s.vx/sp*9;s.vy=s.vy/sp*9;}
    if(ship.invTime<=0&&Math.abs(worldDist(s.wx,ship.wx))<12&&Math.abs(s.y-ship.y)<10) killShip();
  }
  swarmers=swarmers.filter(s=>s.alive);
}
function updateParticles() {
  particles=particles.filter(p=>{ p.wx=worldWrap(p.wx+p.vx); p.y+=p.vy; p.vy+=0.05; p.vx*=0.97; return --p.life>0; });
}
function checkBulletHits() {
  for(const b of bullets) {
    for(const e of landers) {
      if(!e.alive) continue;
      if(Math.abs(worldDist(b.wx,e.wx))<14&&Math.abs(b.y-e.y)<14) {
        e.alive=false; b.life=0;
        if(e.target?.carried){e.target.carried=false;e.target.carrier=null;e.target.vy=2;}
        bigExplode(e.wx,e.y,['#0f0','#0ff','#fff','#ffff00'],40); addScore(150); sndAlienExplosion();
      }
    }
    for(const e of mutants) {
      if(!e.alive) continue;
      if(Math.abs(worldDist(b.wx,e.wx))<14&&Math.abs(b.y-e.y)<14) {
        if(--e.hp<=0){e.alive=false;bigExplode(e.wx,e.y,['#f0f','#ff00ff','#fff','#ff8800'],50);addScore(250);sndMutantHit();}
        else { sndMutantHit(); }
        b.life=0;
      }
    }
    for(const e of bombers) {
      if(!e.alive) continue;
      if(Math.abs(worldDist(b.wx,e.wx))<14&&Math.abs(b.y-e.y)<12) {
        e.alive=false;b.life=0;bigExplode(e.wx,e.y,['#fa0','#f80','#fff','#ff0'],45);addScore(200);sndAlienExplosion();
      }
    }
    for(const e of pods) {
      if(!e.alive) continue;
      if(Math.abs(worldDist(b.wx,e.wx))<18&&Math.abs(b.y-e.y)<18) {
        b.life=0;
        if(--e.hp<=0){e.alive=false;bigExplode(e.wx,e.y,['#ff0','#fff','#fa0','#ff8800','#f00'],80);addScore(1000);sndPodExplosion();for(let i=0;i<4;i++)swarmers.push(makeSwarmer(e.wx,e.y));}
      }
    }
    for(const e of swarmers) {
      if(!e.alive) continue;
      if(Math.abs(worldDist(b.wx,e.wx))<10&&Math.abs(b.y-e.y)<10) {
        e.alive=false;b.life=0;bigExplode(e.wx,e.y,['#ff4','#ff0','#fff','#fa0'],30);addScore(150);sndAlienExplosion();
      }
    }
  }
  for(const h of humanoids) {
    if(!h.alive||h.carried) continue;
    if(h.vy>0) {
      h.y+=h.vy; h.vy+=0.1;
      if(Math.abs(worldDist(h.wx,ship.wx))<20&&Math.abs(h.y-ship.y)<20){h.vy=0;h.y=ship.y;addScore(500);showMsg('HUMANOID SAVED! +500');}
      if(h.y>=GROUND_Y-15){h.y=GROUND_Y-15;h.vy=0;}
    }
  }
}
function shootAt(fx,fy,tx,ty,spd,life) {
  const dx=worldDist(tx,fx),dy=ty-fy,d=Math.sqrt(dx*dx+dy*dy)||1;
  enemyBullets.push({ wx:fx, y:fy, vx:dx/d*spd, vy:dy/d*spd, life:life*10, color:'#f44' });
}
function smartBomb() {
  for(const arr of [landers,mutants,bombers,pods,swarmers])
    for(const e of arr) { if(!e.alive||!onScreen(e.wx,100)) continue; e.hp=0;e.alive=false;bigExplode(e.wx,e.y,['#fff','#ff0','#f80','#0ff'],50);addScore(100); }
  enemyBullets=enemyBullets.filter(b=>!onScreen(b.wx));
  showMsg('SMART BOMB!'); sndSmartBomb();
}
function killShip() {
  if(!ship.alive||ship.invTime>0) return;
  ship.alive=false; lives--;
  explode(ship.wx,ship.y,'#0ff',30); sndShipExplosion();
  state='dead'; msgTimer=120; showMsg(lives>0?'YOU DIED!':'GAME OVER');
}
function respawn() { resetShip(); ship.invTime=180; state='playing'; beams=[]; }
function addScore(n) {
  const prev=score; score+=n;
  if(Math.floor(prev/10000)<Math.floor(score/10000)){lives++;showMsg('BONUS LIFE!');}
}
function showMsg(m,t=90) { msgEl.textContent=m; msgTimer=t; }
function startGame() {
  score=0;lives=3;wave=1;
  particles=[]; resetShip(); spawnWave();
  state='waveStart'; showMsg('WAVE 1'); msgTimer=100;
}

// ─── Stars ───────────────────────────────────────────────────────────────────
const STAR_LAYERS=(()=>{
  const ls=[];
  for(let li=0;li<3;li++){const s=[];for(let i=0;i<60;i++)s.push({x:Math.random(),y:Math.random()});ls.push(s);}
  return ls;
})();

// ─── Draw ────────────────────────────────────────────────────────────────────
function draw() {
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);

  ctx.save();
  drawStars(); drawGround();
  if(state==='title'){drawTitle();ctx.restore();return;}
  if(state==='gameover'){drawGameOver();ctx.restore();return;}

  drawStargate();
  for(const h of humanoids){if(!h.alive)continue;const sx=wxToSx(h.wx);if(sx>-20&&sx<W+20)drawHumanoid(sx,h.y);}
  for(const l of landers){const sx=wxToSx(l.wx);if(sx>-30&&sx<W+30)drawLander(sx,l.y,l.phase);}
  for(const m of mutants){const sx=wxToSx(m.wx);if(sx>-30&&sx<W+30)drawMutant(sx,m.y);}
  for(const b of bombers){const sx=wxToSx(b.wx);if(sx>-30&&sx<W+30)drawBomber(sx,b.y);}
  for(const p of pods){const sx=wxToSx(p.wx);if(sx>-30&&sx<W+30)drawPod(sx,p.y);}
  for(const s of swarmers){const sx=wxToSx(s.wx);if(sx>-20&&sx<W+20)drawSwarmer(sx,s.y);}

  // Draw beams (world-fixed, fade out, always reach screen edge)
  if (beams.length > 0) {
    ctx.save();
    ctx.lineCap = 'round';
    for (const bm of beams) {
      const alpha = bm.life / bm.maxLife;
      const sx0 = wxToSx(bm.wx);
      // Always draw to screen edge in facing direction
      const sx1 = bm.facing > 0 ? W + 8 : -8;
      // Skip if start is off-screen on the wrong side
      if (bm.facing > 0 && sx0 > W) continue;
      if (bm.facing < 0 && sx0 < 0) continue;
      // Outer wide glow
      ctx.globalAlpha = alpha * 0.3;
      ctx.strokeStyle = `hsl(${bm.hue},100%,65%)`;
      ctx.lineWidth = 14;
      ctx.shadowColor = `hsl(${bm.hue},100%,55%)`;
      ctx.shadowBlur = 24;
      ctx.beginPath(); ctx.moveTo(sx0, bm.y); ctx.lineTo(sx1, bm.y); ctx.stroke();
      // Mid glow
      ctx.globalAlpha = alpha * 0.6;
      ctx.strokeStyle = `hsl(${(bm.hue+40)%360},100%,75%)`;
      ctx.lineWidth = 5;
      ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(sx0, bm.y); ctx.lineTo(sx1, bm.y); ctx.stroke();
      // Bright core
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = `hsl(${(bm.hue+80)%360},100%,95%)`;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 4;
      ctx.beginPath(); ctx.moveTo(sx0, bm.y); ctx.lineTo(sx1, bm.y); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
  for(const b of enemyBullets){
    const sx=wxToSx(b.wx);if(sx<0||sx>W)continue;
    const bc=b.color||'#f44';
    ctx.save();
    ctx.fillStyle=bc;ctx.shadowColor=bc;ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(sx,b.y,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(sx,b.y,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  for(const p of particles){const sx=wxToSx(p.wx);if(sx<-10||sx>W+10)continue;ctx.globalAlpha=p.life/70;ctx.fillStyle=p.color;ctx.fillRect(sx-p.size/2,p.y-p.size/2,p.size,p.size);}
  ctx.globalAlpha=1;

  if(ship.alive&&(ship.invTime<=0||frameCount%6<3)){
    const sx=wxToSx(ship.wx);
    drawShip(sx,ship.y,ship.facing);
    if(iLeft()||iRight()){ctx.fillStyle='#0ff5';ctx.beginPath();ctx.arc(sx-ship.facing*24,ship.y,8+Math.random()*6,0,Math.PI*2);ctx.fill();}
  }
  if(state==='waveStart'||fwSparks.length>0) drawFireworks();
  drawMinimap();
  // Simple in-game HUD text
  ctx.save();
  ctx.textBaseline = 'top'; ctx.shadowBlur = 0;
  ctx.font = 'bold 16px Courier New'; ctx.fillStyle = '#0ff'; ctx.textAlign = 'left';
  ctx.fillText('SCORE  ' + score.toString().padStart(7,'0'), 10, 8);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff0'; ctx.fillText('WAVE ' + wave, W/2, 8);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#0ff'; ctx.fillText('LIVES ' + lives + '  BOMBS ' + (ship ? ship.smartBombs : 0), W - 10, 8);
  ctx.restore();
  ctx.restore(); // end game-area clip+translate
}

function drawStars() {
  const px=[0.1,0.3,0.6],br=['#333','#555','#888'];
  for(let li=0;li<3;li++){
    ctx.fillStyle=br[li];
    for(const s of STAR_LAYERS[li]){
      const sx=((s.x*WORLD-camera*px[li])%W+W)%W, sy=s.y*(GROUND_Y-20);
      ctx.fillRect(sx,sy,li+1,li+1);
    }
  }
}
function drawGround() {
  ctx.beginPath();
  for(let sx=0;sx<=W;sx+=4){
    const wx=camera+sx, gy=GROUND_Y+Math.sin(wx*0.008)*12+Math.sin(wx*0.003)*18;
    sx===0?ctx.moveTo(sx,gy):ctx.lineTo(sx,gy);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
  ctx.fillStyle='#002200';ctx.fill();ctx.strokeStyle='#0f0';ctx.lineWidth=2;ctx.stroke();
}
function drawShip(sx,y,facing) {
  ctx.save();ctx.translate(sx,y);ctx.scale(facing,1);
  // Main hull
  ctx.fillStyle='#0ff';
  ctx.beginPath();ctx.moveTo(32,0);ctx.lineTo(-20,-14);ctx.lineTo(-12,0);ctx.lineTo(-20,14);ctx.closePath();ctx.fill();
  // Cockpit
  ctx.fillStyle='#08f';ctx.beginPath();ctx.ellipse(8,0,13,7,0,0,Math.PI*2);ctx.fill();
  // Cannon barrel
  ctx.fillStyle='#fff';ctx.fillRect(20,-3,16,6);
  // Glow
  ctx.shadowColor='#0ff';ctx.shadowBlur=18;ctx.strokeStyle='#0ff';ctx.lineWidth=1.5;ctx.stroke();
  // Engine glow dot
  ctx.fillStyle='#0ff8';ctx.beginPath();ctx.arc(-18,0,5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawLander(sx,y,phase) {
  ctx.save();ctx.translate(sx,y);
  const c=phase==='carry'?'#f88':phase==='descend'?'#fa0':'#0f0';
  ctx.strokeStyle=c;ctx.fillStyle=c+'44';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();ctx.stroke();
  for(let i=0;i<3;i++){const a=(i/3)*Math.PI+Math.PI/6;ctx.beginPath();ctx.moveTo(Math.cos(a)*18,Math.sin(a)*18+6);ctx.lineTo(Math.cos(a)*28,Math.sin(a)*28+12);ctx.stroke();}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-3,5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawMutant(sx,y) {
  ctx.save();ctx.translate(sx,y);const t=frameCount*0.15;
  ctx.strokeStyle='#f0f';ctx.fillStyle='#f0f3';ctx.lineWidth=2.5;ctx.beginPath();
  for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2,r=(i%2===0?22:11)+Math.sin(t+i)*3;i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
  ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}
function drawBomber(sx,y) {
  ctx.save();ctx.translate(sx,y);ctx.strokeStyle='#fa0';ctx.fillStyle='#fa04';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(26,9);ctx.lineTo(0,4);ctx.lineTo(-26,9);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(0,4,5,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawPod(sx,y) {
  ctx.save();ctx.translate(sx,y);ctx.strokeStyle='#ff0';ctx.fillStyle='#ff04';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#ff08';ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;i===0?ctx.moveTo(Math.cos(a)*16,Math.sin(a)*16):ctx.lineTo(Math.cos(a)*16,Math.sin(a)*16);}
  ctx.closePath();ctx.stroke();ctx.restore();
}
function drawSwarmer(sx,y) {
  ctx.save();ctx.translate(sx,y);ctx.beginPath();
  for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2;i===0?ctx.moveTo(Math.cos(a)*13,Math.sin(a)*13):ctx.lineTo(Math.cos(a)*13,Math.sin(a)*13);}
  ctx.closePath();ctx.strokeStyle='#ff4';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#ff42';ctx.fill();ctx.restore();
}
function drawHumanoid(sx,y) {
  ctx.save();ctx.translate(sx,y);ctx.strokeStyle='#8f8';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(0,-12,4,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(0,0);ctx.stroke();
  const arm=Math.sin(frameCount*0.1)*5;
  ctx.beginPath();ctx.moveTo(-6,-4+arm);ctx.lineTo(0,-5);ctx.lineTo(6,-4-arm);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-5,10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(5,10);ctx.stroke();
  ctx.restore();
}
function drawStargate() {
  const sg=stargate, sx=wxToSx(sg.wx);
  if(sx<-80||sx>W+80) return;
  ctx.save();ctx.translate(sx,sg.y);
  const pulse=Math.sin(sg.pulse)*0.3+0.7;
  ctx.strokeStyle=`rgba(0,200,255,${pulse})`;ctx.lineWidth=3;ctx.shadowColor='#0cf';ctx.shadowBlur=20*pulse;
  ctx.beginPath();ctx.ellipse(0,sg.h/2,sg.w/2,sg.h/2,0,0,Math.PI*2);ctx.stroke();
  for(let i=0;i<6;i++){
    const ang=(i/6)*Math.PI*2+frameCount*0.03;
    ctx.strokeStyle=`rgba(0,100,255,${pulse*0.5})`;ctx.lineWidth=1;ctx.beginPath();
    ctx.moveTo(0,sg.h/2);ctx.quadraticCurveTo(Math.cos(ang)*sg.w*0.4,sg.h/2+Math.sin(ang)*sg.h*0.3,Math.cos(ang+0.5)*sg.w*0.3,sg.h/2+Math.sin(ang+0.5)*sg.h*0.25);ctx.stroke();
  }
  ctx.fillStyle=`rgba(0,255,255,${pulse})`;ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.fillText('STARGATE',0,sg.h+14);
  ctx.restore();
}
function drawMinimap() {
  const mh=Math.max(18,Math.round(GH*0.04)), my=GH-mh-2;
  ctx.fillStyle='#001a00';ctx.fillRect(0,my,W,mh);ctx.strokeStyle='#0f04';ctx.strokeRect(0,my,W,mh);
  const viewW=(W/WORLD)*W, viewX=((camera%WORLD)+WORLD)%WORLD/WORLD*W;
  ctx.fillStyle='#0f02';ctx.fillRect(viewX,my,viewW,mh);
  const toMap=wx=>((wx%WORLD)+WORLD)%WORLD/WORLD*W;
  for(const h of humanoids) if(h.alive){ctx.fillStyle='#0f0';ctx.fillRect(toMap(h.wx)-1,my+mh-4,2,3);}
  for(const l of landers)   if(l.alive){ctx.fillStyle='#0f0';ctx.fillRect(toMap(l.wx)-1,my+3,2,2);}
  for(const m of mutants)   if(m.alive){ctx.fillStyle='#f0f';ctx.fillRect(toMap(m.wx)-1,my+3,2,2);}
  for(const b of bombers)   if(b.alive){ctx.fillStyle='#fa0';ctx.fillRect(toMap(b.wx)-1,my+3,2,2);}
  for(const p of pods)      if(p.alive){ctx.fillStyle='#ff0';ctx.fillRect(toMap(p.wx)-2,my+3,4,4);}
  for(const s of swarmers)  if(s.alive){ctx.fillStyle='#ff4';ctx.fillRect(toMap(s.wx)-1,my+3,2,2);}
  ctx.fillStyle='#0cf';ctx.fillRect(toMap(stargate.wx)-2,my+2,4,mh-4);
  ctx.fillStyle='#fff';ctx.fillRect(toMap(ship.wx)-2,my+mh/2-2,5,5);
}
function drawTitle() {
  const t=frameCount*0.02;
  ctx.save();ctx.translate(W/2,GH/2-GH*0.2);
  ctx.shadowColor='#0cf';ctx.shadowBlur=30+Math.sin(t)*15;ctx.fillStyle='#0cf';
  ctx.font=`bold ${Math.round(GH*0.11)}px Courier New`;ctx.textAlign='center';ctx.fillText('STARGATE',0,0);
  ctx.shadowBlur=10;ctx.fillStyle='#0f0';ctx.font=`${Math.round(GH*0.03)}px Courier New`;ctx.fillText('DEFENDER II',0,Math.round(GH*0.055));
  ctx.restore();
  ctx.fillStyle='#fff';ctx.font=`${Math.round(GH*0.026)}px Courier New`;ctx.textAlign='center';
  ctx.fillText('PRESS SPACE or START TO PLAY',W/2,GH/2+GH*0.05);
  ctx.fillStyle='#666';ctx.font=`${Math.round(GH*0.017)}px Courier New`;
  ctx.fillText('KEYBOARD: Arrows · Space=Fire · Z=Bomb · X=Hyper',W/2,GH/2+GH*0.13);
  ctx.fillText('GAMEPAD:  Stick/DPad · A=Fire · B=Bomb · Y=Hyper · Start',W/2,GH/2+GH*0.16);
  ctx.fillText('Rescue humanoids · Pods split into Swarmers · Fly through STARGATE to warp',W/2,GH/2+GH*0.2);
  drawShip(W/2+Math.sin(t)*W*0.22,GH/2-GH*0.04,1);
}
function drawGameOver() {
  ctx.fillStyle='#000c';ctx.fillRect(0,0,W,GH);
  ctx.fillStyle='#f44';ctx.font=`bold ${Math.round(GH*0.1)}px Courier New`;ctx.textAlign='center';
  ctx.shadowColor='#f00';ctx.shadowBlur=20;ctx.fillText('GAME OVER',W/2,GH/2-GH*0.04);
  ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font=`${Math.round(GH*0.035)}px Courier New`;ctx.fillText('SCORE: '+score,W/2,GH/2+GH*0.06);
  ctx.fillStyle='#888';ctx.font=`${Math.round(GH*0.022)}px Courier New`;ctx.fillText('PRESS SPACE or START TO CONTINUE',W/2,GH/2+GH*0.14);
}

// ─── Loop ────────────────────────────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }

resize();
loop();
</script>
